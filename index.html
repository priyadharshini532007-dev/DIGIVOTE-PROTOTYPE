<title>DigiVote Simulation</title>

<style>
:root {
  --navy-950:#030820; --navy-900:#f1f5ff; --navy-800:#e0e9ff; --navy-700:#7fb0ff; --navy-600:#4f8dff; --navy-100:#c7d5ff; --navy-50:#eef3ff;
  --slate-50:#0f1941; --slate-100:#131f4d; --slate-200:#1c2b61; --slate-300:#2a3c82; --slate-400:#6577b3; --slate-500:#8e9dcc; --slate-600:#a9b6dd; --slate-700:#c5cfee; --slate-800:#e3e9fb; --slate-900:#f4f7ff;
  --green-50:#0b2a24; --green-100:#0f3a30; --green-200:#176b52; --green-700:#34d399; --green-800:#6ee7b7; --green-900:#a7f3d0;
  --amber-50:#2e220a; --amber-100:#3d2c0a; --amber-200:#7a5a12; --amber-800:#fcd34d; --amber-900:#fde68a;
  --red-50:#2e1016; --red-100:#40131b; --red-200:#7a2330; --red-700:#f87171; --red-800:#fca5a5; --red-900:#fecaca;
  --violet-100:#2a1f5c; --violet-800:#c4b5fd;
  --bg:#040716; --card:#0a1230; --text:var(--slate-800); --muted:var(--slate-600); --border:#1c2b61;
  --brand:#2563eb; --brand-hover:#3b82f6; --brand-grad:linear-gradient(135deg,#1d6bff 0%,#3b5bff 55%,#6d4bff 100%);
  --panel-2:rgba(59,130,246,.1); --accent-soft:rgba(59,130,246,.18); --danger:#dc2626; --danger-hover:#ef4444;
  --radius:12px; --shadow:0 8px 28px -14px rgba(30,80,255,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.55);
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
a { color:var(--navy-700); }
h1,h2,h3,h4,p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--navy-600); outline-offset:2px; }
h1[tabindex="-1"]:focus { outline:none; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.mono { font-family:var(--mono); }
.muted { color:var(--muted); } .small { font-size:12px; } .xs { font-size:11px; }
.strong { font-weight:600; color:var(--navy-900); }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.row.between { justify-content:space-between; } .row.end { justify-content:flex-end; } .row.top { align-items:flex-start; }
.stack > * + * { margin-top:16px; } .stack-sm > * + * { margin-top:8px; } .stack-lg > * + * { margin-top:24px; }
.grid { display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
@media (min-width:640px){ .g-sm-2{grid-template-columns:repeat(2,minmax(0,1fr));} .g-sm-3{grid-template-columns:repeat(3,minmax(0,1fr));} }
@media (min-width:1024px){ .g-lg-2{grid-template-columns:repeat(2,minmax(0,1fr));} .g-lg-3{grid-template-columns:repeat(3,minmax(0,1fr));} .g-lg-4{grid-template-columns:repeat(4,minmax(0,1fr));} .g-lg-6{grid-template-columns:repeat(6,minmax(0,1fr));} .g-lg-5{grid-template-columns:repeat(5,minmax(0,1fr));} .span-2{grid-column:span 2;} }
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.w-full{width:100%}

/* Simulation panel (outside the app) */
.sim-bar { position:fixed; left:12px; bottom:12px; z-index:65; font-size:12px; color:#78350f; }
.sim-pill { display:inline-flex; align-items:center; gap:6px; border:1px solid #f59e0b; background:#fef3c7; color:#78350f; border-radius:999px; padding:7px 14px; font-weight:600; cursor:pointer; box-shadow:var(--shadow-lg); }
.sim-panel { width:300px; max-width:calc(100vw - 24px); background:var(--card)beb; border:1px solid #f59e0b; border-radius:10px; padding:10px 12px; box-shadow:var(--shadow-lg); max-height:calc(100vh - 24px); overflow-y:auto; }
.sim-panel .iconbtn { color:#78350f; }
.sim-panel button:not(.iconbtn) { font-size:12px; border:1px solid #f59e0b88; background:var(--card); color:#78350f; border-radius:6px; padding:4px 10px; cursor:pointer; }
.sim-panel .tour { margin:6px 0 0; padding:0; list-style:none; }
.sim-panel .tour button { display:block; width:100%; text-align:left; border:0 !important; background:transparent !important; padding:4px 6px !important; border-radius:4px; }
.sim-panel .tour button:hover { background:#fde68a !important; }
body { padding-bottom:64px; }
/* Buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:6px; font-weight:500; padding:8px 16px; font-size:14px; border:1px solid transparent; cursor:pointer; text-decoration:none; transition:background .15s; white-space:nowrap; }
.btn.sm { padding:5px 12px; font-size:13px; } .btn.lg { padding:10px 20px; font-size:15px; }
.btn.primary { background:var(--brand); color:#fff; } .btn.primary:hover { background:var(--brand-hover); }
.btn.secondary { background:var(--card); color:var(--navy-900); border-color:var(--slate-300); } .btn.secondary:hover { background:var(--slate-50); }
.btn.danger { background:var(--danger); color:#fff; } .btn.danger:hover { background:var(--danger-hover); }
.btn.ghost { background:transparent; color:var(--navy-700); } .btn.ghost:hover { background:var(--panel-2); }
.btn:disabled, .btn[aria-disabled=true] { background:var(--slate-300) !important; color:#fff !important; border-color:transparent !important; cursor:not-allowed; }
.btn.secondary:disabled { background:var(--card) !important; color:var(--slate-400) !important; border-color:var(--slate-200) !important; }
.spin { width:14px; height:14px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
.icon { width:20px; height:20px; fill:currentColor; flex-shrink:0; } .icon.sm { width:16px; height:16px; }
.iconbtn { border:0; background:transparent; border-radius:6px; padding:8px; color:var(--slate-600); cursor:pointer; position:relative; display:inline-flex; }
.iconbtn:hover { background:var(--slate-100); }

/* Cards & layout */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0; }
.card > header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:12px 20px; border-bottom:1px solid var(--slate-100); }
.card > header h2 { font-size:15px; font-weight:600; color:var(--navy-900); }
.card .body { padding:20px; } .card .body.flush { padding:0; }
.page-head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; }
.page-head h1 { font-size:24px; font-weight:600; color:var(--navy-900); }
.page-head p { margin-top:4px; color:var(--muted); }

/* Stat cards */
.stat { display:block; text-decoration:none; color:inherit; padding:16px 18px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
a.stat:hover { border-color:var(--navy-600); }
.stat .lbl { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; font-weight:500; }
.stat .lbl .ic { display:grid; place-items:center; width:30px; height:30px; border-radius:8px; background:var(--panel-2); color:var(--navy-700); }
.stat .val { font-size:26px; font-weight:600; color:var(--navy-900); margin-top:8px; }
.stat .hint { font-size:12px; color:var(--slate-500); margin-top:2px; }
.stat.green .ic { background:var(--green-100); color:var(--green-800); } .stat.amber .ic { background:var(--amber-100); color:var(--amber-800); } .stat.red .ic { background:var(--red-100); color:var(--red-800); }

/* Badges & alerts */
.badge { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:500; white-space:nowrap; }
.badge .g { font-size:10px; line-height:1; }
.b-gray{background:var(--slate-100);color:var(--slate-700)} .b-blue{background:var(--accent-soft);color:var(--navy-800)} .b-green{background:var(--green-100);color:var(--green-800)} .b-amber{background:var(--amber-100);color:var(--amber-800)} .b-red{background:var(--red-100);color:var(--red-800)} .b-purple{background:var(--violet-100);color:var(--violet-800)}
.alert { border:1px solid; border-radius:6px; padding:12px 16px; font-size:14px; }
.alert .t { font-weight:600; } .alert .t + div { margin-top:4px; }
.a-info{border-color:var(--border);background:var(--panel-2);color:var(--navy-900)} .a-success{border-color:var(--green-200);background:var(--green-50);color:var(--green-900)} .a-warning{border-color:var(--amber-200);background:var(--amber-50);color:var(--amber-900)} .a-error{border-color:var(--red-200);background:var(--red-50);color:var(--red-900)}
.empty { border:1px dashed var(--slate-300); border-radius:var(--radius); background:var(--card); padding:36px 24px; text-align:center; }
.empty .t { font-weight:500; color:var(--navy-900); }
.skel { height:14px; border-radius:4px; background:linear-gradient(90deg,var(--slate-100),var(--slate-200),var(--slate-100)); background-size:200% 100%; animation:sh 1.2s infinite; }
@keyframes sh { to { background-position:-200% 0; } }

/* Forms */
.field { display:block; } .field > label { display:block; font-size:13px; font-weight:500; color:var(--slate-700); margin-bottom:4px; }
.field .hint { font-size:12px; color:var(--slate-500); margin-top:4px; } .field .err { font-size:12px; color:var(--red-700); margin-top:4px; }
.input, select.input, textarea.input { display:block; width:100%; border:1px solid var(--slate-300); border-radius:6px; padding:8px 12px; background:var(--card); font-size:14px; }
.input:disabled { background:var(--slate-100); color:var(--slate-500); }
.input.invalid { border-color:var(--red-700); }
textarea.input { min-height:90px; resize:vertical; }
.check { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--slate-200); border-radius:6px; background:var(--card); cursor:pointer; }
.check input { margin-top:3px; width:16px; height:16px; accent-color:var(--brand-hover); }
.check .hint { font-size:12px; color:var(--slate-500); }

/* Tables */
.tbl-wrap { overflow-x:auto; }
table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-500); background:var(--slate-50); padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap; font-weight:600; }
.tbl th button { all:unset; cursor:pointer; } .tbl th button:hover { color:var(--navy-900); }
.tbl td { padding:10px 14px; border-bottom:1px solid var(--slate-100); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:0; }
.tbl tbody tr:hover td { background:var(--slate-50); }
.tbl-tools { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-bottom:1px solid var(--slate-100); align-items:center; }
.tbl-tools .input { width:auto; min-width:180px; flex:1 1 180px; max-width:320px; padding:6px 10px; font-size:13px; }
.tbl-tools select.input { flex:0 0 auto; min-width:140px; }
.tbl-foot { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding:10px 16px; border-top:1px solid var(--slate-100); font-size:12px; color:var(--slate-500); }
.hash { font-family:var(--mono); font-size:12px; background:var(--slate-100); padding:1px 6px; border-radius:4px; color:var(--slate-700); }

/* Tabs, stepper, timeline */
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto; margin-bottom:16px; }
.tabs button { border:0; background:none; padding:9px 14px; font-weight:500; color:var(--slate-600); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
.tabs button[aria-selected=true] { color:var(--navy-900); border-bottom-color:var(--brand-hover); }
.tabs .count { margin-left:6px; background:var(--slate-100); border-radius:999px; padding:0 7px; font-size:11px; }
.stepper { display:flex; list-style:none; padding:0; margin:0; gap:0; overflow-x:auto; }
.stepper li { flex:1 1 0; min-width:92px; text-align:center; position:relative; padding-top:2px; }
.stepper li::before { content:""; position:absolute; top:15px; left:-50%; width:100%; height:2px; background:var(--slate-200); z-index:0; }
.stepper li:first-child::before { display:none; }
.stepper li.done::before, .stepper li.cur::before { background:var(--brand-hover); }
.stepper .dot { position:relative; z-index:1; display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--card); border:2px solid var(--slate-300); font-size:12px; font-weight:600; color:var(--slate-500); }
.stepper li.done .dot { background:var(--brand-hover); border-color:var(--navy-700); color:#fff; }
.stepper li.cur .dot { border-color:var(--brand-hover); color:var(--navy-900); box-shadow:0 0 0 4px var(--accent-soft); }
.stepper li.failed .dot { border-color:var(--red-700); background:var(--danger); color:#fff; }
.stepper .lb { display:block; margin-top:6px; font-size:12px; font-weight:500; color:var(--slate-600); }
.stepper li.cur .lb { color:var(--navy-900); font-weight:600; }
.stepper .ht { display:block; font-size:11px; color:var(--slate-500); }
.timeline { list-style:none; margin:0; padding:0; }
.timeline li { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--slate-100); }
.timeline li:last-child { border-bottom:0; }
.timeline .tdot { width:30px; height:30px; flex-shrink:0; border-radius:50%; display:grid; place-items:center; background:var(--panel-2); color:var(--navy-700); }
.feed-item { display:flex; gap:12px; padding:10px 20px; border-bottom:1px solid var(--slate-100); text-decoration:none; color:inherit; }
.feed-item:last-child { border-bottom:0; } a.feed-item:hover { background:var(--slate-50); }

/* Bars (charts) */
.bars { display:flex; flex-direction:column; gap:10px; }
.bar-row { display:grid; grid-template-columns:minmax(90px,180px) minmax(0,1fr) 70px; gap:10px; align-items:center; font-size:13px; }
.bar-track { height:22px; background:var(--slate-100); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; background:var(--brand-hover); border-radius:4px; transition:width .6s ease; }
.bar-fill.win { background:var(--brand); } .bar-fill.alt { background:#6b8fd6; } .bar-fill.gray { background:var(--slate-400); }
.vbars { display:flex; align-items:flex-end; gap:16px; height:180px; padding:8px 4px 0; border-bottom:1px solid var(--slate-200); }
.vbar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
.vbar .col { width:100%; max-width:56px; background:var(--brand-hover); border-radius:4px 4px 0 0; transition:height .6s; }
.vbar .v { font-size:12px; font-weight:600; color:var(--navy-900); margin-bottom:4px; }
.vlabels { display:flex; gap:16px; padding:6px 4px 0; } .vlabels span { flex:1; text-align:center; font-size:11px; color:var(--slate-500); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.donut { width:140px; height:140px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; }
.donut .hole { width:96px; height:96px; border-radius:50%; background:var(--card); display:grid; place-items:center; text-align:center; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--slate-600); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.progress { height:8px; background:var(--slate-100); border-radius:999px; overflow:hidden; } .progress > div { height:100%; background:var(--brand-hover); border-radius:999px; transition:width .5s; }

/* Public layout */
.pub-head { background:var(--card); border-bottom:1px solid var(--border); }
.wrap { max-width:1152px; margin:0 auto; padding:0 16px; }
.pub-head .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px; }
.pub-nav { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.pub-nav a { text-decoration:none; padding:6px 12px; border-radius:6px; font-weight:500; color:var(--slate-600); }
.pub-nav a:hover { color:var(--navy-900); } .pub-nav a.active { background:var(--panel-2); color:var(--navy-900); }
.pub-nav a.cta { background:var(--brand); color:#fff; } .pub-nav a.cta:hover { background:var(--brand-hover); }
.logo { display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
.logo .mk { display:grid; place-items:center; width:32px; height:32px; border-radius:8px; background:var(--brand); }
.logo .mk svg { width:20px; height:20px; stroke:#fff; }
.logo .nm { font-size:18px; font-weight:700; letter-spacing:-.01em; color:var(--navy-900); }
.logo.light .mk { background:var(--card); } .logo.light .mk svg { stroke:#fff; } .logo.light .nm { color:#fff; }
.hero { background:var(--brand); color:#fff; }
.hero .wrap { padding-top:64px; padding-bottom:72px; }
.hero .eyebrow { font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--navy-100); }
.hero h1 { font-size:46px; font-weight:700; margin-top:12px; }
.hero p { font-size:18px; color:var(--navy-100); max-width:640px; margin-top:16px; }
.pub-foot { border-top:1px solid var(--border); background:var(--card); font-size:12px; color:var(--slate-500); }
.pub-foot .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding-top:16px; padding-bottom:16px; }
.section { padding-top:48px; padding-bottom:48px; }
.section h2 { font-size:22px; font-weight:600; color:var(--navy-900); }

/* App shell */
.shell-side { position:fixed; left:0; bottom:0; width:256px; background:var(--brand); color:#fff; overflow-y:auto; padding:16px 12px; z-index:30; transition:width .15s; display:none; }
.shell-main { min-height:100vh; transition:padding .15s; }
@media (min-width:1024px) { .shell-side { display:flex; flex-direction:column; } .shell-main { padding-left:256px; } .shell.collapsed .shell-side { width:72px; } .shell.collapsed .shell-main { padding-left:72px; } .only-mobile { display:none !important; } }
@media (max-width:1023px) { .only-desktop { display:none !important; } }
.shell.collapsed .shell-side .hide-c { display:none; }
.shell.collapsed .nav-link { justify-content:center; padding-left:0; padding-right:0; }
.side-org { margin-top:12px; padding:0 8px; font-size:12px; color:#e6ecf8cc; }
.side-org b { display:block; color:#fff; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav-group { margin-top:16px; }
.nav-group > p { padding:0 12px; margin-bottom:4px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#e6ecf899; }
.nav-link { display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:6px; font-weight:500; font-size:14px; color:var(--navy-100); text-decoration:none; }
.nav-link:hover { background:rgba(255,255,255,.05); color:#fff; } .nav-link.active { background:rgba(255,255,255,.1); color:#fff; }
.topbar { position:sticky; z-index:20; background:var(--card); border-bottom:1px solid var(--border); }
.topbar .in { display:flex; align-items:center; gap:6px; height:56px; padding:0 14px; }
.crumbs { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--slate-500); min-width:0; overflow:hidden; white-space:nowrap; }
.crumbs a { color:var(--slate-500); text-decoration:none; } .crumbs a:hover { color:var(--navy-900); } .crumbs b { color:var(--navy-900); font-weight:500; overflow:hidden; text-overflow:ellipsis; }
.main { max-width:1280px; margin:0 auto; padding:24px 16px; }
@media (min-width:640px) { .main { padding:24px 24px; } }
.drawer { position:fixed; inset:0; z-index:55; background:rgba(7,20,54,.5); }
.drawer .shell-side { display:flex; flex-direction:column; width:288px; max-width:85vw; top:0 !important; }
.pop { position:absolute; right:0; top:calc(100% + 6px); z-index:45; width:320px; max-width:calc(100vw - 24px); background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-lg); }

/* Modal & toast */

.wt-nav button:hover { background:var(--panel-2); color:var(--navy-900); } .wt-nav button span { font:600 12px var(--mono); color:var(--slate-400); padding-top:1px; }
.wt-main { min-width:0; display:flex; flex-direction:column; gap:40px; }
.chap { scroll-margin-top:16px; min-width:0; display:flex; flex-direction:column; gap:18px; }

.chap h2 { font-size:24px; font-weight:700; color:var(--navy-900); } .chap-tag { color:var(--slate-600); margin-top:2px; }
.why { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--navy-600); border-radius:8px; padding:14px 18px; }
.why b { color:var(--navy-900); font-size:13px; text-transform:uppercase; letter-spacing:.05em; } .why p { margin-top:4px; color:var(--slate-700); }
.flow { list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); counter-reset:f; }
.flow li { position:relative; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px 12px; box-shadow:var(--shadow); }
.flow .fs { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--navy-800); font-size:12px; font-weight:700; margin-bottom:6px; }
.flow b { display:block; color:var(--navy-900); font-size:14px; } .flow li > span:last-child { font-size:12.5px; color:var(--slate-600); }
.snip { margin:0; border-radius:12px; overflow:hidden; border:1px solid #1e2b4f; box-shadow:0 6px 24px rgba(7,20,54,.18); background:#0b1530; }

.snip-t { display:flex; gap:10px; align-items:center; min-width:0; } .snip-t b { font-size:14px; font-weight:600; }
.lang { font:700 10.5px var(--mono); letter-spacing:.06em; text-transform:uppercase; border-radius:4px; padding:2px 7px; }
.lang-java { background:#f59e0b22; color:#fbbf24; } .lang-js { background:#eab30822; color:#fde047; } .lang-sql { background:#38bdf822; color:#7dd3fc; }
.snip-p { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:12px; color:#94a3b8; min-width:0; }
.snip-p .mono { word-break:break-all; color:#cbd5e1; } .snip-r { color:#64748b; }
.snip-copy { border:1px solid #334155; background:transparent; color:#cbd5e1; border-radius:5px; padding:2px 9px; font-size:12px; cursor:pointer; } .snip-copy:hover { background:#1e293b; }
.snip-b { display:grid; grid-template-columns:minmax(0,1fr); }
@media (min-width:1200px) { .snip-b { grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); } .snip-b .notes { border-top:0 !important; border-left:1px solid #1e2b4f; } }
.code { overflow:auto; max-height:560px; padding:8px 0; }
.code table { border-collapse:collapse; width:100%; font:12.5px/1.65 var(--mono); color:#dbe4f3; }
.code td { padding:0; vertical-align:top; } .code .ln { width:1%; padding:0 10px 0 14px; text-align:right; color:#4b5d85; user-select:none; white-space:nowrap; }
.code .mk { width:1%; padding-right:6px; white-space:nowrap; } .code .cl { white-space:pre; padding-right:16px; }
.code tr.hl td { background:rgba(250,204,21,.07); } .code tr.hl .ln { color:#facc15; box-shadow:inset 3px 0 0 #facc15; }
.code tr.focus td { background:rgba(250,204,21,.22); }
.bub { display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px; border-radius:999px; background:#facc15; color:#1f2937; font:700 11px var(--font); margin-right:2px; }
.tk-k { color:#c4b5fd; } .tk-t { color:#67e8f9; } .tk-f { color:#93c5fd; } .tk-s { color:#fcd34d; } .tk-n { color:#f9a8d4; } .tk-c { color:#6b7fa8; font-style:italic; }
.notes { list-style:none; margin:0; padding:10px; background:#0e1a3a; border-top:1px solid #1e2b4f; display:flex; flex-direction:column; gap:6px; }
.note { display:flex; gap:10px; width:100%; text-align:left; border:1px solid transparent; background:transparent; color:#dbe4f3; border-radius:8px; padding:8px 10px; cursor:pointer; font-size:13.5px; line-height:1.5; }
.note:hover { background:#14234d; } .note.on { background:#14234d; border-color:#facc15; }
.note b { color:#fff; } .nt { min-width:0; } .nl { display:block; font-size:11px; color:#7c8db5; margin-top:2px; font-family:var(--mono); }
.key { display:flex; gap:12px; align-items:flex-start; background:var(--green-50); border:1px solid var(--green-200); border-radius:10px; padding:14px 18px; }
.key-i { display:grid; place-items:center; width:30px; height:30px; flex-shrink:0; border-radius:50%; background:var(--green-700); color:#fff; }
.key b { color:var(--green-900); } .key p { color:var(--green-900); margin-top:2px; }

.chap-foot .btn { white-space:normal; text-align:left; } .chap-foot > * { min-width:0; max-width:100%; }

/* ---------- Role guide ---------- */
.rg-hero { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:20px; background:linear-gradient(135deg,#050a2a,#1b2f93 62%,#3b1a78); border-radius:14px; padding:22px 24px; }
.ring { width:112px; height:112px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; }
.ring > div { width:86px; height:86px; border-radius:50%; background:var(--card); display:grid; place-items:center; text-align:center; align-content:center; }
.ring b { font-size:22px; color:var(--navy-900); line-height:1; } .ring span { font-size:11px; color:var(--slate-500); }
.perm-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:13.5px; } .perm-list li { display:flex; gap:8px; }
.task { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; }
.task.ok { border-color:var(--green-200); background:linear-gradient(0deg,var(--card),var(--green-50)); }
.task-n { flex-shrink:0; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--navy-800); font-weight:700; font-size:13px; }
.task.ok .task-n { background:var(--green-700); color:#fff; }
.task-steps { margin:0; padding-left:20px; color:var(--slate-700); display:grid; gap:3px; }

/* ============ DigiVote dark neon theme (matches the app) ============ */
body { background-color:var(--bg); background-image:radial-gradient(1100px 520px at 85% -8%,rgba(59,130,246,.14),transparent 60%),radial-gradient(900px 480px at -5% 12%,rgba(139,92,246,.12),transparent 60%); background-attachment:fixed; }
a { color:var(--navy-700); }
.text-gradient, .grad { background-image:linear-gradient(90deg,#22a6ff 0%,#6b6bff 55%,#a855f7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
select option { background:#0a1230; color:#e3e9fb; }
.card, .stat, .task, .toc-card, .guide-tabs button, .flow li, .why, details.acc, .receipt, .option, .check, .modal, .pop, .empty {
  border-color:rgba(80,120,255,.22);
}
.card, .stat, .toc-card, .guide-tabs button, .flow li, .task, .modal, .pop { background-image:linear-gradient(180deg,rgba(20,34,86,.55),rgba(8,14,40,.75)); }
.card { box-shadow:0 0 0 1px rgba(10,18,48,.6) inset,var(--shadow); }
.card > header h2 { font-size:17px; }
.page-head h1 { font-weight:700; }
/* buttons */
.btn { border-radius:10px; }
.btn.primary { background:var(--brand-grad); color:#fff; box-shadow:0 6px 18px -6px rgba(59,91,255,.7); }
.btn.primary:hover { background:var(--brand-grad); filter:brightness(1.1); }
.btn.secondary { background:rgba(10,18,48,.4); color:var(--navy-800); border-color:rgba(59,130,246,.6); }
.btn.secondary:hover { background:var(--panel-2); }
.btn.danger { background:var(--danger); } .btn.danger:hover { background:var(--danger-hover); }
.btn.ghost:hover { background:var(--panel-2); }
.btn:disabled, .btn[aria-disabled=true] { background:var(--slate-300) !important; color:var(--slate-500) !important; }
.btn.secondary:disabled { background:transparent !important; color:var(--slate-400) !important; border-color:var(--slate-200) !important; }
.iconbtn:hover { background:var(--panel-2); }
/* stat tiles: gradient icon tile like the dashboard mockups */
.stat { display:flex; flex-direction:column; border-radius:14px; }
.stat .lbl { font-size:14px; color:var(--slate-700); }
.stat .lbl .ic { width:42px; height:42px; border-radius:12px; color:#fff; background:linear-gradient(135deg,#1d4ed8,#3b82f6); box-shadow:0 6px 18px -8px #3b82f6; }
.stat:nth-child(6n+2) .lbl .ic { background:linear-gradient(135deg,#6d28d9,#a855f7); box-shadow:0 6px 18px -8px #a855f7; }
.stat:nth-child(6n+3) .lbl .ic { background:linear-gradient(135deg,#0e7490,#22d3ee); box-shadow:0 6px 18px -8px #22d3ee; }
.stat:nth-child(6n+4) .lbl .ic { background:linear-gradient(135deg,#047857,#22c55e); box-shadow:0 6px 18px -8px #22c55e; }
.stat:nth-child(6n+5) .lbl .ic { background:linear-gradient(135deg,#c2410c,#f59e0b); box-shadow:0 6px 18px -8px #f59e0b; }
.stat.green .ic { background:linear-gradient(135deg,#047857,#22c55e) !important; color:#fff !important; }
.stat.amber .ic { background:linear-gradient(135deg,#c2410c,#f59e0b) !important; color:#fff !important; }
.stat.red .ic { background:linear-gradient(135deg,#b91c1c,#f43f5e) !important; color:#fff !important; }
.stat .val { font-size:28px; font-weight:700; }
a.stat:hover { border-color:var(--brand-hover); }
/* badges */
.badge { box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
.b-blue { background:rgba(59,130,246,.25); color:#bcd4ff; }
/* inputs */

.input::placeholder { color:var(--slate-500); }
/* tables */

.tbl tbody tr:hover td { background:var(--panel-2); }

.option[aria-checked=true] { background:var(--panel-2); border-color:var(--brand-hover); }

.qr { background:#fff; padding:6px; }
/* simulation panel */

.sim-panel .tour button:hover { background:#3d2c0a !important; }
.sim-bar { color:#fcd34d; }
/* public layout */
.pub-head { background:rgba(4,7,22,.85); backdrop-filter:blur(8px); position:sticky; top:0; z-index:30; }
.pub-foot { background:rgba(4,7,22,.8); }
.pub-nav a { color:var(--slate-700); } .pub-nav a:hover { color:#fff; }
.pub-nav a.active { background:transparent; color:#fff; box-shadow:inset 0 -2px 0 #3b82f6; border-radius:0; }
.pub-nav a.cta { background:var(--brand-grad); color:#fff; border-radius:10px; padding:8px 16px; } .pub-nav a.cta:hover { background:var(--brand-grad); filter:brightness(1.1); }

<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">This simulation needs JavaScript.</p></noscript>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();

    if (r.prev !== prev) return { ok: false, at: r.seq, reason: `Record ${r.seq} does not link to the previous record` };
    if (sha256(auditCanon(r)) !== r.h) return { ok: false, at: r.seq, reason: `Record ${r.seq} was modified after it was written (hash mismatch)` };

// ---------- Ballots, bulletin board, receipts ----------
const CROCK = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function receiptCheck(body) { let s = 0; for (let i = 0; i < body.length; i++) s += (CROCK.indexOf(body[i]) + 1) * (i + 1); return CROCK[s % 32]; }

function receiptKey(eid) { S.receiptKeys ||= {}; return (S.receiptKeys[eid] ||= sha256(`receipt-key|${eid}|${Math.random()}|${Date.now()}`)); }

const receiptHash = (compact) => sha256(`DIGI-VOTE-RECEIPT|${compact}`); // as ReceiptCodes.hash

/** The link encoded in the receipt QR code (same shape as the real app: <public base>/verify?code=...). */

/** Verification with a step-by-step evidence trail. Never reveals the selection. */
function verifyReceipt(input, source = 'Typed code') {

  const raw = normalizeCode(input);
  add(`Read the receipt (${source})`, raw ? 'ok' : 'fail', raw ? formatCode(raw) : 'No code found');
  const fmtOk = raw.length === 21 && [...raw].every((ch) => CROCK.includes(ch)) && receiptCheck(raw.slice(0, 20)) === raw[20];
  add('Code format and check character', fmtOk ? 'ok' : 'fail', fmtOk ? `21 characters, check character “${raw[20]}” matches` : 'The code is malformed or a character was mistyped');
  if (!fmtOk) return out('INVALID_RECEIPT', { raw });
  const key = receiptHash(raw); const r = S.receipts[key];
  add('Receipt record found', r ? 'ok' : 'fail', r ? `The server stores only SHA-256(code) = ${key.slice(0, 16)}…` : 'No receipt with this code exists');
  if (!r) return out('RECEIPT_NOT_FOUND', { raw });
  const e = election(r.eid);
  const unique = Object.values(S.receipts).filter((x) => x.c === r.c).length === 1;
  add('Unique receipt', unique ? 'ok' : 'fail', unique ? `Exactly one receipt maps to this ballot (100-bit code; ${Object.values(S.receipts).filter((x) => x.eid === r.eid).length} receipts in this election)` : 'More than one receipt refers to this ballot');
  const spentOnce = (S.spent[r.eid] || []).filter((t) => t === r.th).length === 1;
  const derived = !!r.th && makeReceiptCode(r.eid, r.th) === raw;
  add('Bound to an anonymous voting token', derived && spentOnce ? 'ok' : 'fail', derived && spentOnce ? `Code = HMAC(receipt key, election | spent-token hash ${r.th.slice(0, 12)}…); that token was spent exactly once` : 'The code does not derive from a spent token');

  if (!derived || !spentOnce || !unique) return out('INTEGRITY_WARNING', { e, r, raw, detail: 'The receipt is not consistently bound to one spent token and one ballot.' });

  add('Included in the tally', 'wait', res ? 'This entry is newer than the computed results' : e.status === 'VOTING' ? 'Voting is still open; the tally runs after it closes' : 'Results have not been computed yet');

function optionLabel(eid, key) { if (key === 'NOTA') return 'None of the above (NOTA)'; return S.apps.find((a) => a.id === key)?.name ?? key; }

function revealOnScroll() {
  REVEAL_IO?.disconnect();
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  REVEAL_IO = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('rv-in'); REVEAL_IO.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  document.querySelectorAll(REVEAL).forEach((el) => {
    const i = Array.prototype.indexOf.call(el.parentElement.children, el);
    el.classList.add('rv'); el.style.transitionDelay = `${Math.min(i, 6) * 70}ms`;
    REVEAL_IO.observe(el);
  });
}
const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

<script>
'use strict';
// =====================================================================================================
// Receipts, QR codes and the Vote Verification Portal (Dashboard 06)
// QR codes are real (qrcode-generator, error correction M like ZXing in the backend) and encode the same
// thing as the real app: the public verification link <base>/verify?code=<receipt code>.
// =====================================================================================================
function qrModules(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q; }
function qrImg(text, label, px = 184) {
  const q = qrModules(text); const n = q.getModuleCount(); const cell = Math.max(2, Math.floor(px / (n + 8)));
  return `<img class="qr" src="${q.createDataURL(cell, cell * 4)}" width="${(n + 8) * cell}" height="${(n + 8) * cell}" alt="${esc(label)}">`;
}
function drawQr(g, text, x, y, size) {
  const q = qrModules(text); const n = q.getModuleCount(); const quiet = 4; const cell = Math.floor(size / (n + quiet * 2));
  const total = cell * (n + quiet * 2);
  g.fillStyle = '#fff'; g.fillRect(x, y, total, total); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect(x + (c + quiet) * cell, y + (r + quiet) * cell, cell, cell);
  return total;
}
/** Receipt as a PNG image (code, QR, evidence references). It can be uploaded to the verifier, which reads the QR. */
function receiptPng(w) {
  const e = election(w.eid); const cv = document.createElement('canvas'); cv.width = 1040; cv.height = 600; const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#0b1f4d'; g.fillRect(0, 0, cv.width, 92);
  g.fillStyle = '#fff'; g.font = 'bold 34px Segoe UI, Arial'; g.fillText('DigiVote', 36, 58); g.font = '18px Segoe UI, Arial'; g.fillText('Verification receipt', 200, 56);
  g.font = '14px Segoe UI, Arial'; g.fillStyle = '#e6ecf8'; g.fillText('SIMULATION · fictional data', 780, 56);
  g.fillStyle = '#475569'; g.font = '16px Segoe UI, Arial'; g.fillText(S.org.name, 36, 132);
  g.fillStyle = '#0b1f4d'; g.font = 'bold 24px Segoe UI, Arial'; g.fillText(e.title.slice(0, 44), 36, 166);
  const row = (label, value, y, mono) => { g.fillStyle = '#64748b'; g.font = '14px Segoe UI, Arial'; g.fillText(label, 36, y); g.fillStyle = '#1e293b'; g.font = mono ? '16px Consolas, monospace' : '16px Segoe UI, Arial'; g.fillText(value, 36, y + 22); };
  g.fillStyle = '#64748b'; g.font = '14px Segoe UI, Arial'; g.fillText('Receipt code', 36, 212);
  g.fillStyle = '#0b1f4d'; g.font = 'bold 30px Consolas, monospace'; g.fillText(formatCode(w.code), 36, 248);
  row('Ballot commitment (SHA-256)', `${w.c.slice(0, 40)}…`, 290, true);
  row('Anonymous spent-token hash', `${(w.th || '').slice(0, 40)}…`, 346, true);
  row('Saved on this device at (never sent to the server)', fmt(w.at), 402);
  g.fillStyle = '#64748b'; g.font = '13px Segoe UI, Arial';
  ['This receipt contains no personal information and does not reveal your choice.', 'Anyone holding the code can check that the ballot was recorded and counted — nothing more.', 'Scan the QR code or enter the code at the DigiVote verification portal.'].forEach((t, i) => g.fillText(t, 36, 490 + i * 22));
  const size = drawQr(g, verifyUrl(w.code), 680, 130, 320);
  g.fillStyle = '#475569'; g.font = '14px Segoe UI, Arial'; g.fillText('Scan to verify', 680 + size / 2 - 44, 130 + size + 24);
  return cv.toDataURL('image/png');
}
async function decodeQrImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('This file could not be read as an image.')); i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
    const found = jsQR(g.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'attemptBoth' });
    if (!found) throw new Error('No QR code was found in this image. Try a sharper, well-lit picture.');
    return found.data;
  } finally { URL.revokeObjectURL(url); }
}

// ---------- Verification portal ----------
function runVerify(code, source) {
  const r = verifyReceipt(code, source);
  if (me()) markDone(r.status === 'INCLUDED_IN_TALLY' ? 'verified-counted' : 'verified');
  if (r.r) { (S.verifyCount ||= {})[r.r.eid] = (S.verifyCount[r.r.eid] || 0) + 1; save(); }
  UI.verifyCode = r.raw ? formatCode(r.raw) : code; UI.verifyResult = r;
  return r;
}
function pVerify(embedded) {
  const qc = route().q.get('code');
  if (qc && UI.autoVerified !== qc) { UI.autoVerified = qc; runVerify(qc, 'QR link'); }
  const last = UI.verifyResult; const code = UI.verifyCode || '';
  const wallet = me() ? (S.wallet[me().id] || []) : [];
  const form = `<form data-form="verify" class="stack" novalidate>${field('Receipt verification code', 'code', input('code', code, 'autocomplete="off" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-X" style="font-family:var(--mono);letter-spacing:.04em"'), { hint: '21 characters; dashes and spaces are ignored. The last character is a check character.' })}<div class="row"><button class="btn primary" type="submit">${ic('shield', 'sm')}Verify</button>${btn('Scan QR with camera', { variant: 'secondary', icon: 'qr', act: 'qr-camera' })}<label class="btn secondary" for="qr-file" style="cursor:pointer">${ic('upload', 'sm')}Upload QR / receipt image</label><input type="file" id="qr-file" accept="image/*" data-change="qr-file" class="sr-only"></div><div id="qr-msg"></div>${wallet.length ? `<p class="small muted">Receipts on this device: ${wallet.map((w) => `<button type="button" class="btn ghost sm" data-act="fill-code" data-code="${w.code}">${esc(election(w.eid)?.title)}</button>`).join('')}</p>` : ''}</form>`;
  const result = last ? verifyResultPanel(last) : '';
  const help = `<div class="stack-sm small muted"><p><b class="strong">What is checked?</b> The code's check character, the receipt record (the server keeps only its SHA-256), its binding to one spent anonymous token, the ballot commitment on the hash-chained bulletin board, and finally inclusion in the tally.</p><p><b class="strong">Privacy:</b> verification never reveals your selection, and nothing here identifies you.</p><details class="acc mt-2"><summary>Try the different outcomes</summary><ul class="mt-2"><li>Vote, then verify right away → <i>pending</i> (waiting for a shuffled batch) or <i>recorded</i></li><li>Verify after results are computed → <i>counted</i></li><li>Change one character → <i>invalid receipt</i></li><li>A well-formed code that was never issued → <i>not found</i></li><li>Turn on “Simulate API outage” → <i>unavailable</i></li><li>Auditor → Integrity → edit a bulletin entry → <i>integrity warning</i></li></ul></details></div>`;
  const content = `<div class="grid g-lg-3"><div class="span-2 stack">${card('', `<div class="stack">${form}${result}</div>`)}</div><div>${card('How verification works', help)}</div></div>`;
  return embedded ? `${pageHead('Verify your vote', 'Confirm your ballot was recorded and counted, without revealing how you voted.')}${content}` : `<div class="wrap section">${pageHead('Verify your vote', 'Confirm your ballot was recorded and counted, without revealing how you voted. No sign-in needed.')}${content}</div>`;
}
const STEP_ICON = { ok: ['✓', 'var(--green-700)'], fail: ['✕', 'var(--red-700)'], wait: ['…', '#b45309'] };
function verifyResultPanel(r) {
  const st = VERIFY_STATES[r.status];
  const tone = { success: 'v-ok', info: 'v-warn', warning: 'v-warn', error: 'v-fail' }[st.kind];
  const steps = `<ol class="proto" style="border:1px solid var(--border);border-radius:8px;padding:6px 14px">${r.steps.map((s) => `<li class="${s.state === 'ok' ? 'ok' : 'on'}" style="align-items:flex-start"><span class="pi" style="color:${STEP_ICON[s.state][1]};font-weight:700">${STEP_ICON[s.state][0]}</span><span><b style="color:var(--navy-900);font-weight:500">${esc(s.label)}</b><span class="xs muted" style="display:block">${esc(s.detail)}</span></span></li>`).join('')}</ol>`;
  const w = r.r && me() ? (S.wallet[me().id] || []).find((x) => normalizeCode(x.code) === r.raw) : null;
  const res = r.res || (r.e ? S.results[r.e.id] : null);
  const times = [['Verified', fmt(r.at)]];
  if (w) times.push(['Receipt saved on this device', `${fmt(w.at)} <span class="xs muted">(device only — the server keeps no ballot time)</span>`]);
  if (r.entry) times.push(['Bulletin batch published', fmt(r.entry.at)]);
  if (res && r.status === 'INCLUDED_IN_TALLY') times.push(['Results computed', fmt(res.computedAt)]);
  if (res?.publishedAt && r.status === 'INCLUDED_IN_TALLY') times.push(['Results published', fmt(res.publishedAt)]);
  const ev = [];
  if (r.e) ev.push(['Election', `${esc(r.e.title)} ${status(r.e.status)}`]);
  if (r.r) ev.push(['Ballot commitment', hash(r.r.c, 24)], ['Spent-token hash', hash(r.r.th, 24)]);
  if (r.entry) ev.push(['Bulletin entry', `#${r.entry.seq} · ${hash(r.entry.h, 16)}`]);
  if (r.status === 'INCLUDED_IN_TALLY') ev.push(['Result hash', hash(res.hash, 24)]);
  if (r.detail) ev.push(['Detail', esc(r.detail)]);
  const inVote = r.e && r.r ? (() => { const total = ballotsOf(r.e.id).length; const board = boardOf(r.e.id).length;
    if (r.status === 'INCLUDED_IN_TALLY') return alertBox('success', 'Your vote is in the result', `It is one of the <b>${res.total}</b> ballots counted for ${esc(r.e.title)}${resultsVisible(r.e) ? ' — see the published results' : ' (results computed, publication pending)'}. Your choice stays secret.`);
    if (r.status === 'BALLOT_RECORDED') return alertBox('info', 'Your vote is on the public record', `It is one of ${board} ballot commitments on the bulletin board (${total} accepted so far). It will be counted when voting closes and results are computed.`);
    if (r.status === 'RECEIPT_RECOGNIZED') return alertBox('info', 'Your vote was accepted', `It is one of ${total} accepted ballots and will appear on the bulletin board in the next shuffled batch.`);
    return ''; })() : '';
  const links = r.e && r.entry && r.e.rules.publicResults ? `<div class="row"><a class="btn secondary sm" href="#/elections/${r.e.id}/bulletin?highlight=${r.entry.c.slice(0, 16)}">Find my entry on the bulletin board</a>${resultsVisible(r.e) ? `<a class="btn secondary sm" href="#/elections/${r.e.id}/results">Published results</a>` : ''}</div>` : '';
  return `<div class="stack" aria-live="polite"><div class="verdict ${tone}"><span class="vi">${ic(st.icon)}</span><div><p class="strong" style="font-size:16px">${st.title}</p><p class="small" style="margin-top:2px">${st.next}</p></div></div>${inVote}<div><h3 class="strong" style="font-size:14px;margin-bottom:6px">Evidence checked</h3>${steps}</div><div class="grid g-sm-2"><div><h3 class="strong" style="font-size:14px;margin-bottom:6px">Timestamps</h3>${kv(times)}</div><div><h3 class="strong" style="font-size:14px;margin-bottom:6px">References</h3>${ev.length ? kv(ev) : '<p class="small muted">None — the receipt was not recognised.</p>'}</div></div>${links}<p class="xs muted">Source: ${esc(r.source)}. Nothing on this page reveals how the ballot was marked.</p></div>`;

  async 'fill-code'(el) { const i = $('#code'); if (i) i.value = formatCode(el.dataset.code); await withBusy(el, () => delay(400)); runVerify(el.dataset.code, 'Receipt on this device'); rerender(); },

const WALKTHROUGH = [{"id": "big-picture", "title": "The big picture", "tagline": "Three programs, one rule: the server decides.", "tags": [{"kind": "arch", "label": "Architecture"}], "why": "DigiVote is a browser app (React), an API server (Spring Boot) and a database (MySQL). The browser only shows things; every decision — who you are, what you may do, whether a vote counts — is made again on the server and backed up by the database. Read the chapters in order: each one follows a real request a little deeper.", "flow": [{"t": "Browser", "d": "React page calls a function in api/endpoints.js"}, {"t": "HTTP", "d": "Axios sends JSON to /api/...; Vite forwards it to :8080"}, {"t": "Controller", "d": "Spring maps the URL to a *Controller method"}, {"t": "Access check", "d": "AccessControlService loads your role from the database"}, {"t": "Service", "d": "Business rules: state machine, rule engine, crypto"}, {"t": "Repository", "d": "Spring Data JPA turns method calls into SQL"}, {"t": "MySQL", "d": "Constraints and triggers enforce the same rules again"}], "takeaway": "If you can follow one request from a button to a database row, you understand the architecture.", "snippets": [{"file": "frontend/src/api/endpoints.js", "start": 83, "lang": "js", "title": "One line of the API layer: casting a ballot", "code": "castBallot: (electionId, body) => d(publicApi.post(`/api/public/elections/${electionId}/ballots`, body)),", "notes": [{"line": 0, "text": "Every backend call is one small function like this. Note it uses <b>publicApi<\/b>, not <b>api<\/b>: the ballot is sent without the login token (chapter 8 explains why)."}]}]}, {"id": "oop-roles", "title": "Roles are classes", "tagline": "Abstraction, inheritance, polymorphism and encapsulation in one place.", "tags": [{"kind": "oop", "label": "Abstraction"}, {"kind": "oop", "label": "Inheritance"}, {"kind": "oop", "label": "Polymorphism"}, {"kind": "oop", "label": "Encapsulation"}, {"kind": "pattern", "label": "Factory"}], "why": "Five roles behave differently but are asked the same questions: “can you do X?”, “may you vote?”. Instead of if/else on role names everywhere, each role is a subclass of one abstract User and answers for itself.", "takeaway": "Code everywhere asks user.can(permission). Which answer it gets depends on the object’s real class — that is polymorphism.", "try": {"uid": "u8", "to": "/app/roles", "label": "See the permission matrix"}, "snippets": [{"file": "backend/src/main/java/com/digivote/access/User.java", "start": 16, "lang": "java", "title": "The abstract base class", "code": "public abstract class User {\n\n    private final long userId;\n    private final long organizationId;\n    private final String email;\n    private final String fullName;\n\n    protected User(long userId, long organizationId, String email, String fullName) {\n        this.userId = userId;\n        this.organizationId = organizationId;\n        this.email = email;\n        this.fullName = fullName;\n    }\n\n    public abstract RoleCode role();\n\n    /** Permissions granted by this role, independent of any specific election. */\n    protected abstract Set<Permission> permissions();\n\n    /** Route the frontend opens after login for this role. */\n    public abstract String homePath();\n\n    /** Dashboard sections rendered for this role. */\n    public abstract List<String> dashboardSections();\n\n    public final boolean can(Permission permission) {\n        return permissions().contains(permission);\n    }\n\n    public final Set<Permission> grantedPermissions() {\n        return Collections.unmodifiableSet(permissions());\n    }\n\n    /**\n     * Whether this user may obtain a voting credential, given the election's persisted rules and the\n     * user's relationship to that election. Subclasses tighten the default policy.\n     */\n    public boolean mayVote(VotingContext context) {\n        if (!can(Permission.CAST_VOTE)) {\n            return false;\n        }\n        return !context.administersElection() || context.administratorsMayVote();\n    }", "notes": [{"line": 0, "text": "<b>Abstraction<\/b>: you can never create a plain User — only a concrete role."}, {"line": 2, "text": "<b>Encapsulation<\/b>: fields are private and final, so a role object cannot be changed after it is built."}, {"line": 17, "text": "Each subclass must supply its own permission set. This is the hook for <b>polymorphism<\/b>."}, {"line": 25, "text": "<b>final<\/b>: subclasses cannot change how a permission check works — only which permissions they hold."}, {"line": 37, "text": "A default voting policy that subclasses may tighten (the Auditor does, below)."}]}, {"file": "backend/src/main/java/com/digivote/access/AuditorUser.java", "start": 10, "lang": "java", "title": "One concrete role: the Auditor", "code": "public final class AuditorUser extends User {\n\n    private static final Set<Permission> PERMISSIONS = EnumSet.of(\n            Permission.VIEW_ELECTION_INTERNALS, Permission.VIEW_AUDIT_LOGS, Permission.VERIFY_INTEGRITY,\n            Permission.VIEW_SECURITY_EVENTS, Permission.GENERATE_REPORTS, Permission.VIEW_REPORTS);\n\n    AuditorUser(long userId, long organizationId, String email, String fullName) {\n        super(userId, organizationId, email, fullName);\n    }\n\n    @Override\n    public RoleCode role() {\n        return RoleCode.AUDITOR;\n    }\n\n    @Override\n    protected Set<Permission> permissions() {\n        return PERMISSIONS;\n    }\n\n    @Override\n    public String homePath() {\n        return \"/auditor\";\n    }\n\n    @Override\n    public List<String> dashboardSections() {\n        return List.of(\"overview\", \"bulletin\", \"integrity\", \"timeline\", \"receipts\", \"security\", \"reports\", \"archive\");\n    }\n\n    @Override\n    public boolean mayVote(VotingContext context) {\n        return false;\n    }\n}", "notes": [{"line": 0, "text": "<b>Inheritance<\/b>: AuditorUser gets everything from User and fills in the abstract parts."}, {"line": 2, "text": "The Auditor’s permissions: only viewing and verifying. No permission changes election data, so the auditor is read-only by construction."}, {"line": 6, "text": "The constructor is package-private (no <b>public<\/b>): only the factory in the same package can create one."}, {"line": 32, "text": "Overrides the default: an auditor may never vote, whatever the election rules say."}]}, {"file": "backend/src/main/java/com/digivote/access/UserFactory.java", "start": 23, "lang": "java", "title": "The factory that builds the right role", "code": "public User create(RoleCode role, long userId, long organizationId, String email, String fullName) {\n    return switch (role) {\n        case ORG_OWNER -> new OrganizationOwnerUser(userId, organizationId, email, fullName);\n        case ELECTION_ADMIN -> new ElectionAdministratorUser(userId, organizationId, email, fullName);\n        case CANDIDATE -> new CandidateUser(userId, organizationId, email, fullName);\n        case VOTER -> new VoterUser(userId, organizationId, email, fullName);\n        case AUDITOR -> new AuditorUser(userId, organizationId, email, fullName);\n    };\n}", "notes": [{"line": 1, "text": "<b>Factory pattern<\/b>: one place turns a database role code into the right object. Callers just receive a User and call can() — polymorphism does the rest."}, {"line": 6, "text": "Adding a sixth role means adding a class and one line here; nothing else changes."}]}]}, {"id": "access", "title": "Who may do what", "tagline": "Every protected request passes through one gate.", "tags": [{"kind": "sec", "label": "Authorization"}, {"kind": "sec", "label": "IDOR protection"}, {"kind": "sec", "label": "Multi-tenant isolation"}], "why": "Hiding a button in React is not security: anyone can call the API directly. AccessControlService is the single gate every service calls first. It never trusts the token or the browser for your role — it reads your membership from the database on every request.", "takeawa ewElection(electionId);\n    User user = access.user();\n    if (!user.can(permission)) {\n        deny(user, permission.name());\n    }\n    if (ELECTION_OPERATOR_PERMISSIONS.contains(permission) && !access.operator()) {\n        deny(user, permission.name() + \" on an election the user does not operate\");\n    }\n    return access;\n}", "notes": [{"line": 2, "text": "Your role is looked up fresh from the <b>organization_memberships<\/b> table. A role removed a second ago is already gone."}, {"line": 8, "text": "Not a member? The answer is “not found”, not “forbidden”, so nobody can probe which ids exist (<b>IDOR<\/b> protection). The attempt is logged as a security event."}, {"line": 10, "text": "The factory from chapter 2 builds the role object."}, {"line": 15, "text": "The polymorphic check."}, {"line": 39, "text": "Managing an election also requires being <b>assigned<\/b> to it: an administrator cannot touch someone else’s election."}]}, {"file": "backend/src/main/java/com/digivote/access/AccessControlService.java", "start": 119, "lang": "java", "title": "Every refusal leaves a trace", "code": "private void deny(User user, String what) {\n    securityEvents.record(user.organizationId(), SecurityEvent.Type.AUTHORIZATION_DENIED,\n            SecurityEvent.Severity.LOW, \"user:\" + user.userId(), user.role() + \" denied \" + what);\n    throw ApiException.forbidden(\"Your role does not permit this action\");\n}", "notes": [{"line": 1, "text": "Denials are written to <b>security_events<\/b> (visible in the Security center) before the 403 is returned."}]}]}, {"id": "sessions", "title": "Signing in: session tokens", "tagline": "A signed ticket that says who you are — and nothing more.", "tags": [{"kind": "sec", "label": "Authentication"}, {"kind": "sec", "label": "JWT HS256"}], "why": "After login the server issues a JSON Web Token. The browser sends it with each request (Authorization: Bearer …). The token proves identity only; permissions are never put inside it,
