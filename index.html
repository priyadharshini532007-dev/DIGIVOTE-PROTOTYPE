      const el = { id, title: d.title.trim(), description: d.description.trim() + (d.instructions.trim() ? `\n\n${d.instructions.trim()}` : ''), status: 'DRAFT', adminId: role() === 'ELECTION_ADMIN' ? S.session : (S.users.find((u) => u.role === 'ELECTION_ADMIN' && u.status === 'ACTIVE')?.id ?? null), created: Date.now(), updated: Date.now(), rules: { ...d.rules }, eligible: wizardVoters(), frozen: false, keys: null, banner: d.banner || '' };
      S.elections.push(el); audit('ELECTION_CREATED', `${el.title} created`, { eid: id });
      if (action === 'publish') transition(id);
      return el;
    }, 900));
    UI.wizard = null; toast('success', `${esc(e.title)} created${e.status === 'REGISTRATION' ? ' and published for registration' : ' as a draft'}.`); go(`/app/elections/${e.id}`);
  } catch (er) { $('#wiz-msg').innerHTML = `<div style="margin-bottom:16px">${alertBox('error', 'Could not create the election', esc(er.message))}</div>`; }
};

function activityPage() {
  const e = pickElection();
  return `${pageHead('Activity timeline', 'Lifecycle transitions and administrative actions, newest first.')}${e ? `${electionPicker(e)}${secTimeline(e)}` : noElections()}`;
}

APP_ROUTES.push(
  ['/app/operations', opsOverview, { perm: 'MANAGE_ELECTION' }],
  ['/app/elections', electionsList, { perm: 'VIEW_ELECTION_INTERNALS' }],
  ['/app/elections/new', wizardPage, { perm: 'CREATE_ELECTION' }],
  ['/app/elections/:id', electionManage, { perm: 'VIEW_ELECTION_INTERNALS' }],
  ['/app/approvals', approvalsPage, { perm: 'MANAGE_ELECTION' }],
  ['/app/voters', scoped('Voter management', 'Import and review eligible voters. Individual ballot choices are never available here.', secVoters, operated), { perm: 'MANAGE_ELECTION' }],
  ['/app/rules', scoped('Election rules', 'Per-election rules interpreted by one rule engine. Locked once voting opens.', secRules, operated), { perm: 'MANAGE_ELECTION' }],
  ['/app/lifecycle', scoped('Election operations', 'Move an election through its lifecycle. The server rejects any transition whose preconditions are not met.', secLifecycle, operated), { perm: 'MANAGE_ELECTION' }],
  ['/app/results-management', scoped('Results management', 'Generate validated results from the accepted ballots and publish them.', secResults, operated), { perm: 'MANAGE_ELECTION' }],
  ['/app/activity', activityPage, { perm: 'VIEW_ELECTION_INTERNALS' }],
);
</script>
<script>
'use strict';
// =====================================================================================================
// DASHBOARD 03 — Candidate Portal
// =====================================================================================================
const myApps = () => S.apps.filter((a) => a.uid === S.session);
function primaryApp() {
  const order = ['VOTING', 'CAMPAIGN', 'REGISTRATION', 'VERIFICATION', 'DRAFT', 'PUBLISHED', 'ARCHIVED'];
  return myApps().filter((a) => a.status !== 'WITHDRAWN').sort((a, b) => order.indexOf(election(a.eid).status) - order.indexOf(election(b.eid).status))[0] || null;
}
function applicationSteps(st) {
  const steps = [{ key: 'DRAFT', label: 'Draft' }, { key: 'SUBMITTED', label: 'Submitted' }, { key: 'REVIEW', label: 'Under review' }];
  if (st === 'CORRECTION_REQUESTED') steps.push({ key: 'CORRECTION_REQUESTED', label: 'Correction requested' });
  steps.push({ key: 'DECISION', label: st === 'REJECTED' ? 'Rejected' : st === 'WITHDRAWN' ? 'Withdrawn' : 'Approved' });
  const cur = { SUBMITTED: 'REVIEW', CORRECTION_REQUESTED: 'CORRECTION_REQUESTED', APPROVED: 'DECISION', REJECTED: 'DECISION', WITHDRAWN: 'DECISION' }[st] || 'DRAFT';
  return { steps, cur, failed: st === 'REJECTED' };
}
const manifestoState = (a) => (!a.manifesto ? 'Not started' : a.manifesto.frozen ? 'Frozen' : a.manifesto.status === 'PUBLISHED' ? 'Published' : 'Draft');
function nextMilestone(e) { const now = Date.now(); const m = [[e.rules.campaignStart, 'Campaign opens'], [e.rules.campaignEnd, 'Campaign closes'], [e.rules.votingStart, 'Voting opens'], [e.rules.votingEnd, 'Voting closes']].filter(([t]) => t && t > now).sort((a, b) => a[0] - b[0])[0]; return m ? { t: m[0], label: m[1] } : null; }
const noCandidacy = () => empty('You have no candidacy yet', 'Apply for an election that is open for registration.', btn('Apply for an election', { href: '/app/candidacy' }));

function candidateOverview() {
  const a = primaryApp(); if (!a) return `${pageHead('Dashboard', 'Your candidacy, profile, manifesto and deadlines.')}${noCandidacy()}`;
  const e = election(a.eid); const u = me(); const nm = nextMilestone(e); const m = a.manifesto;
  const st = applicationSteps(a.status);
  const notes = S.notes.filter((n) => n.uid === u.id).slice(0, 4);
  return `${heroBanner('candidate', `<p class="hb-kicker">Hi, ${esc(me().name.split(' ')[0])}!</p><h1 tabindex="-1">Share Your Vision.<br><span class="grad">Build a Better Tomorrow.</span></h1><p class="hb-sub">Connect with voters, share your ideas and make a real impact with DigiVote.</p>`, '<em>“A stronger community begins with your voice.”</em>')}${heroActions(btn('Edit manifesto', { href: '/app/candidate/manifesto', variant: 'secondary' }))}
  ${e.frozen ? `<div style="margin-bottom:16px">${alertBox('info', 'Voting is open: your manifesto is frozen', 'Every voter now sees the same manifesto. Editing is disabled in the interface and refused by the server.')}</div>` : ''}
  <div class="grid g-sm-2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${[
    statCard({ label: 'Application status', value: LABEL[a.status], icon: 'flag', tone: a.status === 'APPROVED' ? 'green' : a.status === 'REJECTED' ? 'red' : 'amber', to: '/app/candidacy' }),
    statCard({ label: 'Profile completion', value: `${profileCompleteness(a)}%`, icon: 'person', to: '/app/candidate/profile' }),
    statCard({ label: 'Manifesto status', value: manifestoState(a), icon: 'document', to: '/app/candidate/manifesto' }),
    statCard({ label: 'Campaign status', value: e.status === 'CAMPAIGN' ? 'Open' : ['REGISTRATION', 'DRAFT'].includes(e.status) ? 'Not started' : e.status === 'VOTING' ? 'Voting' : 'Closed', icon: 'bell', to: '/app/candidate/campaign' }),
    statCard({ label: 'Next milestone', value: nm ? ago(nm.t) : '—', hint: nm ? `${nm.label} · ${fmtShort(nm.t)}` : 'No upcoming dates', icon: 'calendar', to: '/app/candidate/timeline' }),
  ].join('')}</div>
  <div class="grid g-lg-2 mt-6">${card('My election', `<h3 class="strong" style="font-size:16px">${esc(e.title)}</h3><p class="small muted mt-1">${esc(e.description)}</p><div class="mt-4">${lifecycleStepper(e)}</div><div class="mt-4">${kv([['Campaign', `${fmtShort(e.rules.campaignStart)} → ${fmtShort(e.rules.campaignEnd)}`], ['Voting', `${fmtShort(e.rules.votingStart)} → ${fmtShort(e.rules.votingEnd)}`]])}</div>`)}
  ${card('Application progress', `${stepper(st.steps, st.cur, st.failed)}${a.feedback ? `<div class="mt-4">${alertBox(a.status === 'REJECTED' ? 'error' : a.status === 'CORRECTION_REQUESTED' ? 'warning' : 'info', 'Reviewer feedback', esc(a.feedback))}</div>` : ''}<div class="mt-4">${btn('Application status', { href: '/app/candidacy', size: 'sm', variant: 'secondary' })}</div>`)}</div>
  <div class="grid g-lg-3 mt-6">${card('Profile preview', `<div class="row"><span class="avatar lg">${initials(a.name)}</span><div><b class="strong" style="font-size:16px">${esc(a.name)}</b><div class="small muted">${esc(a.profile.education)}</div></div></div><div class="mt-4">${kv([['Experience', esc(a.profile.experience) || '—'], ['Achievements', esc(a.profile.achievements) || '—']])}</div>`, { actions: btn('Edit', { href: '/app/candidate/profile', size: 'sm', variant: 'ghost' }) })}
  ${card('Manifesto summary', m ? kv([['Vision', esc(m.vision)], ['Mission', esc(m.mission)], ['Goals', esc(m.goals).replace(/\n/g, '<br>')], ['Schemes', esc(m.schemes)]]) : empty('No manifesto yet', '', btn('Write manifesto', { href: '/app/candidate/manifesto', size: 'sm' })))}
  ${card('Notifications', notes.length ? notes.map((n) => `<a class="feed-item" href="#${n.to || '/app/notifications'}" style="padding:10px 0"><span style="min-width:0"><b class="strong small" style="display:block">${esc(n.title)}</b><span class="xs muted">${esc(n.msg)} · ${ago(n.at)}</span></span></a>`).join('') : '<p class="muted">Nothing new.</p>')}</div>`;
}

function candidateSection({ section }) {
  const a = primaryApp(); const titles = { profile: 'My profile', manifesto: 'My manifesto', media: 'Campaign media', campaign: 'Campaign', timeline: 'Election timeline' };
  if (!titles[section]) return empty('Page not found');
  if (!a) return `${pageHead(titles[section])}${noCandidacy()}`;
  const e = election(a.eid);
  const frozenBanner = a.manifesto?.frozen || e.frozen ? `<div style="margin-bottom:16px">${alertBox('info', 'Read-only: voting has opened', 'Your manifesto and campaign media are frozen so every voter sees the same content. The server refuses edits, not just this page.')}</div>` : '';
  const sub = `${esc(e.title)} · ${LABEL[e.status]}`;
  if (section === 'profile') return `${pageHead('My profile', sub, btn('Preview', { variant: 'secondary', act: 'cand-preview' }))}${card('Candidate profile', `<form data-form="cand-profile" class="stack" novalidate><div class="row"><span class="avatar lg" id="cand-photo">${a.photo ? `<img src="${a.photo}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">` : initials(a.name)}</span>${field('Photograph', 'photo', '<input type="file" class="input" id="photo" accept="image/png,image/jpeg" data-change="cand-photo">', { hint: 'PNG or JPEG, at most 2 MB.' })}</div>${field('Full name', 'cname', input('cname', a.name))}<div class="grid g-sm-2">${field('Education', 'education', input('education', a.profile.education))}${field('Qualifications', 'qualifications', input('qualifications', a.qualifications))}</div>${field('Experience', 'experience', textarea('experience', a.profile.experience))}${field('Achievements', 'achievements', textarea('achievements', a.profile.achievements))}${field('Relevant background / statement', 'statement', textarea('statement', a.statement))}<div class="row end">${btn('Cancel', { variant: 'secondary', act: 'form-cancel' })}<button class="btn primary" type="submit">Save profile</button></div></form>`)}`;
  if (section === 'manifesto') {
    const m = a.manifesto || { vision: '', mission: '', goals: '', schemes: '', initiatives: '', status: 'DRAFT', frozen: false, docs: [] }; const ro = m.frozen || e.frozen ? 'disabled' : '';
    return `${pageHead('My manifesto', sub, `${btn('Preview', { variant: 'secondary', act: 'cand-preview' })}`)}${frozenBanner}${card(`Manifesto builder ${status(m.frozen || e.frozen ? 'FROZEN' : m.status === 'PUBLISHED' ? 'PUBLISHED_M' : 'DRAFT_M', manifestoState(a))}`, `<form data-form="manifesto" class="stack" novalidate>${field('Vision', 'vision', textarea('vision', m.vision, `${ro} style="min-height:60px"`), { hint: 'One or two sentences voters will remember.' })}${field('Mission', 'mission', textarea('mission', m.mission, ro))}${field('Goals', 'goals', textarea('goals', m.goals, ro), { hint: 'One goal per line.' })}${field('Proposed schemes', 'schemes', textarea('schemes', m.schemes, ro))}${field('Initiatives', 'initiatives', textarea('initiatives', m.initiatives, ro))}<div><b class="small strong">Supporting documents</b><div class="chip-list mt-2">${(m.docs || []).map((d) => badge('gray', d)).join('') || '<span class="small muted">None attached — add them under Campaign media.</span>'}</div></div>${ro ? `<div class="row">${btn('Try saving anyway (simulates a crafted request)', { variant: 'secondary', act: 'manifesto-bypass' })}</div>` : `<div class="row end"><button class="btn secondary" type="submit" value="draft">Save draft</button><button class="btn primary" type="submit" value="publish">Submit for publication</button></div>`}</form>`)}`;
  }
  if (section === 'media') {
    const ro = e.frozen;
    const kinds = [['Manifesto PDF', 'application/pdf', 10], ['Campaign poster', 'image/png,image/jpeg', 5], ['Introductory video', 'video/mp4,video/webm', 10], ['Supporting document', 'application/pdf', 10]];
    return `${pageHead('Campaign media', sub)}${frozenBanner}<div class="grid g-lg-2">${card('Upload', ro ? '<p class="muted">Uploads are closed.</p>' : `<div class="stack">${kinds.map(([k, acc, mb]) => field(k, `m-${k.replace(/\s/g, '')}`, `<input type="file" class="input" id="m-${k.replace(/\s/g, '')}" accept="${acc}" data-change="media-file" data-kind="${k}" data-accept="${acc}" data-mb="${mb}">`, { hint: `${acc.split(',').map((x) => x.split('/')[1].toUpperCase()).join(' or ')}, at most ${mb} MB. Type and file signature are checked.` })).join('')}<div id="upload-progress"></div></div>`)}
    ${card('My files', a.media.length ? `<ul class="timeline">${a.media.map((m, i) => `<li><span class="tdot">${ic(m.kind === 'Campaign poster' ? 'image' : 'document', 'sm')}</span><span style="flex:1;min-width:0"><b class="small strong">${esc(m.name)}</b><span class="xs muted" style="display:block">${esc(m.kind)} · ${(m.size / 1024).toFixed(0)} KB · ${badge('green', 'Validated')}</span>${UI.mediaPreview?.[m.name] ? `<img src="${UI.mediaPreview[m.name]}" alt="" style="max-height:90px;margin-top:6px;border-radius:6px">` : ''}</span>${ro ? '' : btn('Remove', { size: 'sm', variant: 'ghost', act: 'media-remove', data: { i } })}</li>`).join('')}</ul>` : empty('No files yet'))}</div>`;
  }
  const ann = S.transitions.filter((t) => t.eid === e.id).slice().reverse();
  if (section === 'campaign') return `${pageHead('Campaign', sub)}<div class="grid g-lg-2">${card('Official announcements', ann.length ? `<ul class="timeline">${ann.map((t) => `<li><span class="tdot">${ic('bell', 'sm')}</span><span class="small"><b class="strong">${esc(e.title)} moved to ${LABEL[t.to]}</b><span class="xs muted" style="display:block">${fmt(t.at)}</span></span></li>`).join('')}</ul>` : '<p class="muted">No announcements yet.</p>')}${card('Campaign deadlines', kv([['Campaign opens', fmt(e.rules.campaignStart)], ['Campaign closes', fmt(e.rules.campaignEnd)], ['Manifesto freeze', `${fmt(e.rules.votingStart)} (when voting opens)`], ['Voting closes', fmt(e.rules.votingEnd)]]))}</div><div class="mt-6">${alertBox('info', 'What candidates can see', 'Candidates never see intermediate vote totals, voter identities or administrative audit controls. Results appear only after publication.')}</div>`;
  return `${pageHead('Election timeline', sub)}${card('Lifecycle', lifecycleStepper(e))}<div class="mt-6">${card('Milestones', `<ul class="timeline">${[[e.rules.campaignStart, 'Registration closes · campaign opens'], [e.rules.campaignEnd, 'Campaign closes'], [e.rules.votingStart, 'Voting opens · manifestos freeze'], [e.rules.votingEnd, 'Voting closes · verification starts'], [S.results[e.id]?.publishedAt, 'Results published']].filter(([t]) => t).map(([t, l]) => `<li><span class="tdot">${ic(t < Date.now() ? 'check' : 'calendar', 'sm')}</span><span class="small" style="flex:1"><b class="strong">${l}</b><span class="xs muted" style="display:block">${fmt(t)}</span></span>${t < Date.now() ? badge('gray', 'Passed') : badge('blue', ago(t))}</li>`).join('')}</ul>`)}</div>`;
}
CHANGE['cand-photo'] = (el) => { const f = el.files[0]; if (!f) return; if (!['image/png', 'image/jpeg'].includes(f.type) || f.size > 2 * 1024 * 1024) { $('[data-err="photo"]').textContent = 'Use a PNG or JPEG of at most 2 MB.'; el.value = ''; return; } const r = new FileReader(); r.onload = () => { UI.photo = r.result; $('#cand-photo').innerHTML = `<img src="${r.result}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">`; }; r.readAsDataURL(f); };
FORMS['cand-profile'] = async (f, b) => {
  const a = primaryApp(); const v = Object.fromEntries(new FormData(f)); const errs = {};
  if (v.cname.trim().length < 2) errs.cname = 'Enter your full name'; if (v.qualifications.trim().length < 5) errs.qualifications = 'At least 5 characters';
  if (!showErrors(f, errs)) return;
  try { await withBusy(b, () => api(() => { a.name = v.cname.trim(); a.qualifications = v.qualifications.trim(); a.statement = v.statement.trim(); Object.assign(a.profile, { education: v.education.trim(), experience: v.experience.trim(), achievements: v.achievements.trim() }); if (UI.photo) { a.photo = UI.photo; UI.photo = null; } })); markDone('profile-saved'); toast('success', 'Profile saved.'); rerender(); } catch (e) { toast('error', esc(e.message)); }
};
FORMS.manifesto = async (f, b) => {
  const a = primaryApp(); const e = election(a.eid); const v = Object.fromEntries(new FormData(f)); const pub = b?.value === 'publish'; const errs = {};
  if (pub) { if (v.vision.trim().length < 10) errs.vision = 'At least 10 characters to publish'; if (v.mission.trim().length < 10) errs.mission = 'At least 10 characters to publish'; if (!v.goals.trim()) errs.goals = 'Add at least one goal'; }
  if (!showErrors(f, errs)) return;
  try {
    await withBusy(b, () => api(() => {
      if (a.manifesto?.frozen || e.frozen) throw new Error('409 Conflict — the manifesto is frozen because voting has opened.');
      if (pub && a.status !== 'APPROVED') throw new Error('Your application must be approved before the manifesto can be published. It was saved as a draft instead.');
      a.manifesto = { ...(a.manifesto || { docs: [] }), vision: v.vision.trim(), mission: v.mission.trim(), goals: v.goals.trim(), schemes: v.schemes.trim(), initiatives: v.initiatives.trim(), status: pub ? 'PUBLISHED' : (a.manifesto?.status || 'DRAFT'), frozen: false };
      audit(pub ? 'MANIFESTO_PUBLISHED' : 'MANIFESTO_SAVED', `${a.name}: manifesto ${pub ? 'published' : 'saved as draft'}`, { eid: a.eid, sub: 'CANDIDATE' });
    }));
    toast('success', pub ? 'Manifesto published to voters.' : 'Draft saved.'); rerender();
  } catch (er) { if (/approved/.test(er.message)) { a.manifesto = { ...(a.manifesto || { docs: [] }), vision: v.vision, mission: v.mission, goals: v.goals, schemes: v.schemes, initiatives: v.initiatives, status: 'DRAFT', frozen: false }; save(); rerender(); } toast('error', esc(er.message)); }
};
ACT['manifesto-bypass'] = async (el) => { try { await withBusy(el, () => api(() => { audit('MANIFESTO_EDIT_REJECTED', 'Edit to a frozen manifesto refused', { sub: 'CANDIDATE', outcome: 'DENIED', eid: primaryApp().eid }); save(); throw new Error('409 Conflict — manifesto is frozen (service check and database trigger trg_manifesto_frozen).'); })); } catch (e) { toast('error', esc(e.message)); } };
ACT['cand-preview'] = () => { const a = primaryApp(); const m = a.manifesto; modal({ title: 'How voters see you', wide: true, body: `<div class="row"><span class="avatar lg">${a.photo ? `<img src="${a.photo}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">` : initials(a.name)}</span><div><b class="strong" style="font-size:18px">${esc(a.name)}</b><div class="small muted">${esc(a.profile.education)}</div></div></div><div class="mt-4">${kv([['Qualifications', esc(a.qualifications)], ['Experience', esc(a.profile.experience)], ['Achievements', esc(a.profile.achievements)], ['Vision', esc(m?.vision || '—')], ['Mission', esc(m?.mission || '—')], ['Goals', esc(m?.goals || '—').replace(/\n/g, '<br>')], ['Schemes', esc(m?.schemes || '—')], ['Initiatives', esc(m?.initiatives || '—')]])}</div>${m?.status !== 'PUBLISHED' ? `<div class="mt-4">${alertBox('warning', 'Not published yet', 'Voters see your manifesto only after you submit it for publication.')}</div>` : ''}` }); };
const SIGNATURES = { 'application/pdf': (b) => b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46, 'image/png': (b) => b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47, 'image/jpeg': (b) => b[0] === 0xff && b[1] === 0xd8, 'video/mp4': (b) => b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70, 'video/webm': (b) => b[0] === 0x1a && b[1] === 0x45 };
CHANGE['media-file'] = (el) => {
  const f = el.files[0]; const errEl = $(`[data-err="${el.id}"]`); errEl.textContent = ''; if (!f) return;
  const fail = (m) => { errEl.textContent = m; el.value = ''; };
  if (!el.dataset.accept.split(',').includes(f.type)) return fail(`${f.type || 'This file type'} is not accepted for ${el.dataset.kind}.`);
  if (f.size > Number(el.dataset.mb) * 1024 * 1024) return fail(`The file is larger than ${el.dataset.mb} MB.`);
  const r = new FileReader();
  r.onload = async () => {
    const bytes = new Uint8Array(r.result);
    if (!SIGNATURES[f.type]?.(bytes)) return fail('The file contents do not match its declared type (signature check failed).');
    const box = $('#upload-progress');
    for (let p = 0; p <= 100; p += 20) { box.innerHTML = `<p class="small">Uploading ${esc(f.name)}… ${p}%</p>${progress(p)}`; await delay(150); }
    try {
      await api(() => { const a = primaryApp(); if (election(a.eid).frozen) throw new Error('409 Conflict — campaign media is frozen.'); a.media.push({ name: f.name, kind: el.dataset.kind, size: f.size }); if (el.dataset.kind === 'Supporting document' && a.manifesto) (a.manifesto.docs ||= []).push(f.name); audit('MEDIA_UPLOADED', `${a.name}: ${el.dataset.kind} uploaded`, { eid: a.eid, sub: 'CANDIDATE' }); }, 300);
      if (f.type.startsWith('image/')) { const fr = new FileReader(); fr.onload = () => { (UI.mediaPreview ||= {})[f.name] = fr.result; rerender(); }; fr.readAsDataURL(f); }
      toast('success', `${esc(f.name)} uploaded and validated.`); rerender();
    } catch (e) { box.innerHTML = alertBox('error', 'Upload failed', esc(e.message)); }
  };
  r.readAsArrayBuffer(f.slice(0, 16));
};
ACT['media-remove'] = (el) => { const a = primaryApp(); const m = a.media[Number(el.dataset.i)]; confirmDlg({ title: 'Remove file?', body: `<p>${esc(m.name)} will be removed from your campaign.</p>`, confirmLabel: 'Remove', danger: true, onConfirm: async () => { await api(() => { if (election(a.eid).frozen) throw new Error('409 Conflict — campaign media is frozen.'); a.media.splice(Number(el.dataset.i), 1); }); setTimeout(rerender, 0); } }); };

function candidacyPage() {
  const apps = myApps();
  const open = S.elections.filter((e) => e.status === 'REGISTRATION' && !apps.some((a) => a.eid === e.id && a.status !== 'WITHDRAWN'));

  }
  return `${head('A focused, private ballot. Nothing here is shown to anyone else.')}<div style="max-width:760px">${voidNotice(id)}${stepper(steps, st.step)}<div class="mt-6">${body}</div></div>`;
}
ACT['cred-reset'] = (el) => {

};
ACT['get-cred'] = async (el) => {

  const labels = ['Check the election key fingerprint against the published key', 'Generate a random token and blind it in this browser', 'Server checks your eligibility and signs the blinded value', 'Unblind the signature — the server never saw this token'];

  try {
    for (let i = 0; i < 4; i++) {
      b.proto[i].state = 'on'; rerender();
      if (i === 2) await api(() => { if ((S.creds[e.id] || []).includes(u.email)) throw new Error('A credential was already issued to you for this election.'); if (e.status !== 'VOTING') throw new Error('Voting is not open.'); (S.creds[e.id] ||= []).push(u.email); }, 700);
      else await delay(450);
      b.proto[i].state = 'ok';
    }
    (S.devCred[u.id] ||= {})[e.id] = { token: sha256(rid('tok') + Math.random()) }; save();

ACT['ballot-submit'] = (el) => {

    const u = me(); const cred = S.devCred[u.id]?.[e.id];
    const r = await api(() => {
      if (election(e.id).status !== 'VOTING') throw new Error('Voting has closed. Your ballot was not accepted.');
      if (!cred) throw new Error('No credential on this device.');
      const th = sha256(cred.token);
      if ((S.spent[e.id] || []).includes(th)) { security('DUPLICATE_BALLOT_REJECTED', 'MEDIUM', 'A spent voting token was presented again and rejected', { eid: e.id }); save(); throw new Error('This credential has already been used.'); }
      const max = e.rules.maxSelections; const valid = approved(e.id).map((a) => a.id).concat(e.rules.notaEnabled ? ['NOTA'] : []);
      if (!b.sel.length || b.sel.length > max || b.sel.some((k) => !valid.includes(k)) || (b.sel.includes('NOTA') && b.sel.length > 1)) throw new Error('The selection does not follow this election’s rules.');
      (S.spent[e.id] ||= []).push(th);
      const rec = issueProvisional(e.id, b.sel.slice(), th);
      delete S.devCred[u.id][e.id];
      (S.wallet[u.id] ||= []).push({ eid: e.id, code: rec.code, c: rec.c, at: rec.at, th, expires: rec.expires, state: 'PENDING_QR', flags: 0, subs: [] });
      return rec;
    }, 1200);

  } });
};
ACT['replay-vote'] = async (el) => {

};

APP_ROUTES.push(

<script>
'use strict';
ACT['form-cancel'] = () => { rerender(); toast('info', 'Unsaved changes discarded.'); };
// =====================================================================================================
// DASHBOARD 05 — Auditor (read-only)
// =====================================================================================================
const audited = () => S.elections.filter((e) => e.status !== 'DRAFT');
function allChecks() { return audited().flatMap((e) => trustChecks(e.id).map((c) => ({ ...c, e }))); }
function auditorOverview() {
  const checks = allChecks(); const n = (s) => checks.filter((c) => c.status === s).length;
  const chain = verifyAuditChain(); const done = n('PASS') + n('FAIL');
  const queue = audited().filter((e) => e.status === 'VERIFICATION' || trustChecks(e.id).some((c) => c.status !== 'PASS'));
  return `${heroBanner('auditor', `<h1 tabindex="-1">Audit. Verify.<br><span class="grad">Ensure Trust.</span></h1><p class="hb-sub">Independent verification and real-time monitoring for transparent, tamper-proof elections.</p>`)}${heroActions(btn('Run integrity check', { href: '/app/integrity', icon: 'shield' }))}
  <div class="grid g-sm-2" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${[
    statCard({ label: 'Elections under audit', value: audited().length, icon: 'ballot', to: '/app/elections' }),
    statCard({ label: 'Checks passed', value: n('PASS'), icon: 'checkCircle', tone: 'green', to: '/app/trust' }),
    statCard({ label: 'Checks failed', value: n('FAIL'), icon: 'error', tone: n('FAIL') ? 'red' : '', to: '/app/trust' }),
    statCard({ label: 'Pending checks', value: n('NOT_RUN') + n('WARN'), hint: 'Not run yet or warning', icon: 'clock', tone: 'amber' }),
    statCard({ label: 'Security events', value: S.security.length, icon: 'lock', to: '/app/security' }),
    statCard({ label: 'Audit completion', value: `${pct(done, checks.length)}%`, hint: 'Checks that produced a pass or fail', icon: 'activity' }),
  ].join('')}</div>
  <div class="grid g-lg-3 mt-6">${card('Integrity summary', `${chain.ok ? alertBox('success', 'Audit chain verified', `${chain.count} records from genesis; head ${hash(chain.head, 16)}`) : alertBox('error', 'Audit chain broken', esc(chain.reason))}<ul class="stack-sm mt-4" style="list-style:none;margin:0;padding:0">${audited().map((e) => { const v = trustVerdict(trustChecks(e.id)); return `<li class="row between"><span class="small">${esc(e.title)}</span>${badge(v.key === 'VERIFIED' ? 'green' : v.key === 'FAILURE' ? 'red' : 'amber', v.label)}</li>`; }).join('')}</ul>`)}
  ${card('Recent alerts', S.security.slice(0, 5).map((s) => `<div class="feed-item" style="padding:8px 0">${status(s.severity)}<span class="small" style="min-width:0">${esc(s.detail)}<span class="xs muted" style="display:block">${ago(s.at)}</span></span></div>`).join('') || '<p class="muted">None.</p>', { actions: btn('All', { href: '/app/security', size: 'sm', variant: 'ghost' }) })}
  ${card('Verification queue', queue.length ? queue.map((e) => `<div class="feed-item" style="padding:8px 0;align-items:center"><span style="flex:1;min-width:0"><b class="small strong">${esc(e.title)}</b><span class="xs muted" style="display:block">${trustChecks(e.id).filter((c) => c.status !== 'PASS').length} open check(s)</span></span>${btn('Inspect', { size: 'sm', variant: 'secondary', href: `/app/trust?election=${e.id}` })}</div>`).join('') : '<p class="muted">Nothing waiting.</p>')}</div>
  <div class="grid g-lg-2 mt-6">${card('Election timeline', `<ul class="timeline">${S.transitions.slice().sort((a, b) => b.at - a.at).slice(0, 6).map((t) => `<li><span class="tdot">${ic('flag', 'sm')}</span><span class="small"><b class="strong">${esc(election(t.eid)?.title)}</b>: ${LABEL[t.from]} → ${LABEL[t.to]}<span class="xs muted" style="display:block">${fmt(t.at)}</span></span></li>`).join('')}</ul>`)}${card('Audit activity', `<ul class="timeline">${S.audit.slice(-6).reverse().map((a) => `<li><span class="tdot">${ic('activity', 'sm')}</span><span class="small">${esc(a.detail)}<span class="xs muted" style="display:block">#${a.seq} · ${esc(a.actor)} · ${ago(a.at)}</span></span></li>`).join('')}</ul>`)}</div>`;
}
function auditLogPage() {
  const types = [...new Set(S.audit.map((a) => a.type))].sort(); const subs = [...new Set(S.audit.map((a) => a.sub))].sort();
  const t = dataTable('audit', { rows: S.audit, search: (a) => `${a.type} ${a.detail} ${a.actor} ${a.h}`, searchPlaceholder: 'Search events, actors or hashes', pageSize: 12, sort: 'seq', dir: -1,
    filters: [{ key: 't', label: 'Category', options: types.map((x) => [x, x.replace(/_/g, ' ').toLowerCase()]), test: (a, v) => a.type === v }, { key: 's', label: 'Subsystem', options: subs.map((x) => [x, x]), test: (a, v) => a.sub === v }, { key: 'o', label: 'Outcome', options: [['SUCCESS', 'Success'], ['DENIED', 'Denied']], test: (a, v) => a.outcome === v }],

ACT['audit-verify'] = async (el) => { markDone('audit-verified'); await withBusy(el, () => delay(600)); const v = verifyAuditChain(); $('#audit-result').innerHTML = `<div style="margin-bottom:16px">${v.ok ? alertBox('success', 'Chain verified from genesis', `${v.count} records; head ${hash(v.head, 24)}`) : alertBox('error', 'Chain verification failed', esc(v.reason))}</div>`; };
ACT['audit-export'] = () => download('digivote-audit-log.csv', toCsv([['seq', (a) => a.seq], ['timestamp', (a) => new Date(a.at).toISOString()], ['type', (a) => a.type], ['actor', (a) => a.actor], ['subsystem', (a) => a.sub], ['outcome', (a) => a.outcome], ['detail', (a) => a.detail], ['prev_hash', (a) => a.prev], ['hash', (a) => a.h]], tableRows('audit')), 'text/csv');

function runIntegrity() {
  const a = verifyAuditChain();
  const res = [{ target: 'Organization audit chain', sub: 'AUDIT', ok: a.ok, detail: a.ok ? `${a.count} records` : a.reason }];
  audited().forEach((e) => { const v = verifyBoard(e.id); res.push({ target: `Bulletin board · ${e.title}`, sub: 'BULLETIN', ok: v.ok, detail: v.ok ? `${v.count} entries` : `Breaks at entry ${v.at}` }); const pend = (S.pending[e.id] || []).length; const cons = boardOf(e.id).length + pend === ballotsOf(e.id).length; res.push({ target: `Record consistency · ${e.title}`, sub: 'VOTING', ok: cons, detail: `${ballotsOf(e.id).length} ballots, ${boardOf(e.id).length} on board, ${pend} pending` }); });
  return { at: Date.now(), by: actorLabel(), res, ok: res.every((r) => r.ok) };

function integrityPage() {
  const last = S.integrityRuns[S.integrityRuns.length - 1];
  const e2 = S.elections.find((e) => boardOf(e.id).length) ;

  <div class="grid g-sm-2 g-lg-4">${statCard({ label: 'Last verification', value: last ? ago(last.at) : 'Never', hint: last ? fmt(last.at) : 'Run a check', icon: 'clock' })}${statCard({ label: 'Result', value: last ? (last.ok ? 'All passed' : 'Failures') : '—', icon: last?.ok ? 'checkCircle' : 'error', tone: last ? (last.ok ? 'green' : 'red') : '' })}${statCard({ label: 'Failed checks', value: last ? last.res.filter((r) => !r.ok).length : '—', icon: 'warning' })}${statCard({ label: 'Runs recorded', value: S.integrityRuns.length, icon: 'activity' })}</div>
  <div class="mt-6">${card('Latest results', last ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Check</th><th>Subsystem</th><th>Result</th><th>Evidence</th></tr></thead><tbody>${last.res.map((r) => `<tr><td>${esc(r.target)}</td><td>${badge('gray', r.sub)}</td><td>${r.ok ? status('PASS') : status('FAIL')}</td><td class="small">${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>` : `<div style="padding:20px">${empty('No verification has run yet', 'Run an integrity check to recompute every chain.')}</div>`, { flush: true })}</div>
  <div class="grid g-lg-2 mt-6">${card('Verification history', S.integrityRuns.length ? `<ul class="timeline">${S.integrityRuns.slice().reverse().map((r) => `<li><span class="tdot">${ic(r.ok ? 'checkCircle' : 'error', 'sm')}</span><span class="small" style="flex:1">${r.ok ? 'All checks passed' : `${r.res.filter((x) => !x.ok).length} failure(s)`}<span class="xs muted" style="display:block">${esc(r.by)} · ${fmt(r.at)}</span></span></li>`).join('')}</ul>` : '<p class="muted">No runs yet.</p>')}
  ${card('Simulation only: tamper with the data', `<p class="small muted">See how DigiVote detects tampering. These buttons edit stored records directly, as an attacker with database access would — the real app has no such control. Then run the integrity check, verify a receipt, or open Trust & system health.</p><div class="row mt-4">${S.tamper ? btn('Restore audit record', { variant: 'secondary', act: 'tamper-audit-undo' }) : btn('Edit an audit record', { variant: 'danger', act: 'tamper-audit' })}${e2 ? (S.bbTamper ? btn('Restore bulletin entry', { variant: 'secondary', act: 'tamper-bb-undo' }) : btn('Edit a bulletin board entry', { variant: 'danger', act: 'tamper-bb', data: { eid: e2.id } })) : ''}</div>${S.tamper ? `<p class="small mt-3">Audit record #${S.tamper.seq} was changed.</p>` : ''}${S.bbTamper ? `<p class="small mt-3">Bulletin entry #${S.bbTamper.seq} of ${esc(election(S.bbTamper.eid).title)} was changed.</p>` : ''}`)}</div>`;

ACT['integrity-run'] = async (el) => { try { const r = await withBusy(el, () => api(() => { const run = runIntegrity(); S.integrityRuns.push(run); return run; }, 1100)); toast(r.ok ? 'success' : 'error', r.ok ? 'Integrity check passed.' : 'Integrity check found failures.'); rerender(); } catch (e) { toast('error', esc(e.message)); } };

function resultVerification() {
  const e = pickElection((x) => S.results[x.id]);

  const checks = [['Stored totals match an independent recount', disc.length === 0], ['Ballots tallied = ballots stored', res.total === ballotsOf(e.id).length], ['Board entries covered = entries on the board', res.bbCount === boardOf(e.id).length], ['Bulletin chain verifies', verifyBoard(e.id).ok], ['Result hash recomputes', sha256(JSON.stringify(res.items.map((i) => [i.key, i.votes])) + res.bbHead) === res.hash]];

}

function trustSummary(e) {
  const checks = trustChecks(e.id); const v = trustVerdict(checks);
  return `<div class="stack"><div class="verdict ${v.cls}"><span class="vi">${ic(v.icon)}</span><div><p class="strong" style="font-size:18px">${v.label}</p><p class="small">${v.why} Rule: any failed check → Integrity failure; any warning or check not yet run → Attention required; all passed → Verified. There is no numeric trust score.</p></div></div>${card('Checks', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Area</th><th>Check</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${checks.map((c) => `<tr><td class="small">${esc(c.area)}</td><td>${esc(c.label)}</td><td>${status(c.status)}</td><td class="small muted">${esc(c.detail)}</td></tr>`).join('')}</tbody></table></div>`, { flush: true })}</div>`;
}

  const tone = (s) => (s === 'PASS' ? 'green' : s === 'FAIL' ? 'red' : '');

  const passed = checks.filter((x) => x.status === 'PASS').length, failed = checks.filter((x) => x.status === 'FAIL').length;
  const body = {
    overview: () => `<div class="verdict ${v.cls}" style="margin-bottom:16px"><span class="vi">${ic(v.icon)}</span><div><p class="strong" style="font-size:18px">${v.label}</p><p class="small">${v.why} Computed live from ${checks.length} checks for ${esc(e.title)}.</p></div></div><div class="grid g-sm-2 g-lg-3">${[
      statCard({ label: 'Votes validated', value: LABEL[c('validation').status], hint: `${ballotsOf(e.id).length} validated · ${pend} pending publication · 0 failed`, icon: 'checkCircle', tone: tone(c('validation').status) }),
      statCard({ label: 'Duplicate prevention', value: LABEL[c('duplicates').status], hint: `${dupes} duplicate attempt(s) rejected · entitlement enforced`, icon: 'ballot', tone: tone(c('duplicates').status) }),
      statCard({ label: 'Anonymity controls', value: 'By design', hint: 'Identity and ballot tables share no keys; verified by automated tests, not a runtime check', icon: 'eye' }),
      statCard({ label: 'Hash integrity', value: LABEL[c('board').status], hint: c('board').detail, icon: 'shield', tone: tone(c('board').status) }),
      statCard({ label: 'Audit completion', value: `${passed}/${checks.length}`, hint: `${passed} passed · ${failed} failed · ${checks.length - passed - failed} pending`, icon: 'activity', tone: failed ? 'red' : '' }),
      statCard({ label: 'System health', value: health.api === 'UP' ? 'Operational' : 'Unavailable', hint: health.ms != null ? `API answered in ${health.ms} ms (simulated)` : 'Run a health probe on the System health tab', icon: 'speed', tone: health.api === 'UP' ? 'green' : 'red' }),
    ].join('')}</div>`,
    integrity: () => trustSummary(e),

    verification: () => `<div class="grid g-lg-2">${card('Receipt verification progress', `${kv([['Ballots on the board', boardOf(e.id).length], ['Waiting for next batch', pend], ['Covered by the tally', S.results[e.id] ? S.results[e.id].bbCount : 'Not tallied'], ['Receipt verifications (aggregate)', (S.verifyCount || {})[e.id] || 0]])}<div class="mt-3">${progress(pct(boardOf(e.id).length, Math.max(1, ballotsOf(e.id).length)))}<p class="xs muted mt-1">${pct(boardOf(e.id).length, Math.max(1, ballotsOf(e.id).length))}% of ballots can already be verified as recorded.</p></div>`)}${card('Bulletin board consistency', `${status(c('board').status)} ${status(c('consistency').status)} ${status(c('tally').status)}<p class="small muted mt-2">${esc(c('consistency').detail)}. Final-count inclusion: ${esc(c('tally').detail)}.</p>`)}</div>`,

    system: () => `${card('Service status', `${kv([['Backend API', health.api === 'UP' ? badge('green', 'Up') : badge('red', 'Down')], ['Latency', health.ms != null ? `${health.ms} ms` : 'Not measured'], ['Database', health.api === 'UP' ? badge('green', 'Inferred up (reads succeed)') : badge('red', 'Unknown')], ['Storage', 'Local media storage'], ['API errors', 'Not measured by the backend'], ['Last probe', health.at ? fmt(health.at) : '—']])}<div class="row mt-4">${btn('Probe now', { act: 'health-probe', icon: 'speed' })}</div><p class="xs muted mt-3">The real app measures availability and latency from the browser; everything here is simulated. Turn on “Simulate API outage” to see a failure.</p>`)}`,
    report: () => `${trustSummary(e)}<div class="row mt-4">${btn('Download trust report (JSON)', { variant: 'secondary', icon: 'download', act: 'trust-dl', data: { eid: e.id } })}</div>`,
  }[tab]();
  return `${pageHead('Trust & system health', 'Election integrity, verification status, audit progress and platform health — every status from an explicit rule over real checks.')}${electionPicker(e, (x) => x.status !== 'DRAFT')}<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-act="nav" data-to="/app/trust?election=${e.id}&tab=${k}">${l}</button>`).join('')}</div>${body}`;

const IMG = {
  'promo-org-owner': 'globe', 'promo-election-admin': 'people-globe', 'promo-voter': 'hero-organizer', 'promo-candidate': 'hero-candidate', 'promo-auditor': 'hero-administrator',
  'hero-auditor': 'globe', map: 'india-map', 'find-elections': 'hero-landing', 'candidate-photo': 'hero-candidate',
};
const TYPE_IMG = { Government: 1, Educational: 2, Organization: 3, Community: 4 };
const D = {
  img: (name, cls = 'd-img') => {
    const strip = /^election-([1-4])$/.exec(name);
    if (strip) return `<span class="${cls} d-strip s${strip[1]}" aria-hidden="true"></span>`;
    const fb = IMG[name] ? `if(!this.dataset.fb){this.dataset.fb=1;this.src='images/${IMG[name]}.webp'}else ` : '';
    return `<img class="${cls} i-${name}" src="images/${name}.webp" alt="" aria-hidden="true" onerror="${fb}this.remove()">`;
  },
  hero: (image, html, aside = '', variant = 'ballot') => `<section class="hero-banner hb-${variant}">${D.img(image, 'hb-img')}<div class="hb-copy">${html}</div>${aside ? `<div class="hb-aside">${aside}</div>` : ''}</section>`,
  stat: ([icon, accent, label, value, hint, tone = 'up'], to = '') => `<${to ? `a href="#${to}"` : 'div'} class="d-card d-stat"><span class="d-tile a-${accent}">${ic(icon)}</span><span class="d-stat-b"><span class="d-stat-l">${label}</span><b class="d-stat-v">${value}</b>${hint ? `<span class="d-hint ${tone}">${hint}</span>` : ''}</span>${to ? `<span class="d-arrow">${ic('arrowRight')}</span>` : ''}</${to ? 'a' : 'div'}>`,
  stat2: ([icon, accent, value, label, hint]) => `<div class="d-card d-stat"><span class="d-tile lg a-${accent}">${ic(icon)}</span><span class="d-stat-b"><b class="d-stat-v">${value}</b><span class="d-stat-l">${label}</span><span class="d-hint up">↑ ${hint}</span></span></div>`,
  card: (title, body, { link = '', linkLabel = 'View All', right = '', cls = '', badge = '' } = {}) => `<section class="d-card ${cls}"><header class="d-head"><h2>${title}${badge}</h2>${right}${link ? `<a class="d-link" href="#${link}">${linkLabel} ${ic('arrowRight', 'sm')}</a>` : ''}</header>${body}</section>`,
  sel: (t) => `<span class="d-select">${t} ${ic('chevronRight', 'sm')}</span>`,
  pill: (tone, t) => `<span class="d-pill p-${tone}"><i></i>${t}</span>`,
  chip: (tone, t) => `<span class="d-chip c-${tone}">${t}</span>`,
  row: (cols, html, cls = '') => `<div class="d-row ${cls}" style="--cols:${cols}">${html}</div>`,
  ring: (segs, center, label, size = 140) => {
    const total = segs.reduce((n, s) => n + s[1], 0) || 1; let acc = 0;
    const stops = segs.map(([, v, c]) => { const a = (acc / total) * 360; acc += v; const b = (acc / total) * 360; return `${c} ${a + 1.2}deg ${b - 1.2}deg, transparent ${b - 1.2}deg ${b}deg`; }).join(',');
    return `<div class="d-ring-wrap"><div class="d-ring" style="width:${size}px;height:${size}px;background:conic-gradient(${stops})"><div class="d-ring-h"><b class="${String(center).length > 4 ? 'long' : ''}">${center}</b><span>${label}</span></div></div><ul class="d-legend">${segs.map(([l, v, c, suffix = '']) => `<li><i style="background:${c}"></i><b>${v}${suffix}</b> ${l}</li>`).join('')}</ul></div>`;
  },
  line: (series, labels, { max = 100, ticks = [0, 20, 40, 60, 80, 100], unit = '%', h = 150, tip = null } = {}) => {
    const W = 420; const H = h; const L = 34; const B = 20; const T = 8; const R = 8;
    const x = (i, n) => L + (i * (W - L - R)) / (n - 1); const y = (v) => T + (H - T - B) * (1 - v / max);
    const path = (pts) => pts.map((p, i) => { if (!i) return `M${p[0]},${p[1]}`; const a = pts[i - 1]; const cx = (a[0] + p[0]) / 2; return `C${cx},${a[1]} ${cx},${p[1]} ${p[0]},${p[1]}`; }).join(' ');
    const grid = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(120,140,220,.15)"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end" fill="#8e9dcc" font-size="9">${t}${unit}</text>`).join('');
    const xl = labels.map((l, i) => (l ? `<text x="${x(i, labels.length)}" y="${H - 5}" text-anchor="middle" fill="#8e9dcc" font-size="9">${l}</text>` : '')).join('');
    const lines = series.map(([vals, color], si) => {
      const pts = vals.map((v, i) => [x(i, vals.length), y(v)]);
      const area = si === 0 ? `<path d="${path(pts)} L${pts[pts.length - 1][0]},${y(0)} L${pts[0][0]},${y(0)} Z" fill="url(#lg${color.slice(1)})"/>` : '';
      return `<defs><linearGradient id="lg${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${area}<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="2.2"/>${pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${color}"/>`).join('')}`;
    }).join('');
    let tipHtml = '';
    if (tip) { const [i, text, sub] = tip; const v = series[0][0][i]; const px = x(i, series[0][0].length); const py = y(v); tipHtml = `<line x1="${px}" x2="${px}" y1="${py}" y2="${y(0)}" stroke="#3b82f6" stroke-dasharray="3 3"/><rect x="${px - 22}" y="${py - 34}" width="44" height="26" rx="5" fill="#0a1230" stroke="#3b82f6"/><text x="${px}" y="${py - 20}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">${text}</text><text x="${px}" y="${py - 11}" text-anchor="middle" fill="#8e9dcc" font-size="7">${sub}</text><circle cx="${px}" cy="${py}" r="4.5" fill="#fff" stroke="#3b82f6" stroke-width="2"/>`; }
    return `<svg class="d-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">${grid}${lines}${tipHtml}${xl}</svg>`;
  },
  bars: (rows, { max, ticks = [], showValues = false, h = 150 } = {}) => {
    const m = max || Math.max(...rows.map((r) => r[1]));
    return `<div class="d-bars" style="height:${h}px">${ticks.length ? `<div class="d-bars-y">${[...ticks].reverse().map((t) => `<span>${t}</span>`).join('')}</div>` : ''}<div class="d-bars-plot">${rows.map(([l, v, c]) => `<div class="d-bar">${showValues ? `<em>${v.toLocaleString('en-IN')}</em>` : ''}<span style="height:${(v / m) * 100}%;background:${c}"></span><small>${l}</small></div>`).join('')}</div></div>`;
  },
  feed: (rows) => `<ul class="d-feed">${rows.map(([icon, accent, text, time, sub = '']) => `<li><span class="d-tile sm a-${accent}">${ic(icon)}</span><span class="d-feed-t">${text}${sub ? `<small>${sub}</small>` : ''}</span><span class="d-time">${time}</span></li>`).join('')}</ul>`,
  status: (rows) => `<ul class="d-status">${rows.map(([icon, label]) => `<li><span class="d-sic">${ic(icon)}</span><span>${label}</span><em>Operational</em><i></i></li>`).join('')}</ul>`,
  actions: (rows, cls = '') => `<div class="d-actions ${cls}">${rows.map(([icon, accent, t, d, to = '']) => `<a class="d-action" href="#${to || '/app'}"><span class="d-tile sm a-${accent}">${ic(icon)}</span><span><b>${t}</b><small>${d}</small></span>${ic('arrowRight', 'sm')}</a>`).join('')}</div>`,
  table: (cols, rows) => `<div class="d-table-wrap"><table class="d-table"><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
  thumb: (type) => { const n = TYPE_IMG[type] || 1; return `<span class="d-thumb t${n - 1}">${D.img(`election-${n}`)}${ic('building')}</span>`; },
  btn: (label, to, kind = 'primary') => `<a class="d-btn ${kind}" href="#${to}">${label} ${ic('arrowRight', 'sm')}</a>`,
  more: '<span class="d-dots" aria-hidden="true">•••</span>',
};

// =====================================================================================================
// QR receipt submission to the audit desk (prototype rules)
// A ballot stays provisional until its signed QR receipt is submitted to the audit desk within 30 seconds.
// Valid → the ballot is committed and counted. Too late → it expires and the voter must recast.
// Two or more duplicate or invalid submissions → the vote is voided and the voter is emailed to revote.
// =====================================================================================================
const QR_WINDOW_MS = 30 * 1000; const QR_MAX_ISSUES = 2;
const fmtPrecise = (t) => { const d = new Date(t); return `${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })} ${d.toLocaleTimeString(undefined, { hour12: false })}.${String(d.getMilliseconds()).padStart(3, '0')}`; };
const hms = (t) => new Date(t).toLocaleTimeString(undefined, { hour12: false });
const qrSig = (eid, code, at, th, c) => sha256(`${receiptKey(eid)}|DIGI-VOTE-QR-v1|${code}|${eid}|${at}|${th}|${c}`).slice(0, 24);
/** QR content: DIGIVOTE|QR1|receipt code|election|issued (ms)|spent-token hash|ballot commitment|signature */
const qrPayload = (w) => ['DIGIVOTE', 'QR1', w.code, w.eid, w.at, w.th, w.c, qrSig(w.eid, w.code, w.at, w.th, w.c)].join('|');
const QR_RESULT = { VALID: ['green', 'Valid', 'success', 'QR validated'], DUPLICATE: ['red', 'Duplicate', 'warning', 'Duplicate QR'], INVALID: ['red', 'Invalid', 'error', 'Invalid QR'], EXPIRED: ['amber', 'Expired', 'error', 'QR expired'] };

function issueProvisional(eid, sel, th) {
  const at = Date.now(); const nonce = Math.random().toString(36).slice(2);
  const c = sha256(`DIGI-VOTE-BALLOT-v1|${eid}|${sel.join(',')}|${nonce}`);
  const code = makeReceiptCode(eid, th);
  (S.provisional ||= {})[code] = { eid, sel, c, th, at, expires: at + QR_WINDOW_MS, state: 'PENDING_QR' };
  audit('BALLOT_RECEIVED', `Anonymous ballot received · token ${th.slice(0, 12)}… · commitment ${c.slice(0, 12)}… · provisional until its QR receipt is validated (30 s)`, { eid, actor: 'DigiVote service', sub: 'BALLOT' });
  return { code, c, at, expires: at + QR_WINDOW_MS };
}
function commitProvisional(code) {
  const p = S.provisional[code];
  (S.ballots[p.eid] ||= []).push({ id: rid('b'), c: p.c, sel: p.sel });
  (S.pending[p.eid] ||= []).push(p.c);
  S.receipts[receiptHash(code)] = { eid: p.eid, c: p.c, th: p.th };
  p.state = 'VALIDATED'; p.sel = null; p.validatedAt = Date.now();
  flushPending(p.eid);
  audit('RECEIPT_QR_VALIDATED', `QR receipt validated · receipt hash ${receiptHash(code).slice(0, 12)}… · token ${p.th.slice(0, 12)}… · ballot committed to the tally`, { eid: p.eid, actor: 'Audit desk', sub: 'BALLOT' });
}
/** Removes a not-validated (or invalidated) vote so the voter can recast with a new anonymous token. */
function voidVote(u, w, reason, kind) {
  const eid = w.eid; const p = S.provisional?.[w.code];
  if (w.state === 'VALIDATED') {
    S.ballots[eid] = ballotsOf(eid).filter((b) => b.c !== w.c);
    S.pending[eid] = (S.pending[eid] || []).filter((c) => c !== w.c);
    delete S.receipts[receiptHash(w.code)];
  }
  if (p) { p.state = 'VOIDED'; p.sel = null; p.voidedAt = Date.now(); p.voidKind = kind; }
  S.spent[eid] = (S.spent[eid] || []).filter((t) => t !== w.th);
  S.creds[eid] = (S.creds[eid] || []).filter((em) => em !== u.email);
  S.wallet[u.id] = (S.wallet[u.id] || []).filter((x) => x.code !== w.code);
  (S.voided ||= []).unshift({ uid: u.id, eid, code: w.code, at: Date.now(), reason, kind });
  if (UI.ballot?.eid === eid) UI.ballot = null;
  audit('BALLOT_VOIDED', `${kind === 'EXPIRED' ? 'QR receipt not submitted within 30 s; provisional ballot discarded' : `Vote invalidated after ${w.flags} duplicate/invalid QR submissions; voter asked to revote`} · token ${w.th.slice(0, 12)}…`, { eid, actor: 'Audit desk', sub: 'BALLOT' });
}
function sendEmail(u, subject, body, extra = {}) {
  const m = { id: rid('m'), uid: u.id, to: u.email, from: 'DigiVote Audit Desk <audit@digivote.demo>', at: Date.now(), subject, body, read: false, ...extra };
  (S.emails ||= []).unshift(m);
  notify([u.id], { title: subject, msg: extra.summary || `Email from the DigiVote Audit Desk to ${u.email}`, cat: 'Email', eid: extra.eid || null, to: '/app/mail', mail: m.id });
  return m;
}
/** Submits QR content to the audit desk on behalf of the signed-in voter. Returns the logged submission. */
function qrSubmit(text, source) {
  const u = me(); const now = Date.now(); const parts = String(text || '').trim().split('|');
  const mine = myReceipts().filter((x) => x.state);
  const w = mine.find((x) => x.code === parts[2]) || mine.find((x) => x.state === 'PENDING_QR') || mine[mine.length - 1] || null;
  let result; let detail;
  if (parts.length !== 8 || parts[0] !== 'DIGIVOTE' || parts[1] !== 'QR1') { result = 'INVALID'; detail = 'Not a DigiVote receipt QR (unreadable or wrong format)'; }
  else {
    const [, , code, eid, atS, th, c, sig] = parts; const p = S.provisional?.[code];
    if (!p || p.eid !== eid) { result = 'INVALID'; detail = 'No receipt with this code was issued'; }
    else if (qrSig(eid, code, Number(atS), th, c) !== sig || p.th !== th || p.c !== c || p.at !== Number(atS)) { result = 'INVALID'; detail = 'Signature mismatch: the QR content was altered'; }
    else if (p.state === 'VOIDED') { result = 'INVALID'; detail = 'This receipt was voided; the vote must be cast again'; }
    else if (p.state === 'VALIDATED') { result = 'DUPLICATE'; detail = 'This QR was already submitted and validated'; }
    else if (now > p.expires) { result = 'EXPIRED'; detail = `Submitted ${Math.round((now - p.at) / 1000)} s after issue (limit 30 s)`; }
    else { result = 'VALID'; detail = `Validated ${((now - p.at) / 1000).toFixed(1)} s after issue; ballot committed`; }
  }
  const sub = { id: rid('q'), at: now, result, detail, source, code: w && result !== 'INVALID' ? w.code : (parts[0] === 'DIGIVOTE' ? parts[2] : null), eid: w?.eid || null, voter: `${sha256(u.id).slice(0, 6)}…${sha256(u.id).slice(-5)}`, th: w?.th || null };
  (S.qrSubs ||= []).unshift(sub);
  if (w) (w.subs ||= []).unshift({ at: now, result, detail, source });
  if (result === 'VALID') { commitProvisional(w.code); w.state = 'VALIDATED'; w.validatedAt = now; }
  else if (result === 'EXPIRED' && w) voidVote(u, w, 'The 30-second QR submission window expired', 'EXPIRED');
  else if (w) {
    w.flags = (w.flags || 0) + 1;
    security(result === 'DUPLICATE' ? 'DUPLICATE_QR_SUBMISSION' : 'INVALID_QR_SUBMISSION', 'MEDIUM', `${detail} (receipt ${formatCode(w.code).slice(0, 11)}…)`, { eid: w.eid });
    if (w.flags >= QR_MAX_ISSUES) {
      const e = election(w.eid); const issues = w.subs.filter((x) => x.result === 'DUPLICATE' || x.result === 'INVALID');
      voidVote(u, w, `${w.flags} duplicate or invalid QR submissions were found`, 'ISSUES');
      sub.voided = true;
      sub.email = sendEmail(u, 'Your vote is facing an issue — please revote', `Hello ${u.name},

We could not validate your vote in "${e.title}".

The audit desk found ${issues.length} problems with the QR receipt submitted for receipt ${formatCode(w.code)}:
${issues.slice().reverse().map((x) => `  • ${QR_RESULT[x.result][1]} — ${x.detail} (${fmtPrecise(x.at)})`).join('\n')}

Because duplicate or invalid QR receipts were found, we can't validate that vote. For your protection it has been voided and was not counted.

Please sign in and cast your vote again. You will receive a new anonymous token and a new QR receipt; submit it once, within 30 seconds.

DigiVote Audit Desk
(This is a prototype: the email is shown inside DigiVote and is not sent to a real mailbox.)`, { eid: w.eid, cta: `/app/vote/${w.eid}`, summary: `We couldn't validate your vote in ${e.title}: ${issues.length} duplicate or invalid QR receipts were found. Your vote was voided and not counted — please cast it again. Full email in Mail.` });
    }
  }
  save();
  return sub;
}
function showQrResult(sub) {
  const [, label, kind, title] = QR_RESULT[sub.result];
  toast(kind, `<b>${title}</b> — ${esc(sub.detail)}${sub.voided ? '. Your vote was voided; check your mail.' : ''}`);
  rerender();
  if (sub.email) setTimeout(() => openEmail(sub.email.id), 350);
  return label;
}
// expire receipts that were not submitted in time, and keep the countdowns moving
setInterval(() => {
  if (typeof S === 'undefined' || !S || !me()) return;
  const now = Date.now(); let changed = false;
  myReceipts().filter((w) => w.state === 'PENDING_QR' && now > w.expires).forEach((w) => {
    const u = me(); const e = election(w.eid);
    w.subs.unshift({ at: now, result: 'EXPIRED', detail: 'No QR receipt was submitted within 30 seconds', source: 'Audit desk timer' });
    (S.qrSubs ||= []).unshift({ id: rid('q'), at: now, result: 'EXPIRED', detail: 'No QR receipt submitted within 30 s', source: 'Audit desk timer', code: w.code, eid: w.eid, voter: `${sha256(u.id).slice(0, 6)}…${sha256(u.id).slice(-5)}`, th: w?.th || null });
    voidVote(u, w, 'The 30-second QR submission window expired before the QR receipt was submitted', 'EXPIRED');
    notify([u.id], { title: 'QR receipt expired', msg: `Your ballot in ${e.title} was not validated in time. Cast it again.`, cat: 'Election', eid: w.eid, to: `/app/vote/${w.eid}` });
    toast('error', `<b>QR receipt expired</b> — your ballot in ${esc(e.title)} was not validated within 30 seconds. Please cast your vote again.`);
    changed = true;
  });
  if (changed) { save(); rerender(); return; }
  $$('[data-qr-left]').forEach((el) => {
    const w = myReceipts().find((x) => x.code === el.dataset.qrLeft); if (!w) return;
    const left = Math.max(0, w.expires - now); el.textContent = (left / 1000).toFixed(1);
    const ring = el.closest('.qr-ring'); ring.style.setProperty('--p', left / QR_WINDOW_MS); ring.classList.toggle('low', left < 10000);
  });
}, 100);

function qrReceiptPanel(w) {
  const e = election(w.eid); const pend = w.state === 'PENDING_QR'; const ok = w.state === 'VALIDATED';
  const payload = qrPayload(w); const left = Math.max(0, w.expires - Date.now());
  const status = pend
    ? `<div class="qr-timer" role="timer" aria-label="Time left to submit the QR receipt"><span class="qr-ring ${left < 10000 ? 'low' : ''}" style="--p:${left / QR_WINDOW_MS}"><b data-qr-left="${w.code}">${(left / 1000).toFixed(1)}</b><small>seconds</small></span><div><b class="t">Submit this QR to the audit desk now</b><p class="small muted">Your ballot is provisional. It is validated and counted only after this QR receipt is submitted within 30 seconds. If time runs out it expires, and you must cast your vote again.</p></div></div>`
    : ok ? alertBox('success', 'Validated by the audit desk', `QR receipt accepted at ${fmtPrecise(w.validatedAt)}. Your ballot is committed and will be counted. Submitting this QR again is recorded as a duplicate.`) : '';
  const issues = w.flags ? alertBox('warning', `${w.flags} of ${QR_MAX_ISSUES} issues on this receipt`, 'Duplicate or invalid QR submissions are flagged. At 2 issues the vote is voided and you are emailed to revote.') : '';
  const details = kv([
    ['Receipt code', `<span class="mono">${formatCode(w.code)}</span>`],
    ['Election', esc(e.title)],
    ['Issued at', fmtPrecise(w.at)],
    ['QR valid until', `${fmtPrecise(w.expires)} <span class="xs muted">(30 s window)</span>`],
    ...(ok ? [['Validated at', fmtPrecise(w.validatedAt)]] : []),
    ['Anonymous token hash', `${hash(w.th, 28)} <span class="xs muted">SHA-256 of the spent token</span>`],
    ['Ballot commitment', `${hash(w.c, 28)} <span class="xs muted">SHA-256</span>`],
    ['Receipt hash', `${hash(receiptHash(w.code), 28)} <span class="xs muted">what the server stores</span>`],
    ['QR signature', `<span class="mono">${qrSig(w.eid, w.code, w.at, w.th, w.c)}</span>`],
  ]);
  const actions = pend
    ? `<div class="row">${btn('Submit QR to audit desk', { act: 'qr-submit', data: { code: w.code }, icon: 'qr' })}<label class="btn secondary" for="qr-sub-file" style="cursor:pointer">${ic('upload', 'sm')}Upload QR image</label><input type="file" id="qr-sub-file" accept="image/*" data-change="qr-sub-file" hidden>${btn('Download QR (PNG)', { variant: 'ghost', icon: 'download', act: 'qr-png', data: { code: w.code } })}</div>`
    : ok ? `<div class="row">${btn('Verify now', { act: 'receipt-verify', data: { code: w.code } })}${btn('Submit QR again', { variant: 'secondary', act: 'qr-submit', data: { code: w.code } })}${btn('Download QR (PNG)', { variant: 'ghost', icon: 'download', act: 'qr-png', data: { code: w.code } })}</div>` : '';
  const log = (w.subs || []).length ? `<div class="mt-4"><h3 class="strong" style="font-size:14px">Audit desk submissions</h3><ul class="qr-log">${w.subs.map((x) => `<li>${badge(QR_RESULT[x.result][0], QR_RESULT[x.result][1])}<span class="d">${esc(x.detail)} <span class="xs muted">· ${esc(x.source)}</span></span><time>${fmtPrecise(x.at)}</time></li>`).join('')}</ul></div>` : '';
  const test = `<details class="acc mt-4"><summary>Test the audit checks</summary><p class="small muted mt-2">This box holds the exact QR content. Edit any character and submit it to see an <b>invalid</b> result; submit a validated QR again to see a <b>duplicate</b>. Two issues void the vote and send you an email.</p><form data-form="qr-text" class="stack-sm mt-2" novalidate>${textarea('qrtext', payload, 'rows="3" spellcheck="false" style="font-family:var(--mono);font-size:12px"')}<div class="row"><button class="btn secondary sm" type="submit">Submit this content</button>${btn('Submit a tampered copy', { size: 'sm', variant: 'ghost', act: 'qr-tamper', data: { code: w.code } })}</div></form></details>`;
  return `<div class="receipt qr-receipt"><div class="row top" style="gap:24px;flex-wrap:wrap"><div style="text-align:center">${qrImg(payload, `Signed QR receipt ${formatCode(w.code)}`, 230)}<p class="xs muted mt-1">Signed QR receipt</p></div><div style="flex:1;min-width:260px" class="stack-sm"><p class="xs muted">QR receipt · ${esc(S.org.name)}</p><b class="strong" style="font-size:17px">${esc(e.title)}</b>${status}${issues}${details}${actions}</div></div>${log}${test}<p class="xs muted mt-3">The QR holds the receipt code, election, issue time, the anonymous token hash, the ballot commitment and a server signature. It contains no name or email and never reveals your choice.</p></div>`;
}
function voidNotice(eid) {
  const v = (S.voided || []).find((x) => x.uid === S.session && x.eid === eid);
  if (!v || myReceipts().some((r) => r.eid === eid)) return '';
  return `<div style="margin-bottom:18px">${alertBox('error', v.kind === 'EXPIRED' ? 'Your QR receipt expired — please recast' : 'Your vote is facing an issue — please revote', `${esc(v.reason)} (${fmtPrecise(v.at)}). That ballot was voided and is not counted. Cast your vote again below: you will get a new anonymous token and a new QR receipt.`)}</div>`;
}
const findMine = (code) => myReceipts().find((x) => x.code === code);
Object.assign(ACT, {
  async 'qr-submit'(el) { const w = findMine(el.dataset.code); if (!w) return; await withBusy(el, () => delay(300)); showQrResult(qrSubmit(qrPayload(w), 'Receipt QR on this device')); },
  'qr-tamper'(el) { const w = findMine(el.dataset.code); if (!w) return; const p = qrPayload(w).split('|'); p[6] = (p[6][0] === 'a' ? 'b' : 'a') + p[6].slice(1); showQrResult(qrSubmit(p.join('|'), 'Tampered copy (test)')); },
  'qr-png'(el) {
    const w = findMine(el.dataset.code); if (!w) return; const e = election(w.eid);
    const cv = document.createElement('canvas'); cv.width = 560; cv.height = 700; const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#0b1f4d'; g.fillRect(0, 0, cv.width, 70);
    g.fillStyle = '#fff'; g.font = 'bold 26px Segoe UI, Arial'; g.fillText('DigiVote · QR receipt', 24, 45);
    const size = drawQr(g, qrPayload(w), 40, 90, 480);
    g.fillStyle = '#0b1f4d'; g.font = 'bold 18px Segoe UI, Arial'; g.fillText(e.title.slice(0, 44), 24, 110 + size);
    g.fillStyle = '#334155'; g.font = '15px Consolas, monospace'; g.fillText(formatCode(w.code), 24, 138 + size);
    g.font = '13px Segoe UI, Arial'; g.fillText(`Issued ${fmtPrecise(w.at)} · valid until ${fmtPrecise(w.expires)}`, 24, 162 + size);
    const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `digivote-qr-${formatCode(w.code)}.png`; document.body.appendChild(a); a.click(); a.remove();
    toast('info', 'QR image downloaded. Upload it with “Upload QR image” before the timer runs out.');
  },
  'mail-open'(el) { openEmail(el.dataset.id); },
});
FORMS['qr-text'] = (f) => showQrResult(qrSubmit(f.qrtext.value, 'Pasted QR content'));
CHANGE['qr-sub-file'] = async (el) => {
  const file = el.files[0]; el.value = ''; if (!file) return;
  try { const text = await decodeQrImage(file); showQrResult(qrSubmit(text, `QR image “${file.name}”`)); } catch (er) { toast('error', esc(er.message)); }
};

// ---------- Mail (prototype inbox; nothing is sent to a real mailbox) ----------
const myMail = () => (S.emails || []).filter((m) => m.uid === S.session);
function openEmail(id) {
  const m = (S.emails || []).find((x) => x.id === id); if (!m) return; m.read = true; S.notes.filter((n) => n.mail === id).forEach((n) => { n.read = true; }); save(); renderTopbar();
  modal({ title: esc(m.subject), wide: true, body: `${kv([['From', esc(m.from)], ['To', esc(m.to)], ['Received', fmtPrecise(m.at)]])}<div class="mail-view mt-4">${esc(m.body)}</div>${m.cta ? `<div class="row mt-4">${btn('Cast my vote again', { href: m.cta, icon: 'ballot' })}</div>` : ''}` });
}
function mailPage() {
  const list = myMail();
  return `${pageHead('Mail', 'Emails from DigiVote to your address. In this prototype they are delivered here instead of to a real mailbox.')}${list.length ? card('', `<ul class="mail-list">${list.map((m) => `<li class="${m.read ? '' : 'unread'}"><button type="button" data-act="mail-open" data-id="${m.id}"><span class="d-tile sm a-${m.read ? 'blue' : 'red'}">${ic('message')}</span><span style="flex:1;min-width:0"><b>${esc(m.subject)}</b><small>${esc(m.from)} → ${esc(m.to)}</small></span><time class="small muted">${fmtPrecise(m.at)}</time></button></li>`).join('')}</ul>`) : empty('No emails yet', 'If the audit desk cannot validate your vote, you will be emailed here.')}`;
}
APP_ROUTES.push(['/app/mail', mailPage]);

// ---------- live QR submissions on the auditor dashboard ----------
const liveQrRows = () => (S.qrSubs || []).slice(0, 5).map((x) => [hms(x.at), x.code ? `${formatCode(x.code).slice(0, 11)}…` : '—', x.th ? `${x.th.slice(0, 6)}…${x.th.slice(-5)}` : '—', QR_RESULT[x.result][1], 'Voter QR']);
const liveAnomalies = () => (S.qrSubs || []).filter((x) => x.result !== 'VALID').slice(0, 3).map((x) => [x.result === 'EXPIRED' ? 'clock' : 'warning', 'red', `${QR_RESULT[x.result][3]} submission`, hms(x.at), x.detail]);
function liveVerifyResult() {
  const x = S.qrSubs[0]; const [tone, label] = QR_RESULT[x.result]; const e = x.eid ? election(x.eid) : null;
  return `<div class="d-valid" style="${x.result === 'VALID' ? '' : 'background:rgba(239,68,68,.14);color:#f87171'}">${ic(x.result === 'VALID' ? 'checkCircle' : 'warning')} ${label} ${x.result === 'VALID' ? 'Vote' : 'QR'}</div><dl class="d-kv">${[['QR ID', x.code ? formatCode(x.code).slice(0, 17) + '…' : '—'], ['Election', e ? esc(e.title) : '—'], ['Anonymous Token (Hashed)', x.th ? `<span class="mono" title="${x.th}">${x.th.slice(0, 8)}…${x.th.slice(-5)}</span>` : '—'], ['Timestamp', fmtPrecise(x.at)], ['Status', `<span class="t-${tone === 'green' ? 'green' : 'red'}">${esc(x.detail)}</span>`], ['Source', esc(x.source)]].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${D.btn('View Audit Trail', '/app/audit', 'outline')}`;
}

// ---------- Anonymous ballot ledger shared with the other roles (no voter identity) ----------
const ledgerRows = () => Object.entries(S.provisional || {}).map(([code, p]) => ({ code, ...p })).sort((a, b) => b.at - a.at);
const ledgerState = (r) => (r.state === 'VOIDED' ? ['red', r.voidKind === 'EXPIRED' ? 'Expired' : 'Voided'] : r.state === 'VALIDATED' ? ['green', 'Validated'] : ['orange', 'Awaiting QR']);
function ledgerCard(title = 'Anonymous Ballot Ledger') {
  const rows = ledgerRows().slice(0, 8);
  const live = S.elections.filter((x) => x.status === 'VOTING');
  const sum = `<div class="d-ledger-sum">${live.map((x) => `<span><b>${esc(x.title)}</b> · turnout ${ballotsOf(x.id).length} of ${x.eligible.length} (${pct(ballotsOf(x.id).length, x.eligible.length)}%)</span>`).join('')}<span>Voter names and emails are never shown: each ballot is identified only by its anonymous token hash.</span></div>`;
  const body = rows.length
    ? D.table(['Time', 'Election', 'Anonymous token (SHA-256)', 'Ballot commitment', 'Receipt hash', 'Status', 'Bulletin'], rows.map((r) => { const entry = boardOf(r.eid).find((b) => b.c === r.c); const [tone, label] = ledgerState(r); return [hms(r.at), esc(election(r.eid).title), `<span class="mono">${r.th.slice(0, 10)}…${r.th.slice(-6)}</span>`, `<span class="mono">${r.c.slice(0, 12)}…</span>`, `<span class="mono">${receiptHash(r.code).slice(0, 12)}…</span>`, D.pill(tone, label), entry ? `#${entry.seq}` : r.state === 'VALIDATED' ? 'Next batch' : '—']; }))
    : '<p class="small muted" style="padding:4px 16px 6px">No ballots cast through the voter portal yet. When a voter casts one, it appears here by its anonymous token hash.</p>';
  return D.row('minmax(0,1fr)', D.card(title, sum + body, { link: '/app/audit', linkLabel: 'Audit log', cls: 'flush', badge: ` ${D.pill('green', 'Live')}` }));
}
function liveActivity(forCandidate = false) {
  return ledgerRows().slice(0, 3).map((r) => {
    const e = election(r.eid); const tok = `${r.th.slice(0, 8)}…`;
    if (forCandidate) return ['ballot', 'blue', `A ballot was cast in ${e.title}`, ago(r.at), `Turnout now ${ballotsOf(r.eid).length} of ${e.eligible.length}`];
    const [, label] = ledgerState(r);
    if (r.state === 'VALIDATED') return ['checkCircle', 'green', `Anonymous ballot validated · token ${tok}`, ago(r.validatedAt || r.at), e.title];
    if (r.state === 'VOIDED') return ['warning', 'red', `Ballot ${label.toLowerCase()} · token ${tok}`, ago(r.voidedAt || r.at), e.title];
    return ['qr', 'orange', `Ballot awaiting QR receipt · token ${tok}`, ago(r.at), e.title];
  });
}

// ---------- Start ----------
S = load(); if (!S) seed();
S.seededAt ||= Date.now(); S.progress ||= {};
S.spent ||= {}; S.devCred ||= {}; S.integrityRuns ||= [];
S.users.filter((u) => u.uniqueNo).forEach(enrollSignup); save();
try { UI.collapsed = localStorage.getItem('digivote.simulation.collapsed') === '1'; const sp = localStorage.getItem('digivote.simulation.panel'); UI.simOpen = false; } catch { UI.simOpen = false; }
render();
</script>
</body>
