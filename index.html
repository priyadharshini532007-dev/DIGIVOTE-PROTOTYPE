        throw new IllegalStateException(\"DIGIVOTE_JWT_SECRET is required when dev mode is off\");\n    }\n    return KeyVault.devSecret(properties, \"dev-jwt.key\", 32);\n}", "notes": [{"line": 6, "text": "A secret shorter than 32 bytes stops the server from starting."}, {"line": 11, "text": "In production (dev mode off) a missing secret is a hard error; in development a random one is generated into .local/."}]}, {"file": "frontend/src/api/client.js", "start": 34, "lang": "js", "title": "The browser side: attaching the token", "code": "api.interceptors.request.use((config) => {\n  const session = loadSession();\n  if (session?.token) config.headers.Authorization = `Bearer ${session.token}`;\n  return config;\n});", "notes": [{"line": 2, "text": "An Axios interceptor adds the token to every authenticated request automatically, so pages never handle it."}]}]}, {"id": "lifecycle", "title": "The election lifecycle", "tagline": "Draft → Registration → Campaign → Voting → Verification → Published → Archived.", "tags": [{"kind": "pattern", "label": "State"}, {"kind": "pattern", "label": "Observer"}, {"kind": "db", "label": "Transactions"}], "why": "What may happen depends on the stage: candidates apply only in Registration, ballots are accepted only in Voting. Each stage is an object that knows its own rules (State pattern), and one service is the only code allowed to move an election forward.", "flow": [{"t": "Draft", "d": "edit everything"}, {"t": "Registration", "d": "candidates apply"}, {"t": "Campaign", "d": "manifestos published"}, {"t": "Voting", "d": "keys generated, manifestos frozen"}, {"t": "Verification", "d": "final batch published, tally"}, {"t": "Published", "d": "results immutable"}, {"t": "Archived", "d": "read-only"}], "takeaway": "Stages are objects, moves are validated in one place, and side effects happen in the same transaction as the move.", "try": {"uid": "u2", "to": "/app/lifecycle?election=e1", "label": "Run the lifecycle as the administrator"}, "snippets": [{"file": "backend/src/main/java/com/digivote/election/state/ElectionState.java", "start": 11, "lang": "java", "title": "What every state must answer", "code": "public interface ElectionState {\n\n    ElectionStatus status();\n\n    Set<ElectionStatus> allowedTargets();\n\n    default boolean canTransitionTo(ElectionStatus target) {\n        return allowedTargets().contains(target);\n    }\n\n    default boolean allowsDetailEdits() {\n        return false;\n    }\n\n    default boolean allowsRuleChanges() {\n        return false;\n    }\n\n    default boolean acceptsCandidateApplications() {\n        return false;\n    }\n\n    default boolean allowsCandidateReview() {\n        return false;\n    }\n\n    default boolean allowsManifestoEdits() {\n        return false;\n    }\n\n    default boolean allowsVoterListChanges() {\n        return false;\n    }\n\n    default boolean acceptsBallots() {\n        return false;\n    }", "notes": [{"line": 4, "text": "Each state lists where it may go next."}, {"line": 14, "text": "Every capability defaults to <b>false<\/b>; a state switches on only what it allows. Safe by default."}, {"line": 34, "text": "The ballot service asks the state this question instead of comparing status strings."}]}, {"file": "backend/src/main/java/com/digivote/election/state/LifecycleStates.java", "start": 42, "lang": "java", "title": "The Voting state", "code": "static final class VotingState implements ElectionState {\n    public ElectionStatus status() { return ElectionStatus.VOTING; }\n    public Set<ElectionStatus> allowedTargets() { return Set.of(ElectionStatus.VERIFICATION); }\n    public boolean acceptsBallots() { return true; }\n}", "notes": [{"line": 2, "text": "From Voting the only move is to Verification — you cannot skip to Published."}, {"line": 3, "text": "The one thing Voting switches on. Rule changes, voter-list changes and manifesto edits stay off."}]}, {"file": "backend/src/main/java/com/digivote/election/state/ElectionStateMachine.java", "start": 39, "lang": "java", "title": "Rejecting an invalid move", "code": "public void requireTransition(ElectionStatus from, ElectionStatus to) {\n    if (!stateOf(from).canTransitionTo(to)) {\n        throw ApiException.conflict(\"INVALID_TRANSITION\", \"Cannot move an election from \" + from + \" to \" + to);\n    }\n}", "notes": [{"line": 2, "text": "Skipping a stage returns HTTP 409 Conflict. The simulation’s “Attempt to jump to Published” button shows this."}]}, {"file": "backend/src/main/java/com/digivote/election/state/ElectionLifecycleService.java", "start": 88, "lang": "java", "title": "The only door that changes status", "code": "public Election transition(Long electionId, ElectionStatus target, String note) {\n    Permission permission = switch (target) {\n        case PUBLISHED -> Permission.PUBLISH_RESULTS;\n        case ARCHIVED -> Permission.ARCHIVE_ELECTION;\n        default -> Permission.MANAGE_ELECTION;\n    };\n    AccessControlService.ElectionAccess a = access.requireElection(electionId, permission);\n    if (target == ElectionStatus.VERIFICATION) {\n        keysRepository.lockForBallot(electionId); // absent only if voting never opened; the state machine refuses that\n    }\n    Election election = elections.findByIdForUpdate(electionId).orElseThrow();\n    entityManager.refresh(election); // the access check may have loaded it before the locks were held\n    ElectionStatus from = election.getStatus();\n    stateMachine.requireTransition(from, target);\n    Instant now = clock.instant();\n    Long actor = a.user().userId();\n\n    if (from == ElectionStatus.DRAFT || from == ElectionStatus.REGISTRATION || from == ElectionStatus.CAMPAIGN) {\n        ReadinessService.Readiness r = readiness.evaluate(election);\n        if (!r.ready()) {\n            String failed = r.checks().stream().filter(c -> !c.passed()).map(ReadinessService.Check::label)\n                    .findFirst().orElse(\"readiness requirements\");\n            throw ApiException.rule(\"NOT_READY\", \"Election is not ready: \" + failed);\n        }\n    }\n    if (target == ElectionStatus.VOTING) {\n        keys.generate(electionId);\n        audit.record(AuditEventType.ELECTION_KEYS_GENERATED, election.getOrganizationId(), electionId, actor,\n                Map.of(\"keyFingerprint\", keys.require(electionId).getRsaFingerprint(),\n                        \"publicKeyFingerprintV1\", com.digivote.crypto.CredentialKeyFingerprint.of(electionId,\n                                keys.require(electionId).getRsaModulus(), keys.require(electionId).getRsaPublicExponent())));\n    }\n    if (target == ElectionStatus.VERIFICATION) {\n        // Voting closes under the per-election ballot lock taken above: publish every ballot still waiting as one\n        // final shuffled batch. Ballot requests that were waiting for the lock re-check the status afterwards\n        // and are refused.\n        int published = bulletin.publishPending(electionId, 1,\n                LocalDateTime.ofInstant(now, ZoneOffset.UTC).truncatedTo(ChronoUnit.MINUTES));\n        audit.record(AuditEventType.BALLOTS_PUBLISHED, election.getOrganizationId(), electionId, null,\n                Map.of(\"published\", published, \"trigger\", \"voting-closed\",\n                        \"totalOnBoard\", bulletinEntries.countByElectionId(electionId)));\n    }\n    if (target == ElectionStatus.PUBLISHED) {\n        results.publish(electionId, actor);\n    }\n\n    ElectionTransitions.apply(election, target, now);", "notes": [{"line": 1, "text": "Publishing and archiving need their own permissions; everything else needs MANAGE_ELECTION."}, {"line": 10, "text": "Locks the election row (SELECT … FOR UPDATE) so two administrators cannot move it at the same time."}, {"line": 13, "text": "The State pattern check from above."}, {"line": 18, "text": "Before voting can open, readiness checks must pass: rules valid, voting window set, enough approved candidates, voters on the list."}, {"line": 26, "text": "Opening voting creates this election’s RSA (credentials) and Paillier (tally) key pairs."}, {"line": 36, "text": "Closing voting publishes every ballot still waiting as one final shuffled batch."}, {"line": 46, "text": "Only now does the status actually change — all inside one transaction."}]}, {"file": "backend/src/main/java/com/digivote/election/state/ElectionLifecycleService.java", "start": 154, "lang": "java", "title": "Telling the rest of the system", "code": "events.publishEvent(new ElectionLifecycleEvent(electionId, election.getOrganizationId(), election.getTitle(),\n        from, target, actor));", "notes": [{"line": 0, "text": "<b>Observer pattern<\/b>: the lifecycle service does not know who cares. Listeners (manifesto freeze, notifications) subscribe to this event — see the next chapter."}]}]}, {"id": "freeze", "title": "Freezing manifestos", "tagline": "Once voting opens, every voter sees the same manifesto.", "tags": [{"kind": "pattern", "label": "Observer"}, {"kind": "db", "label": "Trigger"}, {"kind": "sec", "label": "Defence in depth"}], "why": "A candidate must not change promises halfway through voting. The rule is enforced three times: a listener freezes manifestos when voting opens, the entity refuses edits, and a database trigger refuses updates even if application code had a bug.", "takeaway": "Important rules live in more than one layer: the service, the object and the database.", "try": {"uid": "u3", "to": "/app/candidate/manifesto", "label": "See a frozen manifesto (after voting opens)"}, "snippets": [{"file": "backend/src/main/java/com/digivote/candidate/ManifestoFreezeListener.java", "start": 35, "lang": "java", "title": "Layer 1 — the listener", "code": "@EventListener\npublic void onTransition(ElectionLifecycleEvent event) {\n    if (event.to() != ElectionStatus.VOTING) {\n        return;\n    }\n    Instant now = clock.instant();\n    List<Long> ids = candidates.findByElectionIdOrderByBallotPositionAsc(event.electionId()).stream()\n            .map(Candidate::getId).toList();\n    List<Manifesto> all = manifestos.findByCandidateIdIn(ids);\n    all.forEach(m -> m.freeze(now));\n    manifestos.saveAll(all);\n    audit.record(AuditEventType.MANIFESTOS_FROZEN, event.organizationId(), event.electionId(), event.actorUserId(),\n            Map.of(\"manifestos\", all.size()));\n}", "notes": [{"line": 0, "text": "Spring calls this method for every ElectionLifecycleEvent published in chapter 5."}, {"line": 2, "text": "It only acts when an election enters Voting."}, {"line": 9, "text": "Freezes every manifesto of the election. It runs inside the transition’s transaction, so voting cannot open without the freeze."}]}, {"file": "backend/src/main/java/com/digivote/candidate/Manifesto.java", "start": 93, "lang": "java", "title": "Layer 2 — the entity guards itself", "code": "private void requireEditable() {\n    if (frozen) {\n        throw ApiException.rule(\"MANIFESTO_FROZEN\", \"The manifesto is frozen because voting has opened\");\n    }\n}", "notes": [{"line": 1, "text": "Every setter calls requireEditable() first (<b>encapsulation<\/b>): a frozen manifesto object refuses to change."}]}, {"file": "backend/src/main/resources/db/migration/V2__views_procedures_triggers.sql", "start": 156, "lang": "sql", "title": "Layer 3 — the database trigger", "code": "CREATE TRIGGER trg_manifesto_frozen BEFORE UPDATE ON manifestos\nFOR EACH ROW\nBEGIN\n    IF OLD.frozen = TRUE THEN\n        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'DIGI-VOTE: manifesto is frozen';\n    END IF;\nEND$$", "notes": [{"line": 3, "text": "Before any UPDATE on a frozen row…"}, {"line": 4, "text": "…MySQL aborts the statement with an error. Even a manual SQL update is refused."}]}]}, {"id": "credentials", "title": "Anonymous credentials", "tagline": "The server signs a token it never sees.", "tags": [{"kind": "sec", "label": "Anonymity"}, {"kind": "sec", "label": "RSA blind signature"}, {"kind": "db", "label": "Row lock"}], "why": "The server must check that you are eligible, but must not be able to link your ballot to you. Solution (Chaum blind signatures): your browser hides a random token inside a “blinded” number, the server signs that number after checking eligibility, and your browser removes the blinding. You end up with a valid signature on a token the server has never seen.", "flow": [{"t": "Browser", "d": "random token t, m = FDH(t)"}, {"t": "Browser", "d": "blind: m′ = m · rᵉ mod n"}, {"t": "Server", "d": "check eligibility, sign: s′ = m′ᵈ"}, {"t": "Browser", "d": "unblind: s = s′ · r⁻¹"}, {"t": "Ballot", "d": "send (t, s) without login"}], "takeaway": "Eligibility is checked with your identity; the vote is authorized by a token nobody can trace back to you.", "try": {"uid": "u6", "to": "/app/cast", "label": "Watch the credential steps on the ballot"}, "snippets": [{"file": "frontend/src/crypto/blindRsa.js", "start": 103, "lang": "js", "title": "In the browser: blinding", "code": "export async function prepareCredential(key) {\n  const n = hexToBigInt(key.modulusHex);\n  const e = hexToBigInt(key.publicExponentHex);\n  const token = globalThis.crypto.getRandomValues(new Uint8Array(32));\n  const m = await fullDomainHash(token, n);\n  const r = randomBigIntBelow(n);\n  const blinded = (m * modPow(r, e, n)) % n;\n  return { tokenHex: bytesToHex(token), blindingFactorHex: bigIntToHex(r), blindedMessageHex: bigIntToHex(blinded) };\n}", "notes": [{"line": 3, "text": "A 32-byte random token, generated on your device. It never leaves until you vote."}, {"line": 4, "text": "Hash the token to a number m below the RSA modulus."}, {"line": 5, "text": "A secret blinding factor, also kept on your device."}, {"line": 6, "text": "m′ = m·rᵉ mod n. Without r this number looks random to the server."}]}, {"file": "backend/src/main/java/com/digivote/voting/CredentialIssuanceService.java", "start": 76, "lang": "java", "title": "On the server: sign once per voter", "code": "public VotingDtos.CredentialResponse issue(Long electionId, String blindedHex) {\n    AccessControlService.ElectionAccess a = access.viewElection(electionId);\n    Election election = a.election();\n    EligibilityService.Decision decision = eligibility.evaluate(election, a.user());\n    if (!decision.mayVote()) {\n        throw ApiException.forbidden(decision.reasons().isEmpty() ? \"Not eligible to vote\"\n                : decision.reasons().get(0));\n    }\n    if (!decision.votingOpen()) {\n        throw ApiException.conflict(\"VOTING_NOT_OPEN\", \"Voting is not open\");\n    }\n    // Row lock: concurrent issuance requests for the same voter are serialized.\n    EligibleVoter voter = voters.lockByElectionIdAndUserId(electionId, a.user().userId()).orElseThrow();\n    String requestHash = Hashing.sha256Hex(blindedHex.toLowerCase());\n    ElectionKeys k = keys.require(electionId);\n    var existing = credentials.findByEligibleVoterId(voter.getId());\n    if (existing.isPresent()) {\n        if (Hashing.constantTimeEquals(existing.get().getBlindedRequestHash(), requestHash)) {\n            // Safe retry of the identical request: same blinded value, same signature, no new entitlement.\n            return new VotingDtos.CredentialResponse(electionId, existing.get().getBlindSignature(),\n                    k.getRsaFingerprint(), true);\n        }\n        throw ApiException.conflict(\"CREDENTIAL_ALREADY_ISSUED\",\n                \"A voting credential was already issued to you for this election\");\n    }\n    BigInteger blinded = new BigInteger(blindedHex, 16);\n    BigInteger signature;\n    try {\n        signature = BlindRsa.signBlinded(keys.rsaPrivate(k), blinded);\n    } catch (IllegalArgumentException e) {\n        throw ApiException.badRequest(\"INVALID_BLINDED_MESSAGE\", \"Blinded message is out of range\");\n    }\n    String sigHex = signature.toString(16);\n    credentials.save(new VotingCredential(voter.getId(), electionId, requestHash, sigHex, k.getRsaFingerprint(),\n            clock.instant()));\n    audit.record(AuditEventType.CREDENTIAL_ISSUED, election.getOrganizationId(), electionId, a.user().userId(),\n            Map.of(\"keyFingerprint\", k.getRsaFingerprint()));\n    return new VotingDtos.CredentialResponse(electionId, sigHex, k.getRsaFingerprint(), false);\n}", "notes": [{"line": 3, "text": "This is the only step where your identity is used: are you on the eligible list and allowed by the rules?"}, {"line": 12, "text": "A row lock serializes two simultaneous requests from the same voter."}, {"line": 15, "text": "One credential per eligible voter. An identical retry gets the same signature back; a different request is refused."}, {"line": 28, "text": "s′ = m′ᵈ mod n — signing the blinded value."}, {"line": 33, "text": "Stored on the identity side: who received a credential, never which token."}]}, {"file": "frontend/src/crypto/blindRsa.js", "start": 114, "lang": "js", "title": "Back in the browser: unblinding", "code": "export function unblind(blindSignatureHex, blindingFactorHex, key) {\n  const n = hexToBigInt(key.modulusHex);\n  const s = (hexToBigInt(blindSignatureHex) * modInverse(hexToBigInt(blindingFactorHex), n)) % n;\n  return bigIntToHex(s);\n}", "notes": [{"line": 2, "text": "s = s′·r⁻¹ mod n. The result is a normal RSA signature on m — and only your browser knows which token it belongs to."}]}]}, {"id": "ballot", "title": "Casting a ballot", "tagline": "One transaction: all of it happens, or none of it does.", "tags": [{"kind": "sec", "label": "One person, one vote"}, {"kind": "db", "label": "Transaction"}, {"kind": "db", "label": "UNIQUE constraint"}, {"kind": "sec", "label": "Paillier encryption"}], "why": "The ballot request arrives without any login. It is authorized only by the blind-signed token. Inside one database transaction the server checks the signature, refuses reused tokens, validates the selection against the election rules, encrypts every option and stores the ballot and its receipt.", "takeaway": "No identity in, one token per ballot, rules from the database, encryption before storage.", "try": {"uid": "u6", "to": "/app/vote/e2", "label": "Cast a ballot, then try to vote again"}, "snippets": [{"file": "frontend/src/api/client.js", "start": 53, "lang": "js", "title": "The ballot leaves without identity", "code": "/**\n * Anonymous client for ballots, receipts and public pages. It never sends the session token:\n * ballots must not carry identity.\n */\nexport const publicApi = axios.create({ baseURL, timeout: 30000 });", "notes": [{"line": 2, "text": "A second Axios client with no token interceptor. If the ballot carried your session token, the server could link it to you."}]}, {"file": "backend/src/main/java/com/digivote/voting/BallotTransaction.java", "start": 117, "lang": "java", "title": "Inside BallotTransaction.cast()", "code": "// Per-election serialization point: duplicate checks and bulletin batches happen under this lock.\nElectionKeys k = keysRepository.lockForBallot(electionId)\n        .orElseThrow(() -> ApiException.conflict(\"KEYS_MISSING\", \"Voting has not been opened\"));\n// Re-read the status under the lock: voting may have closed (and the final batch been published)\n// while this request waited, in which case the ballot must not be accepted.\nif (elections.currentStatus(electionId).orElseThrow() != com.digivote.election.ElectionStatus.VOTING) {\n    throw new BallotRejectedException(HttpStatus.CONFLICT, \"CREDENTIAL_EXPIRED\",\n            \"Voting has closed; this credential has expired\", SecurityEvent.Type.BALLOT_OUTSIDE_WINDOW);\n}\n\nbyte[] token = HexFormat.of().parseHex(request.tokenHex());\nBigInteger signature = new BigInteger(request.signatureHex(), 16);\nif (!BlindRsa.verify(keys.rsaPublic(k), token, signature)) {\n    throw new BallotRejectedException(HttpStatus.FORBIDDEN, \"INVALID_CREDENTIAL\",\n            \"The voting credential is not valid for this election\", SecurityEvent.Type.INVALID_CREDENTIAL);\n}\n\nString tokenHash = tokenHash(electionId, token);\nString nonceHash = Hashing.sha256Hex(request.submissionNonce().toLowerCase());\nvar spent = tokens.findByElectionIdAndTokenHash(electionId, tokenHash);\nif (spent.isPresent()) {\n    if (Hashing.constantTimeEquals(spent.get().getSubmissionNonceHash(), nonceHash)) {\n        return replay(election, rule, spent.get(), tokenHash);\n    }\n    throw new BallotRejectedException(HttpStatus.CONFLICT, \"DUPLICATE_VOTE\",\n            \"This credential has already been used to cast a ballot\", SecurityEvent.Type.DUPLICATE_BALLOT);\n}\n\nList<ResultService.BallotOption> options = results.ballotOptions(electionId, rule);\nint candidateCount = (int) options.stream().filter(o -> !o.nota()).count();\nruleEngine.validateSelection(rule, request.selections(), candidateCount);\n\nPaillier.PublicKey pub = keys.paillierPublic(k);\nSet<Integer> chosen = new HashSet<>(request.selections());\nList<String> ciphertexts = new ArrayList<>(options.size());\nfor (ResultService.BallotOption option : options) {\n    BigInteger bit = chosen.contains(option.index()) ? BigInteger.ONE : BigInteger.ZERO;\n    ciphertexts.add(Paillier.encrypt(pub, bit, SecureTokens.random()).toString(16));\n}\nString commitment = BallotCommitments.commit(electionId, ciphertexts);\n\n// Anonymous-side rows get random ids and no timestamps or selection counts (see AnonymousIds, V4 migration).\nBallot ballot = ballots.save(new Ballot(electionId, commitment));\nfor (int i = 0; i < ciphertexts.size(); i++) {\n    votes.save(new Vote(ballot.getId(), i, ciphertexts.get(i)));\n}\ntokens.save(new VotingToken(electionId, tokenHash, nonceHash, ballot.getId()));", "notes": [{"line": 1, "text": "A per-election lock: concurrent ballots are processed one after another, so duplicate checks cannot race."}, {"line": 5, "text": "Re-checks the status under the lock: voting may have closed while this request waited."}, {"line": 12, "text": "Is this a genuine credential for this election? sᵉ mod n must equal FDH(t)."}, {"line": 19, "text": "Has this token already been spent? A second ballot with the same token is rejected as DUPLICATE_VOTE and recorded as a security event."}, {"line": 30, "text": "The rule engine checks the selection (next snippet)."}, {"line": 37, "text": "Each option becomes Enc(1) if chosen, Enc(0) if not. Nobody can read a single ballot."}, {"line": 39, "text": "A SHA-256 fingerprint of the encrypted ballot — this is what appears on the public bulletin board."}, {"line": 46, "text": "The spent token is recorded. UNIQUE(election_id, token_hash) in the database makes a second use impossible even if this code were bypassed."}]}, {"file": "backend/src/main/java/com/digivote/election/rules/RuleEngine.java", "start": 116, "lang": "java", "title": "The rule engine checks the selection", "code": "public void validateSelection(ElectionRule rule, List<Integer> selections, int candidateCount) {\n    if (selections == null || selections.isEmpty()) {\n        throw ApiException.badRequest(\"INVALID_SELECTION\", \"Select at least one option\");\n    }\n    Set<Integer> distinct = new HashSet<>(selections);\n    if (distinct.size() != selections.size()) {\n        throw ApiException.badRequest(\"INVALID_SELECTION\", \"Duplicate selections are not allowed\");\n    }\n    if (selections.size() > rule.getMaxSelections()) {\n        throw ApiException.badRequest(\"INVALID_SELECTION\",\n                \"At most \" + rule.getMaxSelections() + \" selection(s) allowed\");\n    }\n    int optionCount = optionCount(rule, candidateCount);\n    for (Integer index : selections) {\n        if (index == null || index < 0 || index >= optionCount) {\n            throw ApiException.badRequest(\"INVALID_SELECTION\", \"Selection is not an option on this ballot\");\n        }\n    }\n    if (rule.isNotaEnabled() && distinct.contains(candidateCount) && selections.size() > 1) {\n        throw ApiException.badRequest(\"INVALID_SELECTION\", \"None Of The Above must be selected on its own\");\n    }\n}", "notes": [{"line": 8, "text": "Uses the election’s own persisted rules — nothing is hard-coded."}, {"line": 19, "text": "NOTA cannot be combined with a candidate."}]}, {"file": "backend/src/main/resources/db/migration/V1__core_schema.sql", "start": 316, "lang": "sql", "title": "The database makes double voting impossible", "code": "CREATE TABLE voting_tokens (\n    id                     BIGINT      NOT NULL AUTO_INCREMENT,\n    election_id            BIGINT      NOT NULL,\n    token_hash             CHAR(64)    NOT NULL,\n    submission_nonce_hash  CHAR(64)    NOT NULL,\n    ballot_id              BIGINT      NOT NULL,\n    PRIMARY KEY (id),\n    CONSTRAINT uq_token_election_hash UNIQUE (election_id, token_hash),\n    CONSTRAINT uq_token_ballot UNIQUE (ballot_id),\n    CONSTRAINT fk_token_election FOREIGN KEY (election_id) REFERENCES elections (id) ON DELETE RESTRICT,\n    CONSTRAINT fk_token_ballot FOREIGN KEY (ballot_id) REFERENCES ballots (id) ON DELETE RESTRICT\n) ENGINE = InnoDB;", "notes": [{"line": 7, "text": "Even two perfectly simultaneous requests cannot both insert the same spent token."}]}]}, {"id": "tally", "title": "Counting encrypted votes", "tagline": "Add ballots without opening them.", "tags": [{"kind": "sec", "label": "Homomorphic encryption"}, {"kind": "pattern", "label": "Strategy"}, {"kind": "pattern", "label": "Template method"}], "why": "Paillier encryption has a special property: multiplying two ciphertexts gives an encryption of the sum. So the server multiplies all “option 1” ciphertexts together and decrypts once — getting the total for option 1 without ever decrypting a single ballot.", "takeaway": "The tally works on encrypted data; only totals are ever decrypted.", "try": {"uid": "u2", "to": "/app/results-management?election=e1", "label": "Generate results (after voting closes)"}, "snippets": [{"file": "backend/src/main/java/com/digivote/crypto/Paillier.java", "start": 96, "lang": "java", "title": "Homomorphic addition is just multiplication", "code": "public static BigInteger add(PublicKey key, BigInteger c1, BigInteger c2) {\n    return c1.multiply(c2).mod(key.nSquared());\n}", "notes": [{"line": 1, "text": "Enc(a) × Enc(b) mod n² = Enc(a + b). This one line is why individual ballots never need decrypting."}]}, {"file": "backend/src/main/java/com/digivote/result/ResultService.java", "start": 124, "lang": "java", "title": "Generating results (ResultService.generate)", "code": "BulletinBoardService.ChainCheck chain = bulletin.verify(electionId);\nif (!chain.valid() || chain.entries() != accepted.size()) {\n    throw ApiException.conflict(\"BULLETIN_INCONSISTENT\",\n            \"Bulletin board does not verify against the accepted ballots; results not generated\");\n}\nif (tokens.countByElectionId(electionId) != accepted.size()) {\n    throw ApiException.conflict(\"TOKENS_INCONSISTENT\", \"Spent tokens do not match accepted ballots\");\n}\n\nResultDtos.AggregationCheck validation = validateBallots(electionId, accepted, options.size(), pub);\nif (!validation.valid()) {\n    throw ApiException.conflict(\"BALLOT_VALIDATION_FAILED\", validation.problems().get(0));\n}\n\nBigInteger[] aggregates = aggregate(electionId, options.size(), pub);\nPaillier.PrivateKey priv = keyService.paillierPrivate(keys);\nList<CountingStrategy.OptionTally> tallies = new ArrayList<>();\nint totalSelections = 0;\nfor (BallotOption o : options) {\n    long count = Paillier.decrypt(priv, aggregates[o.index()]).longValueExact();\n    totalSelections += (int) count;\n    tallies.add(new CountingStrategy.OptionTally(o.index(), o.candidateId(), o.label(), o.nota(), count));\n}\n// New ballots do not record a selection count (privacy); the strategy's bounds check covers them.\n// Historic ballots that still carry one are cross-checked exactly.\nboolean allCounted = accepted.stream().allMatch(b -> b.getSelectionCount() != null);\nint expectedSelections = allCounted ? accepted.stream().mapToInt(Ballot::getSelectionCount).sum() : totalSelections;\nif (expectedSelections != totalSelections) {\n    throw ApiException.conflict(\"TALLY_INCONSISTENT\",\n            \"Decrypted totals do not match the recorded selection counts\");\n}\n\nCountingStrategy strategy = strategies.forMethod(rule.getCountingMethod());\nCountingStrategy.Outcome outcome = strategy.count(tallies, accepted.size(), totalSelections,\n        rule.getMaxSelections());", "notes": [{"line": 1, "text": "Refuses to count if the bulletin board does not verify or does not match the stored ballots."}, {"line": 5, "text": "Spent tokens must equal ballots: one token per ballot."}, {"line": 14, "text": "Multiplies the ciphertexts option by option (homomorphic sum)."}, {"line": 19, "text": "Decrypts only the totals."}, {"line": 32, "text": "<b>Strategy pattern<\/b>: the counting algorithm (plurality or approval) is picked from the election’s rules."}]}, {"file": "backend/src/main/java/com/digivote/result/AbstractRankingStrategy.java", "start": 28, "lang": "java", "title": "Shared counting skeleton", "code": "public final Outcome count(List<OptionTally> tallies, int acceptedBallots, int totalSelections, int maxSelections) {\n    long sum = tallies.stream().mapToLong(OptionTally::votes).sum();\n    if (sum != totalSelections) {\n        throw ApiException.conflict(\"TALLY_INCONSISTENT\", \"Option totals do not add up to the selection total\");\n    }\n    validateTotals(acceptedBallots, totalSelections, maxSelections);\n\n    List<OptionTally> sorted = new ArrayList<>(tallies);\n    sorted.sort(Comparator.comparingLong(OptionTally::votes).reversed()\n            .thenComparingInt(OptionTally::optionIndex));\n\n    long topCandidateVotes = tallies.stream().filter(t -> !t.nota()).mapToLong(OptionTally::votes).max().orElse(0);\n    long notaVotes = tallies.stream().filter(OptionTally::nota).mapToLong(OptionTally::votes).sum();\n    long leaders = tallies.stream().filter(t -> !t.nota() && t.votes() == topCandidateVotes).count();\n\n    boolean noBallots = acceptedBallots == 0;\n    boolean notaLeads = notaVotes > topCandidateVotes;\n    boolean tie = !noBallots && !notaLeads && leaders > 1;\n    boolean declareWinner = !noBallots && !notaLeads && !tie && topCandidateVotes > 0;", "notes": [{"line": 0, "text": "<b>Template method<\/b>: the overall algorithm is fixed (final)…"}, {"line": 5, "text": "…and subclasses only fill in this step (plurality: exactly one selection per ballot)."}, {"line": 16, "text": "If NOTA beats every candidate, no winner is declared."}, {"line": 17, "text": "Ties are reported, not broken silently."}]}]}, {"id": "receipts", "title": "Receipts and verification", "tagline": "Prove your ballot counted — without revealing your choice.", "tags": [{"kind": "sec", "label": "Verifiability"}, {"kind": "sec", "label": "HMAC"}, {"kind": "sec", "label": "Hash chain"}], "why": "After voting you receive a receipt code (and QR). The code is derived from your spent token with a secret key, so it is unique and unguessable. The server stores only a hash of it. Verification walks from the code to your ballot’s entry on the public bulletin board, and from there to the results.", "takeaway": "A receipt proves inclusion, never content. Every “counted” claim is backed by a hash comparison.", "try": {"uid": null, "to": "/verify", "label": "Verify a receipt or scan its QR"}, "snippets": [{"file": "backend/src/main/java/com/digivote/voting/ReceiptCodes.java", "start": 29, "lang": "java", "title": "Making the receipt code", "code": "public String derive(Long electionId, String tokenHash) {\n    try {\n        Mac mac = Mac.getInstance(\"HmacSHA256\");\n        mac.init(new SecretKeySpec(receiptKey, \"HmacSHA256\"));\n        byte[] digest = mac.doFinal((electionId + \"|\" + tokenHash).getBytes(StandardCharsets.UTF_8));\n        String body = SecureTokens.base32(digest, 20);\n        return format(body + SecureTokens.checkCharacter(body));\n    } catch (GeneralSecurityException e) {\n        throw new IllegalStateException(\"Receipt derivation failed\", e);\n    }\n}", "notes": [{"line": 2, "text": "HMAC with a server secret: nobody without the key can produce a valid code."}, {"line": 4, "text": "Input is the election and the spent-token hash — no identity."}, {"line": 5, "text": "20 characters = 100 bits, so codes do not collide in practice."}, {"line": 6, "text": "A 21st check character catches typing mistakes before any lookup."}]}, {"file": "backend/src/main/java/com/digivote/voting/BallotTransaction.java", "start": 211, "lang": "java", "title": "What the QR code contains", "code": "String verifyUrl = code == null ? null : properties.publicBaseUrl() + \"/verify?code=\" + code;\nString qr = code != null && rule.isQrReceipts() ? QrCodes.pngDataUri(verifyUrl) : null;", "notes": [{"line": 0, "text": "The QR is simply the public verification link with the code. Scanning it opens the verifier."}, {"line": 1, "text": "Rendered by ZXing with error correction M."}]}, {"file": "backend/src/main/java/com/digivote/verification/ReceiptVerificationService.java", "start": 74, "lang": "java", "title": "Verifying, step by step", "code": "public Verification verify(String code) {\n    String compact = ReceiptCodes.normalizeAndCheck(code);\n    if (compact == null) {\n        return simple(Outcome.INVALID_RECEIPT,\n                \"This is not a valid DIGI-VOTE receipt code (wrong length or check character). Check for typos.\");\n    }\n    Optional<VerificationReceipt> receipt = receipts.findByReceiptCodeHash(ReceiptCodes.hash(compact));\n    if (receipt.isEmpty()) {\n        return simple(Outcome.RECEIPT_NOT_FOUND, \"No accepted ballot carries this receipt.\");\n    }\n    VerificationReceipt r = receipt.get();\n    Election election = elections.findById(r.getElectionId()).orElseThrow();\n    Ballot ballot = ballots.findById(r.getBallotId()).orElseThrow();\n    Optional<BulletinBoardEntry> entry = entries.findByBallotId(ballot.getId());\n    List<String> checks = new ArrayList<>();\n    checks.add(\"Receipt recognized for election \\\"\" + election.getTitle() + \"\\\"\");\n    Verification result;\n    if (entry.isEmpty() && election.getStatus() == ElectionStatus.VOTING) {\n        checks.add(\"Ballot accepted; awaiting publication in a shuffled bulletin-board batch\");\n        result = build(Outcome.RECEIPT_RECOGNIZED, \"Your ballot was accepted and stored encrypted. To protect \"\n                + \"your anonymity it is added to the public bulletin board only in a shuffled batch, at the latest \"\n                + \"when voting closes. Check again then.\", election, ballot, null, null, checks);\n    } else if (entry.isEmpty()) {\n        checks.add(\"Ballot is missing from the bulletin board after voting closed\");\n        result = build(Outcome.VERIFICATION_UNAVAILABLE, \"The receipt exists but its ballot is missing from the \"\n                + \"bulletin board. Report this to the election auditor.\", election, ballot, null, null, checks);\n    } else {\n        BulletinBoardService.ChainCheck chain = bulletin.verify(election.getId());\n        if (!chain.valid()) {\n            checks.add(\"Bulletin board hash chain FAILED verification\");\n            result = build(Outcome.VERIFICATION_UNAVAILABLE, \"The bulletin board failed its integrity check, \"\n                    + \"so inclusion cannot be confirmed.\", election, ballot, entry.get(), null, checks);\n        } else {\n            checks.add(\"Ballot found on the bulletin board at position \" + entry.get().getSeq());\n            checks.add(\"Bulletin board hash chain verified (\" + chain.entries() + \" entries)\");\n            Optional<ElectionResult> res = results.find(election.getId());\n            boolean included = res.isPresent() && entry.get().getSeq() <= res.get().getAcceptedBallots()\n                    && res.get().getBulletinHeadHash().equals(chain.headHash());", "notes": [{"line": 1, "text": "Wrong length or check character → INVALID_RECEIPT immediately."}, {"line": 6, "text": "Lookup by hash: the database never stores the code itself."}, {"line": 17, "text": "Accepted but not yet on the board: ballots are published in shuffled batches to protect anonymity."}, {"line": 27, "text": "The whole bulletin board hash chain is re-verified."}, {"line": 37, "text": "“Counted” is reported only if the results were computed over a board that contains this ballot."}]}, {"file": "backend/src/main/java/com/digivote/verification/BulletinBoardService.java", "start": 53, "lang": "java", "title": "Why receipts start as “pending”", "code": "public int publishPending(Long electionId, int minimum, LocalDateTime minute) {\n    List<Ballot> pending = new ArrayList<>(ballots.findUnpublished(electionId));\n    if (pending.isEmpty() || pending.size() < minimum) {\n        return 0;\n    }\n    pending.sort(java.util.Comparator.comparing(Ballot::getBallotCommitment)); // canonical before shuffling\n    Collections.shuffle(pending, SecureTokens.random());\n    for (Ballot ballot : pending) {\n        append(ballot, minute);\n    }\n    return pending.size();\n}", "notes": [{"line": 2, "text": "Ballots wait until a batch is big enough (DIGIVOTE_BULLETIN_BATCH_SIZE, default 10)…"}, {"line": 6, "text": "…then are shuffled, so board order says nothing about who voted when."}]}]}, {"id": "audit", "title": "The tamper-evident audit log", "tagline": "Change one record and the chain breaks.", "tags": [{"kind": "sec", "label": "SHA-256 hash chain"}, {"kind": "db", "label": "Append-only triggers"}, {"kind": "db", "label": "Row lock"}], "why": "Every important action is appended to a chain: each record includes the hash of the previous one. Editing, deleting or reordering any record changes a hash and breaks every link after it. Auditors recompute the chain from the first record.", "takeaway": "You cannot stop a database administrator from editing a row — but you can make sure anyone notices.", "try": {"uid": "u8", "to": "/app/integrity", "label": "Tamper with a record and run the check"}, "snippets": [{"file": "backend/src/main/java/com/digivote/audit/AuditHasher.java", "start": 32, "lang": "java", "title": "The exact text that is hashed", "code": "public static String hash(String chainKey, long seq, String eventId, String eventType, Instant occurredAt,\n                          Long organizationId, Long electionId, String actorRef, String metadataJson,\n                          String prevHash) {\n    String canonical = String.join(\"\\n\",\n            \"DIGI-VOTE-AUDIT-v1\",\n            chainKey,\n            Long.toString(seq),\n            eventId,\n            eventType,\n            DateTimeFormatter.ISO_INSTANT.format(occurredAt),\n            organizationId == null ? \"-\" : organizationId.toString(),\n            electionId == null ? \"-\" : electionId.toString(),\n            actorRef == null ? \"-\" : actorRef,\n            metadataJson,\n            prevHash);\n    return Hashing.sha256Hex(canonical);\n}", "notes": [{"line": 4, "text": "A version label: the format can evolve without old hashes becoming ambiguous."}, {"line": 6, "text": "The sequence number is hashed, so removing a record leaves a detectable gap."}, {"line": 14, "text": "The previous record’s hash — this is what links the chain."}]}, {"file": "backend/src/main/java/com/digivote/audit/AuditService.java", "start": 75, "lang": "java", "title": "Appending a record", "code": "private AuditLog append(AuditEventType type, Long organizationId, Long electionId, String actorRef,\n                        Map<String, ?> metadata, ChronoUnit precision) {\n    String chainKey = chainKey(organizationId);\n    // Lock first: INSERT IGNORE on an existing key takes a shared lock, and two shared holders upgrading\n    // to exclusive would deadlock. Only a brand-new chain needs the insert.\n    AuditChainHead head = heads.lock(chainKey).orElseGet(() -> {\n        heads.ensureExists(chainKey, AuditHasher.GENESIS);\n        return heads.lock(chainKey).orElseThrow();\n    });\n    long seq = head.getLastSeq() + 1;\n    Instant occurredAt = clock.instant().truncatedTo(precision);\n    String eventId = UUID.randomUUID().toString();\n    String json = sanitize(metadata);\n    String hash = AuditHasher.hash(chainKey, seq, eventId, type.name(), occurredAt, organizationId, electionId,\n            actorRef, json, head.getLastHash());\n    AuditLog log = logs.save(new AuditLog(chainKey, seq, eventId, type.name(), occurredAt, organizationId,\n            electionId, actorRef, json, head.getLastHash(), hash));\n    head.advance(seq, hash);\n    return log;\n}", "notes": [{"line": 5, "text": "Locks the chain head row so two writers cannot both create record #N (the chain never forks)."}, {"line": 9, "text": "Next sequence number."}, {"line": 13, "text": "Hash includes the previous head’s hash."}, {"line": 17, "text": "The head now points at the new record."}]}, {"file": "backend/src/main/java/com/digivote/audit/AuditIntegrityService.java", "start": 39, "lang": "java", "title": "Recomputing from genesis", "code": "public ChainVerification verify(String chainKey) {\n    List<AuditLog> records = logs.findByChainKeyOrderBySeqAsc(chainKey);\n    List<String> problems = new ArrayList<>();\n    Long firstInvalid = null;\n    String expectedPrev = AuditHasher.GENESIS;\n    long expectedSeq = 1;\n    for (AuditLog r : records) {\n        String problem = null;\n        if (r.getSeq() != expectedSeq) {\n            problem = \"Sequence gap: expected \" + expectedSeq + \" but found \" + r.getSeq();\n        } else if (!r.getPrevHash().equals(expectedPrev)) {\n            problem = \"Broken link at seq \" + r.getSeq() + \": previous hash does not match\";\n        } else if (!AuditHasher.hash(r).equals(r.getRecordHash())) {\n            problem = \"Record seq \" + r.getSeq() + \" was modified: hash mismatch\";\n        }\n        if (problem != null) {\n            problems.add(problem);\n            if (firstInvalid == null) {\n                firstInvalid = r.getSeq();\n            }\n        }\n        expectedPrev = r.getRecordHash();\n        expectedSeq = r.getSeq() + 1;\n    }", "notes": [{"line": 4, "text": "Starts from 64 zeros."}, {"line": 9, "text": "Detects removed records."}, {"line": 11, "text": "Detects reordering or a replaced record."}, {"line": 13, "text": "Detects any edited field."}]}, {"file": "backend/src/main/resources/db/migration/V2__views_procedures_triggers.sql", "start": 63, "lang": "sql", "title": "The database refuses edits", "code": "CREATE TRIGGER trg_audit_logs_no_update BEFORE UPDATE ON audit_logs\nFOR EACH ROW\nBEGIN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'DIGI-VOTE: audit_logs is append-only';\nEND$$", "notes": [{"line": 3, "text": "A trigger blocks UPDATE (and another blocks DELETE) on audit_logs at the database level."}]}]}, {"id": "database", "title": "Database design", "tagline": "Identity tables and ballot tables share nothing.", "tags": [{"kind": "db", "label": "Normalization"}, {"kind": "db", "label": "Constraints"}, {"kind": "db", "label": "Flyway migrations"}, {"kind": "sec", "label": "Anonymity"}], "why": "The schema is created by Flyway migrations (V1…V4) when the backend starts. The most important design decision: tables about people (eligible_voters, voting_credentials) and tables about ballots (ballots, votes, voting_tokens, verification_receipts) have no column or foreign key in common.", "takeaway": "Never edit an applied migration — add V5. The database itself carries part of the security model.", "snippets": [{"file": "backend/src/main/resources/db/migration/V1__core_schema.sql", "start": 241, "lang": "sql", "title": "Identity side: who may vote", "code": "CREATE TABLE eligible_voters (\n    id           BIGINT      NOT NULL AUTO_INCREMENT,\n    election_id  BIGINT      NOT NULL,\n    user_id      BIGINT      NOT NULL,\n    status       VARCHAR(16) NOT NULL,\n    added_by     BIGINT      NOT NULL,\n    added_at     DATETIME(3) NOT NULL,\n    PRIMARY KEY (id),\n    CONSTRAINT uq_eligible_election_user UNIQUE (election_id, user_id),\n    CONSTRAINT fk_eligible_election FOREIGN KEY (election_id) REFERENCES elections (id) ON DELETE RESTRICT,\n    CONSTRAINT fk_eligible_user FOREIGN KEY (user_id) REFERENCES users (id),\n    CONSTRAINT fk_eligible_added_by FOREIGN KEY (added_by) REFERENCES users (id),\n    CONSTRAINT ck_eligible_status CHECK (status IN ('ELIGIBLE', 'REMOVED'))\n) ENGINE = InnoDB;", "notes": [{"line": 3, "text": "Linked to a real user…"}, {"line": 8, "text": "…at most once per election."}]}, {"file": "backend/src/main/resources/db/migration/V1__core_schema.sql", "start": 290, "lang": "sql", "title": "Anonymous side: what was voted", "code": "CREATE TABLE ballots (\n    id                  BIGINT      NOT NULL AUTO_INCREMENT,\n    election_id         BIGINT      NOT NULL,\n    ballot_commitment   CHAR(64)    NOT NULL,\n    selection_count     INT         NOT NULL,\n    accepted_at_minute  DATETIME    NOT NULL,\n    PRIMARY KEY (id),\n    CONSTRAINT uq_ballot_commitment UNIQUE (ballot_commitment),\n    CONSTRAINT fk_ballot_election FOREIGN KEY (election_id) REFERENCES elections (id) ON DELETE RESTRICT,\n    CONSTRAINT ck_ballot_selections CHECK (selection_count >= 1)\n) ENGINE = InnoDB;", "notes": [{"line": 3, "text": "Only a commitment to the encrypted ballot. There is no user_id, email or credential column here."}, {"line": 5, "text": "V1 stored a minute timestamp; migration V4 made it nullable and new ballots store none, because timing could pair a voter with a ballot."}]}, {"file": "backend/src/main/resources/db/migration/V4__anonymity_hardening.sql", "start": 1, "lang": "sql", "title": "Evolving the schema safely", "code": "-- DIGI-VOTE V4: remove ordering and timing metadata that could pair a voter with a ballot.\n-- * New ballots, votes, spent tokens and receipts get random (non-sequential) ids assigned by the application.\n-- * New ballots and receipts no longer store an acceptance time or a selection count (columns become nullable;\n--   historic rows keep their values: they are immutable and audit history is never rewritten).\n-- * Bulletin-board entries are appended in shuffled batches, so their sequence numbers no longer follow\n--   acceptance order.", "notes": [{"line": 1, "text": "Sequential ids would reveal acceptance order; random ids do not."}, {"line": 4, "text": "Explains the “pending” receipt state from chapter 10."}]}]}, {"id": "frontend", "title": "How the frontend is built", "tagline": "Routes, guards, data hooks and honest status.", "tags": [{"kind": "arch", "label": "React"}, {"kind": "arch", "label": "Routing"}, {"kind": "arch", "label": "Hooks"}], "why": "The React app maps URLs to pages, wraps dashboard pages in a guard, loads data with one shared hook so every page has the same loading/error/success behaviour, and derives statuses with explicit rules instead of invented scores.", "takeaway": "Pages stay small because routing, guarding, loading and status rules each live in one place.", "snippets": [{"file": "frontend/src/App.jsx", "start": 101, "lang": "js", "title": "Routes with their required permission", "code": "{/* Election Administrator */}\n<Route path=\"operations\" element={guard(<OperationsOverview />, { permission: 'MANAGE_ELECTION' })} />\n<Route path=\"elections\" element={guard(<ElectionsList />, { permission: 'VIEW_ELECTION_INTERNALS' })} />\n<Route path=\"elections/new\" element={guard(<CreateElectionWizard />, { permission: 'CREATE_ELECTION' })} />\n<Route path=\"elections/:electionId\" element={guard(<ElectionManage />, { permission: 'VIEW_ELECTION_INTERNALS' })} />", "notes": [{"line": 3, "text": "Each dashboard route names the permission it needs. guard() wraps the page in RequireAuth."}]}, {"file": "frontend/src/components/RequireAuth.jsx", "start": 5, "lang": "js", "title": "The route guard", "code": "export default function RequireAuth({ children, permission, roles }) {\n  const { isAuthenticated, active, can } = useAuth();\n  const location = useLocation();\n  if (!isAuthenticated) return <Navigate to=\"/login\" replace state={{ from: location.pathname }} />;\n  if (permission && !can(permission)) return <Navigate to=\"/app\" replace />;\n  if (roles && !roles.includes(active?.role)) return <Navigate to=\"/app\" replace />;\n  return children;\n}", "notes": [{"line": 3, "text": "Signed out → sent to sign in."}, {"line": 4, "text": "Missing permission → back to your dashboard. The comment above the function says it: convenience only; the API enforces every permission."}]}, {"file": "frontend/src/hooks/useApi.js", "start": 5, "lang": "js", "title": "One hook for loading, error and success", "code": "export function useApi(loader, deps = []) {\n  const [state, setState] = useState({ data: null, loading: true, error: null });\n  const mounted = useRef(true);\n  const loaderRef = useRef(loader);\n  loaderRef.current = loader;\n\n  const load = useCallback(async () => {\n    setState((s) => ({ ...s, loading: true, error: null }));\n    try {\n      const data = await loaderRef.current();\n      if (mounted.current) setState({ data, loading: false, error: null });\n      return data;\n    } catch (e) {\n      if (mounted.current) setState({ data: null, loading: false, error: errorMessage(e) });\n      return null;\n    }\n  }, []);", "notes": [{"line": 1, "text": "Every page starts in a loading state…"}, {"line": 10, "text": "…shows data on success…"}, {"line": 13, "text": "…or a readable error with a retry, never a blank screen."}]}, {"file": "frontend/src/lib/trustStatus.js", "start": 19, "lang": "js", "title": "No fake trust score", "code": "export function trustVerdict(trust) {\n  const checks = trust?.checks ?? [];\n  if (trust?.overall === 'INTEGRITY_PROBLEMS' || checks.some((c) => c.status === 'FAIL')) {\n    return TRUST_STATES.INTEGRITY_FAILURE;\n  }\n  if (!checks.length || checks.some((c) => c.status === 'WARN' || c.status === 'NOT_RUN')) const KEYWORDS = {

  js: 'export import from const let var function async await return if else for while do switch case new throw try catch finally default null true false undefined of in typeof instanceof class extends this',
  sql: 'CREATE TABLE TRIGGER BEFORE AFTER UPDATE DELETE INSERT ON FOR EACH ROW BEGIN END IF THEN SIGNAL SQLSTATE SET MESSAGE_TEXT NOT NULL PRIMARY KEY CONSTRAINT UNIQUE FOREIGN REFERENCES CHECK IN DEFAULT ENGINE BIGINT VARCHAR CHAR INT DATETIME BOOLEAN ALTER MODIFY COLUMN TRUE FALSE OLD NEW RESTRICT AUTO_INCREMENT AND OR',
};

/** Tokenizes code into [{cls, text}] so highlighting never breaks across lines. */
function tokenize(code, lang) {
  const re = lang === 'sql'
    ? /(--[^\n]*)|('(?:[^'\\]|\\.)*')|(\b\d+\b)|([A-Za-z_][\w$]*)/g

  const out = []; let last = 0; let m;
  while ((m = re.exec(code))) {
    if (m.index > last) out.push({ cls: '', text: code.slice(last, m.index) });
    let cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : '';
    if (m[4]) { const w = m[4]; cls = KW_SETS[lang].has(lang === 'sql' ? w.toUpperCase() : w) ? 'k' : /^[A-Z][a-z]\w*$/.test(w) && lang !== 'sql' ? 't' : /^\s*\(/.test(code.slice(re.lastIndex)) ? 'f' : ''; }
    out.push({ cls, text: m[0] }); last = re.lastIndex;
  }

<script>
'use strict';
// =====================================================================================================
// Shared election helpers
// =====================================================================================================
const canManage = (e) => can('MANAGE_ELECTION') && (role() === 'ORG_OWNER' || e.adminId === S.session || !e.adminId);
const visibleElections = () => (['ORG_OWNER', 'ELECTION_ADMIN', 'AUDITOR'].includes(role()) ? S.elections : S.elections.filter((x) => x.status !== 'DRAFT'));
/** Election chosen by ?election=, else the most relevant one. */
function pickElection(filter = () => true) {
  const list = visibleElections().filter(filter); const q = route().q.get('election');
  const order = ['VOTING', 'VERIFICATION', 'CAMPAIGN', 'REGISTRATION', 'DRAFT', 'PUBLISHED', 'ARCHIVED'];
  return list.find((e) => e.id === q) || list.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status))[0] || null;
}
function electionPicker(current, filter = () => true) {
  const list = visibleElections().filter(filter);
  if (!list.length) return '';
  return `<div class="row" style="margin-bottom:16px"><label for="epick" class="small strong">Election</label><select id="epick" class="input" style="width:auto;min-width:260px" data-change="epick">${list.map((e) => `<option value="${e.id}" ${current?.id === e.id ? 'selected' : ''}>${esc(e.title)} · ${LABEL[e.status]}</option>`).join('')}</select>${current ? status(current.status) : ''}</div>`;
}
CHANGE.epick = (el) => { const { path, q } = route(); q.set('election', el.value); UI.loaded = `${path}`; go(`${path}?${q}`); };
const typeLabel = (e) => `${LABEL[e.rules.countingMethod]}${e.rules.maxSelections > 1 ? ` (up to ${e.rules.maxSelections})` : ''}`;
const adminName = (e) => (e.adminId ? user(e.adminId)?.name : '—') || '—';
const noElections = (action = '') => empty('No elections yet', 'Elections you can access appear here.', action);
function electionRow(e) { return { ...e }; }

// ---------- Reports (aggregate figures only — no identities, credentials or ballot contents) ----------
function reportContent(type, eid) {
  const e = eid ? election(eid) : null;
  const base = { generatedAt: Date.now(), organization: S.org.name, type };
  if (type === 'ELECTION' && e) { const res = S.results[eid]; return { ...base, election: e.title, status: LABEL[e.status], countingMethod: e.rules.countingMethod, candidates: approved(eid).map((a) => a.name), eligibleVoters: e.eligible.length, ballots: ballotsOf(eid).length, results: res ? res.items.map((i) => ({ option: i.label, votes: i.votes, rank: i.rank, winner: i.winner })) : 'not computed', resultHash: res?.hash ?? null }; }
  if (type === 'PARTICIPATION') { const list = e ? [e] : S.elections.filter((x) => x.status !== 'DRAFT'); return { ...base, elections: list.map((x) => ({ election: x.title, eligible: x.eligible.length, credentialsIssued: (S.creds[x.id] || []).length, ballots: ballotsOf(x.id).length, turnoutPercent: pct(ballotsOf(x.id).length, x.eligible.length) })) }; }
  if (type === 'SECURITY') { const counts = {}; S.security.forEach((s) => { counts[s.type] = (counts[s.type] || 0) + 1; }); return { ...base, eventsByType: counts, total: S.security.length }; }
  if (type === 'AUDIT') { const v = verifyAuditChain(); return { ...base, auditRecords: S.audit.length, chainVerified: v.ok, failure: v.ok ? null : v.reason, head: v.ok ? v.head : null }; }
  if (type === 'HEALTH' && e) { const c = trustChecks(eid); return { ...base, election: e.title, verdict: trustVerdict(c).label, checks: c.map((x) => ({ check: x.label, status: x.status, detail: x.detail })) }; }

}
const REPORT_TYPES = [['ELECTION', 'Election report'], ['PARTICIPATION', 'Participation report'], ['SECURITY', 'Security report'], ['AUDIT', 'Audit summary'], ['HEALTH', 'Integrity / health report']];

// =====================================================================================================
// DASHBOARD 01 — Organization Owner
// =====================================================================================================

  return `${pageHead('Election archive', 'Completed elections, read-only.')}${list.length ? `<div class="grid g-sm-2 g-lg-3">${list.map((e) => { const r = S.results[e.id]; const w = r?.items.find((i) => i.winner); return `<div class="card"><div class="body stack-sm"><div class="row between">${status(e.status)}<span class="xs muted">${fmtDate(e.rules.votingEnd)}</span></div><h3 class="strong">${esc(e.title)}</h3>${kv([['Winner', w ? esc(w.label) : '—'], ['Ballots', r?.total ?? 0], ['Turnout', `${pct(r?.total ?? 0, e.eligible.length)}%`]])}<div class="row mt-2">${btn('Details', { href: `/app/elections/${e.id}`, size: 'sm', variant: 'secondary' })}${btn('Report', { href: `/app/reports?election=${e.id}`, size: 'sm', variant: 'ghost' })}${e.status === 'PUBLISHED' && can('ARCHIVE_ELECTION') ? btn('Archive', { size: 'sm', variant: 'ghost', act: 'transition', data: { eid: e.id } }) : ''}</div></div></div>`; }).join('')}</div>` : empty('Nothing archived yet', 'Elections appear here once results are published.')}`;
}

// ---------- Reports (shared) ----------
function reportsPage() {
  const pre = route().q.get('election') || '';
  const els = visibleElections().filter((e) => e.status !== 'DRAFT');
  const gen = can('GENERATE_REPORTS') ? `<form data-form="report" class="row top" style="align-items:flex-end;gap:12px" novalidate>${field('Report type', 'rtype', select('rtype', REPORT_TYPES, role() === 'AUDITOR' ? 'AUDIT' : 'ELECTION'))}${field('Election', 'reid', select('reid', [['', 'All elections'], ...els.map((e) => [e.id, e.title])], pre))}<button class="btn primary" type="submit">${ic('document', 'sm')}Generate report</button></form><div class="err small" id="rep-err" style="color:var(--red-700);margin-top:6px"></div>` : alertBox('info', 'View only', 'Your role can view reports but not generate them.');
  const t = dataTable('reports', { rows: S.reports.slice().reverse(), search: (r) => `${r.type} ${election(r.eid)?.title || ''}`, pageSize: 8,
    filters: [{ key: 'type', label: 'Type', options: REPORT_TYPES, test: (r, v) => r.type === v }],
    columns: [{ key: 'type', label: 'Report', render: (r) => `<b class="strong">${REPORT_TYPES.find((x) => x[0] === r.type)[1]}</b>` }, { key: 'e', label: 'Scope', render: (r) => (r.eid ? esc(election(r.eid)?.title) : 'Organization') }, { key: 'at', label: 'Generated', render: (r) => fmtShort(r.at), sortVal: (r) => r.at }, { key: 'by', label: 'By', render: (r) => esc(r.by) }, { key: 'h', label: 'Content hash', render: (r) => hash(r.hash, 12) }, { key: 'a', label: 'Actions', render: (r) => `<div class="row" style="flex-wrap:nowrap">${btn('View', { size: 'sm', variant: 'secondary', act: 'report-view', data: { id: r.id } })}${btn('JSON', { size: 'sm', variant: 'ghost', act: 'report-dl', data: { id: r.id } })}${btn('Print', { size: 'sm', variant: 'ghost', act: 'report-print', data: { id: r.id } })}</div>` }] });
  return `${pageHead(role() === 'AUDITOR' ? 'Audit reports' : 'Reports', 'Snapshots generated from recorded data. Reports contain aggregate figures only — no identities, credentials or individual ballots.')}${card('Generate a report', gen)}<div class="mt-6">${card('Generated reports', t, { flush: true })}</div>`;
}
FORMS.report = async (f, b) => {
  const type = f.rtype.value, eid = f.reid.value || null;
  if (['ELECTION', 'HEALTH'].includes(type) && !eid) { $('#rep-err').textContent = 'Choose an election for this report type.'; return; }
  $('#rep-err').textContent = '';
  try { const r = await withBusy(b, () => api(() => { const content = reportContent(type, eid); const rep = { id: rid('r'), type, eid, at: Date.now(), by: actorLabel(), content, hash: sha256(JSON.stringify(content)) }; S.reports.push(rep); audit('REPORT_GENERATED', `${type} report generated`, { eid, sub: 'REPORTS' }); return rep; }, 900)); toast('success', 'Report generated.'); rerender(); ACT['report-view']({ dataset: { id: r.id } }); } catch (e) { $('#rep-err').textContent = e.message; }
};
function reportHtml(r) {
  const c = r.content; const rows = (obj) => Object.entries(obj).filter(([k]) => !['type'].includes(k)).map(([k, v]) => [k.replace(/([A-Z])/g, ' $1').replace(/^./, (x) => x.toUpperCase()), Array.isArray(v) ? (typeof v[0] === 'object' ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${Object.keys(v[0]).map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${v.map((o) => `<tr>${Object.values(o).map((x) => `<td>${esc(typeof x === 'boolean' ? (x ? 'Yes' : 'No') : x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : esc(v.join(', ')) || '—') : typeof v === 'object' && v ? esc(Object.entries(v).map(([a, b2]) => `${a}: ${b2}`).join(' · ')) : k === 'generatedAt' ? fmt(v) : esc(typeof v === 'boolean' ? (v ? 'Yes' : 'No') : v ?? '—')]);
  return `${kv(rows(c))}<p class="xs muted mt-3">Content hash (SHA-256): <span class="mono">${r.hash}</span></p>`;
}
ACT['report-view'] = (el) => { const r = S.reports.find((x) => x.id === el.dataset.id); modal({ title: `${REPORT_TYPES.find((x) => x[0] === r.type)[1]}${r.eid ? ' · ' + esc(election(r.eid)?.title) : ''}`, wide: true, body: reportHtml(r), foot: `${btn('Download JSON', { variant: 'secondary', act: 'report-dl', data: { id: r.id }, icon: 'download' })}${btn('Print', { act: 'report-print', data: { id: r.id } })}` }); };
ACT['report-dl'] = (el) => { const r = S.reports.find((x) => x.id === el.dataset.id); download(`digivote-${r.type.toLowerCase()}-report.json`, JSON.stringify({ ...r.content, contentHash: r.hash, note: 'DigiVote simulation — fictional data' }, null, 2), 'application/json'); };
ACT['report-print'] = (el) => { const r = S.reports.find((x) => x.id === el.dataset.id); const w = window.open('', '_blank'); if (!w) { toast('warning', 'Allow pop-ups to print the report.'); return; } w.document.write(`<!doctype html><title>DigiVote report</title><style>body{font:14px system-ui;padding:24px;color:#1e293b}dl{display:grid;grid-template-columns:200px 1fr;gap:6px 16px}dt{color:#64748b}table{border-collapse:collapse}td,th{border:1px solid #e2e8f0;padding:4px 8px;text-align:left}</style><h1>${REPORT_TYPES.find((x) => x[0] === r.type)[1]}</h1><p>${esc(S.org.name)} · simulation (fictional data)</p>${reportHtml(r)}`); w.document.close(); w.print(); };

// ---------- Notifications & profile (shared) ----------
function notificationsPage() {
  const mine = S.notes.filter((n) => n.uid === S.session);
  const t = dataTable('notifs', { rows: mine, search: (n) => `${n.title} ${n.msg}`, pageSize: 10, sort: 'at', dir: -1,
    filters: [{ key: 'cat', label: 'Category', options: NOTIF_CATS.slice(1).map((c) => [c, c]), test: (n, v) => n.cat === v }, { key: 'read', label: 'Status', options: [['unread', 'Unread'], ['read', 'Read']], test: (n, v) => (v === 'read') === n.read }],
    empty: 'No notifications yet',
    columns: [{ key: 's', label: '', render: (n) => (n.read ? '' : '<span title="Unread" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand-hover)"></span>') }, { key: 't', label: 'Notification', render: (n) => `<b class="strong">${esc(n.title)}</b><div class="small muted">${esc(n.msg)}</div>` }, { key: 'c', label: 'Category', render: (n) => badge('gray', n.cat) }, { key: 'e', label: 'Election', render: (n) => (n.eid ? esc(election(n.eid)?.title) : '—') }, { key: 'at', label: 'Time', render: (n) => ago(n.at), sortVal: (n) => n.at }, { key: 'a', label: '', render: (n) => `<div class="row" style="flex-wrap:nowrap">${n.to ? btn('Open', { size: 'sm', variant: 'secondary', act: 'notif-open', data: { id: n.id } }) : ''}${btn(n.read ? 'Mark unread' : 'Mark read', { size: 'sm', variant: 'ghost', act: 'notif-toggle', data: { id: n.id } })}</div>` }] });
  return `${pageHead('Notifications', 'Election announcements, decisions, reminders and result updates.', btn('Mark all read', { variant: 'secondary', act: 'notif-all-read' }))}${card('', t, { flush: true })}`;
}
ACT['notif-toggle'] = (el) => { const n = S.notes.find((x) => x.id === el.dataset.id); n.read = !n.read; save(); refreshTable('notifs'); renderTopbar(); };
function profilePage() {
  const u = me(); const prefs = (S.prefs ||= {})[u.id] || { email: true, push: false, results: true, reminders: true };
  return `${pageHead('Account settings', 'Your account details, password and notification preferences.')}
  <div class="grid g-lg-2">${card('Account details', `<form data-form="profile" class="stack" novalidate>${field('Full name', 'pname', input('pname', u.name))}${field('Email', 'pemail', input('pemail', u.email, 'disabled'), { hint: 'Your email identifies you in this organization and cannot be changed here.' })}${kv([['Role', ROLE_LABELS[u.role]], ['Organization', esc(S.org.name)], ['Member since', fmtDate(u.added)]])}<div class="row end"><button class="btn primary" type="submit">Save</button></div></form>`)}
  ${card('Change password', `<div id="pw-msg"></div><form data-form="password" class="stack" novalidate>${field('Current password', 'cur', input('cur', '', 'type="password" autocomplete="current-password"'), { hint: `Simulation: <span class="mono">${DEMO_PASSWORD}</span>` })}${field('New password', 'npw', input('npw', '', 'type="password" autocomplete="new-password"'), { hint: `At least ${S.policy.minLength} characters${S.policy.requireMixed ? ' with upper- and lower-case letters and a digit' : ''}.` })}${field('Confirm new password', 'npw2', input('npw2', '', 'type="password" autocomplete="new-password"'))}<div class="row end"><button class="btn primary" type="submit">Update password</button></div></form>`)}
  ${card('Notification preferences', `<form data-form="prefs" class="stack-sm">${checkbox('email', 'Email notifications', prefs.email, { hint: 'Not delivered in the simulation' })}${checkbox('push', 'Browser push notifications', prefs.push)}${checkbox('results', 'Result publications', prefs.results)}${checkbox('reminders', 'Voting reminders', prefs.reminders)}<div class="row end mt-2"><button class="btn primary" type="submit">Save preferences</button></div></form>`)}
  ${card('Privacy', `<p class="small muted">DigiVote never shows your identity next to a candidate selection. Your receipts are stored only on this device${u.role === 'VOTER' ? ' (see My receipts)' : ''}.</p>`)}</div>`;
}
FORMS.profile = async (f, b) => { const n = f.pname.value.trim(); if (!showErrors(f, n.length < 2 ? { pname: 'Enter your full name' } : {})) return; try { await withBusy(b, () => api(() => { me().name = n; })); toast('success', 'Profile saved.'); rerender(); } catch (e) { toast('error', esc(e.message)); } };
FORMS.password = async (f, b) => {
  const errs = {}; const np = f.npw.value;
  if (!f.cur.value) errs.cur = 'Enter your current password';
  if (np.length < S.policy.minLength) errs.npw = `At least ${S.policy.minLength} characters`; else if (S.policy.requireMixed && !(/[a-z]/.test(np) && /[A-Z]/.test(np) && /\d/.test(np))) errs.npw = 'Include upper- and lower-case letters and a digit';
  if (f.npw2.value !== np) errs.npw2 = 'Passwords do not match';
  if (!showErrors(f, errs)) return;
  try { await withBusy(b, () => api(() => { if (f.cur.value !== DEMO_PASSWORD) throw new Error('Current password is incorrect.'); audit('PASSWORD_CHANGED', `${me().name} changed their password`, { sub: 'SECURITY' }); })); f.reset(); $('#pw-msg').innerHTML = alertBox('success', 'Password updated', 'In the simulation the demo password keeps working.'); } catch (e) { $('#pw-msg').innerHTML = alertBox('error', 'Password not changed', esc(e.message)); }
};
FORMS.prefs = async (f, b) => { try { await withBusy(b, () => api(() => { S.prefs[me().id] = { email: f.email.checked, push: f.push.checked, results: f.results.checked, reminders: f.reminders.checked }; }, 400)); toast('success', 'Preferences saved.'); } catch (e) { toast('error', esc(e.message)); } };

APP_ROUTES.push(
  ['/app/overview', ownerOverview, { roles: ['ORG_OWNER'] }],
  ['/app/organization', orgProfile, { perm: 'MANAGE_ORGANIZATION' }],
  ['/app/members', membersPage, { perm: 'MANAGE_MEMBERS' }],
  ['/app/roles', rolesPage, { perm: 'MANAGE_MEMBERS' }],
  ['/app/security', securityCenter, { perm: 'VIEW_SECURITY_EVENTS' }],
  ['/app/archive', archivePage, { perm: 'VIEW_ELECTION_INTERNALS' }],
  ['/app/reports', reportsPage, { perm: 'VIEW_REPORTS' }],
  ['/app/notifications', notificationsPage],
  ['/app/profile', profilePage],
);
</script>
<script>
'use strict';
// =====================================================================================================
// DASHBOARD 02 — Election Administrator
// =====================================================================================================
const EDITABLE_STATES = ['DRAFT', 'REGISTRATION', 'CAMPAIGN'];

function opsOverview() {
  const mine = S.elections.filter((e) => canManage(e));
  const active = mine.filter(isActive);
  const pending = S.apps.filter((a) => a.status === 'SUBMITTED' && mine.some((e) => e.id === a.eid));
  const eligible = active.reduce((s, e) => s + e.eligible.length, 0);
  const voting = mine.filter((e) => e.status === 'VOTING');
  const vb = voting.reduce((s, e) => s + ballotsOf(e.id).length, 0), ve = voting.reduce((s, e) => s + e.eligible.length, 0);
  const focus = pickElection((e) => canManage(e) && !isCompleted(e));
  const alerts = mine.flatMap((e) => trustChecks(e.id).filter((c) => c.status === 'FAIL').map((c) => ({ e, c })));
  const queue = dataTable('ops-queue', { rows: pending, pageSize: 5, empty: 'No applications waiting', emptyHint: 'New applications appear here for review.',
    columns: [{ key: 'n', label: 'Candidate', render: (a) => `<b class="strong">${esc(a.name)}</b>` }, { key: 'e', label: 'Election', render: (a) => esc(election(a.eid).title) }, { key: 'd', label: 'Applied', render: (a) => ago(a.submitted), sortVal: (a) => a.submitted }, { key: 'p', label: 'Profile completeness', render: (a) => `<div style="min-width:90px">${progress(profileCompleteness(a))}<span class="xs muted">${profileCompleteness(a)}%</span></div>` }, { key: 's', label: 'Status', render: (a) => status(a.status) }, { key: 'r', label: '', render: (a) => btn('Review', { size: 'sm', variant: 'secondary', act: 'app-view', data: { id: a.id } }) }] });
  const imp = focus ? S.imports.filter((i) => i.eid === focus.id).slice(-1)[0] : null;
  const voterPanel = focus ? `${kv([['Eligible voters', `<b class="strong">${focus.eligible.length}</b>`], ['Last import', imp ? `${fmtShort(imp.at)} by ${esc(imp.by)}` : 'No import in this session'], ['Imported records', imp?.total ?? '—'], ['Valid records', imp?.valid ?? '—'], ['Invalid records', imp?.invalid ?? '—'], ['Duplicate records', imp?.dup ?? '—'], ['Eligibility validation', focus.eligible.length ? badge('green', 'List ready') : badge('amber', 'No voters yet')]])}<div class="mt-3">${btn('Manage voters', { href: `/app/voters?election=${focus.id}`, size: 'sm', variant: 'secondary' })}</div>` : empty('No upcoming election');
  const now = Date.now();
  const dl = mine.flatMap((e) => [[e.rules.campaignStart, 'Registration closes / campaign opens', e], [e.rules.campaignEnd, 'Campaign closes', e], [e.rules.votingStart, 'Voting opens', e], [e.rules.votingEnd, 'Voting closes', e]]).filter(([t, , e]) => t && t > now && !isCompleted(e)).sort((a, b) => a[0] - b[0]).slice(0, 6);
  const verif = mine.filter((e) => e.status === 'VERIFICATION').map((e) => [null, `Result publication pending`, e]);
  const deadlines = [...verif, ...dl].map(([t, l, e]) => `<li><span class="tdot">${ic('calendar', 'sm')}</span><span class="small" style="flex:1"><b class="strong">${l}</b><span class="muted" style="display:block">${esc(e.title)}</span></span><span class="xs muted">${t ? `${fmtShort(t)} · ${ago(t)}` : 'Now'}</span></li>`).join('');
  const ready = focus ? readiness(focus) : [];
  return `${heroBanner('ballot', `<h1 tabindex="-1">Manage.<br>Monitor.<br><span class="grad">Ensure Fair Elections.</span></h1><p class="hb-sub">A secure, transparent and inclusive election process with DigiVote.</p>`)}${heroActions(`${btn('Create election', { href: '/app/elections/new', icon: 'add' })}`)}
  <div class="grid g-sm-2 g-lg-3" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${[
    statCard({ label: 'Active elections', value: active.length, hint: 'Registration to verification', icon: 'ballot', to: '/app/elections', tone: 'green' }),
    statCard({ label: 'Pending approvals', value: pending.length, hint: 'Applications awaiting review', icon: 'users', to: '/app/approvals', tone: pending.length ? 'amber' : '' }),
    statCard({ label: 'Eligible voters', value: eligible, hint: 'Across active elections', icon: 'person', to: '/app/voters' }),
    statCard({ label: 'Voting progress', value: voting.length ? `${pct(vb, ve)}%` : '—', hint: voting.length ? `${vb} of ${ve} eligible have voted` : 'No election is in voting', icon: 'activity' }),
    statCard({ label: 'Readiness score', value: focus ? `${readinessScore(focus)}%` : '—', hint: focus ? `${ready.filter((c) => c.ok).length}/${ready.length} checks · ${esc(focus.title)}` : '', icon: 'checkCircle', to: focus ? `/app/lifecycle?election=${focus.id}` : '' }),
    statCard({ label: 'Integrity alerts', value: alerts.length, hint: alerts.length ? 'Failed trust checks' : 'No failed checks', icon: 'shield', tone: alerts.length ? 'red' : 'green', to: '/app/trust' }),
  ].join('')}</div>
  ${focus ? `<div class="mt-6">${card(`Election timeline · ${esc(focus.title)}`, `${electionPicker(focus, (e) => canManage(e) && !isCompleted(e))}${lifecycleStepper(focus)}<div class="mt-4 row between"><span class="small muted">Readiness = share of the five checks passed: ${ready.map((c) => `${c.ok ? '✓' : '✕'} ${esc(c.label)}`).join(' · ')}</span>${btn('Open election operations', { href: `/app/lifecycle?election=${focus.id}`, size: 'sm', variant: 'secondary' })}</div>`)}</div>` : ''}
  <div class="grid g-lg-3 mt-6"><div class="span-2">${card(`Candidate approval queue <span class="badge b-amber" style="margin-left:6px">${pending.length} waiting</span>`, queue, { flush: true, actions: btn('All approvals', { href: '/app/approvals', size: 'sm', variant: 'ghost' }) })}</div>${card('Voter readiness', voterPanel)}</div>
  <div class="grid g-lg-2 mt-6">${card('Upcoming deadlines', deadlines ? `<ul class="timeline">${deadlines}</ul>` : '<p class="muted">No upcoming deadlines.</p>')}${card('Quick actions', `<div class="grid g-sm-2">${[['Create election', '/app/elections/new', 'add'], ['Review candidates', '/app/approvals', 'users'], ['Import voters', '/app/voters', 'upload'], ['Configure rules', '/app/rules', 'key'], ['Election operations', '/app/lifecycle', 'flag'], ['Generate report', '/app/reports', 'document']].map(([l, to, i]) => btn(l, { href: to, variant: 'secondary', icon: i, cls: 'w-full' })).join('')}</div>`)}</div>`;
}
function profileCompleteness(a) { const p = a.profile || {}; const parts = [a.qualifications, a.statement, p.education, p.experience, p.achievements, a.manifesto?.vision, a.manifesto?.mission, a.manifesto?.goals]; return Math.round((parts.filter((x) => x && String(x).trim()).length * 100) / parts.length); }

function electionsList() {
  const isOwner = role() === 'ORG_OWNER', ro = role() === 'AUDITOR';
  const t = dataTable('all-elections', {
    rows: visibleElections(), search: (e) => `${e.title} ${e.description}`, searchPlaceholder: 'Search elections', pageSize: 8, sort: 'upd', dir: -1, empty: 'No elections yet',
    filters: [{ key: 'st', label: 'Status', options: LIFECYCLE.map((s) => [s, LABEL[s]]), test: (e, v) => e.status === v }, { key: 'ty', label: 'Type', options: [['PLURALITY', 'Plurality'], ['APPROVAL', 'Approval']], test: (e, v) => e.rules.countingMethod === v }],
    columns: [
      { key: 't', label: 'Election', render: (e) => `<a href="#/app/elections/${e.id}" class="strong" style="text-decoration:none">${esc(e.title)}</a>`, sortVal: (e) => e.title },
      { key: 'ty', label: 'Type', render: typeLabel },
      { key: 's', label: 'Status', render: (e) => status(e.status), sortVal: (e) => LIFECYCLE.indexOf(e.status) },
      { key: 'reg', label: 'Registration', render: (e) => `<span class="small">until ${fmtShort(e.rules.campaignStart)}</span>` },
      { key: 'camp', label: 'Campaign', render: (e) => `<span class="small">${fmtShort(e.rules.campaignStart)} → ${fmtShort(e.rules.campaignEnd)}</span>` },
      { key: 'vote', label: 'Voting', render: (e) => `<span class="small">${fmtShort(e.rules.votingStart)} → ${fmtShort(e.rules.votingEnd)}</span>`, sortVal: (e) => e.rules.votingStart || 0 },
      { key: 'c', label: 'Candidates', render: (e) => approved(e.id).length, sortVal: (e) => approved(e.id).length },
      { key: 'v', label: 'Eligible voters', render: (e) => e.eligible.length, sortVal: (e) => e.eligible.length },
      { key: 'r', label: 'Readiness', render: (e) => (isCompleted(e) ? '—' : `${readinessScore(e)}%`), sortVal: readinessScore },
      { key: 'adm', label: 'Administrator', render: (e) => esc(adminName(e)) },
      { key: 'upd', label: 'Last updated', render: (e) => ago(e.updated), sortVal: (e) => e.updated },
      { key: 'a', label: 'Actions', render: (e) => `<div class="row" style="flex-wrap:nowrap">${btn(ro ? 'Inspect' : 'Manage', { href: `/app/elections/${e.id}`, size: 'sm', variant: 'secondary' })}${isOwner && can('ASSIGN_ELECTION_ADMINS') ? btn('Assign admin', { size: 'sm', variant: 'ghost', act: 'assign-admin', data: { eid: e.id } }) : ''}</div>` },
    ],
  });
  return `${pageHead(isOwner ? 'Election oversight' : ro ? 'Elections (read-only)' : 'All elections', isOwner ? 'Every election in the organization, its administrator, stage and readiness.' : 'Every election you can access, with its schedule and readiness.', can('CREATE_ELECTION') ? btn('Create election', { href: '/app/elections/new', icon: 'add' }) : '')}${card('', t, { flush: true })}`;
}
ACT['assign-admin'] = (el) => {
  const e = election(el.dataset.eid); const admins = S.users.filter((u) => u.role === 'ELECTION_ADMIN' && u.status === 'ACTIVE');
  confirmDlg({ title: `Assign administrator · ${esc(e.title)}`, body: field('Election administrator', 'adm', select('adm', admins.map((u) => [u.id, u.name]), e.adminId)), confirmLabel: 'Assign', onConfirm: async () => { const v = $('#adm').value; await api(() => { e.adminId = v; e.updated = Date.now(); audit('ELECTION_ADMIN_ASSIGNED', `${user(v).name} assigned to ${e.title}`, { eid: e.id }); notify([v], { title: 'You were assigned an election', msg: e.title, cat: 'Election', eid: e.id, to: `/app/elections/${e.id}` }); }); toast('success', 'Administrator assigned.'); setTimeout(rerender, 0); } });
};

// ---------- Election detail (tabs) ----------
const MANAGE_TABS = [['overview', 'Overview'], ['candidates', 'Candidates'], ['voters', 'Voters'], ['rules', 'Rules'], ['lifecycle', 'Operations'], ['results', 'Results'], ['progress', 'Progress'], ['timeline', 'Timeline'], ['trust', 'Trust'], ['bulletin', 'Bulletin board']];
function electionManage({ id }) {
  const e = election(id); if (!e) return empty('Election not found', '', btn('All elections', { href: '/app/elections' }));

function parseVoterList(text, e) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  let cells = [];
  if (lines.length && /(^|,)\s*email\s*(,|$)/i.test(lines[0])) { const cols = lines[0].split(',').map((c) => c.trim().toLowerCase()); const ix = cols.indexOf('email'); cells = lines.slice(1).map((l, i) => ({ row: i + 2, raw: (l.split(',')[ix] || '').trim() })); }
  else { let n = 0; lines.forEach((l) => l.split(/[,;]/).map((c) => c.trim()).filter(Boolean).forEach((c) => cells.push({ row: ++n, raw: c }))); }
  const seen = new Set();
  return cells.map((c) => {
    const em = c.raw.toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return { ...c, kind: 'invalid', why: 'Not a valid email address' };
    if (seen.has(em)) return { ...c, kind: 'dup', why: 'Duplicate in this file' };
    seen.add(em);
    if (e.eligible.map((x) => x.toLowerCase()).includes(em)) return { ...c, kind: 'dup', why: 'Already on the voter list' };
    return { ...c, kind: 'valid', why: userByEmail(em) ? `Member: ${userByEmail(em).name}` : 'Not yet a member (needs an invitation to sign in)' };
  });
}
